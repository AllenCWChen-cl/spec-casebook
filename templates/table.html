<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<style>
/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#1b2430; --muted:#5f6b7a; --line:#dde1e7; --head:#2f3b52;
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
  --body:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e5e9ef; --muted:#9aa5b3; --line:#2c3541; --head:#0d1117;
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
header{background:var(--head);color:#fff;padding:18px 20px;display:grid;gap:8px}
header h1{margin:0;font-size:1.35rem}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;opacity:.9}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 20px 110px;display:grid;gap:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1150px;background:var(--surface)}
th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:13px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
header .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.lang button{font:600 .82rem var(--body);border:0;background:transparent;color:#fff;padding:4px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--head)}
.lang button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.zh{font-size:.8rem;line-height:1.45;color:var(--muted);padding:2px 4px 0;white-space:pre-wrap;border-left:2px solid var(--edit-soft);margin-left:2px}
.zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
.reason .zh{font-family:var(--body);margin-top:2px}
tr.section .zhs{font-weight:500;color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="h"></h1><div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="zh" aria-pressed="false">中文</button></div></div>
  <div class="facts" id="facts"></div>
</header>
<main>
  <details class="panel" id="planBox" hidden><summary data-zh="更新計畫">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-zh="從 spec 擷取的需求">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th>ID</th><th data-zh="前置條件">Precondition</th><th data-zh="操作">Action</th><th data-zh="預期結果">Expected Result</th><th data-zh="優先度">Priority</th><th data-zh="Spec 出處">Spec Ref</th><th data-zh="備註">Notes</th><th id="decHead" data-zh="決定">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-zh="複製最終 CSV">Copy final CSV</button>
    <button class="btn" id="copyDec" data-zh="複製決定清單">Copy decisions</button>
    <button class="btn primary" id="save" data-zh="存成核准版測試表">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
const D=/*__DATA__*/null;
const FIELDS=['Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const EDIT=['Precondition','Action','Expected Result','Spec Ref','Notes'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REVIEW=D.mode==='review';
// the other pages: scripts/pages.ts names them (window.CASEBOOK); a static cases.html links to coverage.html beside it
const PAGES=window.CASEBOOK?.pages??(location.protocol==='file:'?{coverage:'coverage.html'}:{});
const KEY='casebook:'+D.feature+':'+D.platform+':'+D.draft;
// Language: the page's own words switch with tx(en,zh) and data-zh; rows stay English (the table's language)
// and show their Chinese reading from D.zh underneath in 中文 mode.
const ZH=D.zh||{};
let LANG='en';try{if(localStorage.getItem('casebook-lang')==='zh')LANG='zh'}catch(e){}
const tx=(en,zh)=>LANG==='zh'?zh:en;
const WORD={new:'新增',modified:'修改',removed:'移除',unchanged:'未變',kept:'保留',edited:'已編輯',added:'已新增',deleted:'刪除'};
const word=w=>tx(w,WORD[w]||w);
// state: each row keeps its original values, current values, and the decision (keep/delete)
let rows=D.rows.map((r,i)=>({orig:{...r},cur:{...r},dec:r.Change==='removed'?'delete':'keep',added:false,i}));
// new-case notes (user, 2026-10-28): + Add case opens a free-text box under the section header instead of a blank row;
// Save and Copy decisions hand the text to the agent, which writes the rows (section, precondition, spec ref) in a new draft
let notes=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(REVIEW&&s&&s.rows){rows=s.rows;notes=s.notes||[];}}catch(e){}
const F={q:'',section:'',change:'',state:''};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({rows,notes}))}catch(e){}};
const liveNotes=()=>notes.filter(n=>n.text.trim());
const edited=r=>!r.added&&FIELDS.some(f=>(r.cur[f]??'')!==(r.orig[f]??''));
const state=r=>r.dec==='delete'?'deleted':r.added?'added':edited(r)?'edited':'kept';
const sections=()=>[...new Set(rows.map(r=>r.cur.Section||'(no section)'))];
function nextId(){const nums=rows.map(r=>+(String(r.cur.ID).match(/(\d+)$/)||[0,0])[1]);const pre=(String(rows[0]?.cur.ID||'TC-000').match(/^(.*?)(\d+)$/)||[0,'TC-'])[1];return pre+String(Math.max(0,...nums)+1).padStart(3,'0')}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',6000)}
function md(src){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=false,table=null;
  const flush=()=>{if(list){out.push('</ul>');list=false}if(table){out.push('<table>'+table.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');table=null}};
  for(const line of src.split(/\r?\n/)){
    const l=line.trim();
    if(/^\|/.test(l)){if(/^\|[\s:|-]+\|?$/.test(l))continue;if(list){out.push('</ul>');list=false}(table??=[]).push(l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue}
    if(table)flush();
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){flush();out.push(`<h${Math.min(4,h[1].length+1)}>${inline(h[2])}</h${Math.min(4,h[1].length+1)}>`);continue}
    if(/^[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.replace(/^[-*]\s+/,''))}</li>`);continue}
    flush();if(l)out.push(`<p>${inline(l)}</p>`);
  }
  flush();return out.join('');
}
function header(){
  const plat=D.platform==='ios'?'iOS':'Android';
  $('#h').textContent=`${D.title} · ${plat} · ${REVIEW?tx('Cases','案例'):tx('Approved test cases','核准版測試案例')}`;
  document.title=$('#h').textContent;
  const f=[];
  if(REVIEW){f.push(`${tx('Draft','草稿')} <code>${esc(D.draft)}</code>`);f.push(D.based_on_version?tx(`Updates approved version ${D.based_on_version}`,`更新核准版本 ${D.based_on_version}`):tx('No approved table yet','尚無核准版測試表'));}
  else f.push(tx(`Version ${D.version} · approved ${esc((D.approved_at||'').slice(0,10))}`,`版本 ${D.version} · 核准於 ${esc((D.approved_at||'').slice(0,10))}`));
  f.push(`Spec: ${D.spec_files.map(s=>esc(s.name)).join(', ')}`);
  if(LANG==='zh'&&!Object.keys(ZH).length)f.push('（這份表還沒有中文譯文，只顯示英文）');
  $('#facts').innerHTML=f.map(x=>`<span>${x}</span>`).join('');
  if(D.update_plan){if($('#planBox').hidden)$('#planBox').open=true;$('#planBox').hidden=false;$('#plan').innerHTML=md(D.update_plan)}
  if(D.requirements){$('#reqBox').hidden=false;$('#req').innerHTML=md(D.requirements)}
  if(!REVIEW){document.body.classList.add('view');$('#decHead').hidden=true;$('#copyDec').hidden=true;$('#save').hidden=true}
  if(REVIEW&&!D.save){$('#save').disabled=true;$('#save').title=tx('Open this page through scripts/review.ts to save.','請透過 scripts/review.ts 開啟此頁才能存檔。')}
  $('#foot').textContent=REVIEW?tx('Edits and new-case notes are kept in this browser until you save. Save writes the approved CSV, keeps the previous version in history/, regenerates the Excel and HTML views, and hands new-case notes to the agent for the next draft. Edit the English text; the Chinese is a reading aid.','修改與新案例筆記會先存在這個瀏覽器，直到你按存檔。存檔會寫入核准版 CSV、把前一版留在 history/、重新產生 Excel 與 HTML，並把新案例筆記交給 agent 用於下一版草稿。請修改英文內容，中文僅供閱讀參考。'):tx('Read-only view generated from cases.csv.','由 cases.csv 產生的唯讀檢視。');
}
// Fixed text carries its Chinese in data-zh; the English is kept in data-en the first time it is swapped.
function applyStatic(){
  document.querySelectorAll('[data-zh]').forEach(el=>{if(el.dataset.en==null)el.dataset.en=el.innerHTML;el.innerHTML=LANG==='zh'?el.dataset.zh:el.dataset.en});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===LANG)));
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';
}
function setLang(l){LANG=l;try{localStorage.setItem('casebook-lang',l)}catch(e){}applyStatic();header();filters();body();counts()}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
function filters(){
  const cnt=(k,v)=>rows.filter(r=>k==='change'?(r.cur.Change||'')===v:state(r)===v).length;
  const changes=['new','modified','removed','unchanged'].filter(v=>cnt('change',v));
  const states=['kept','edited','added','deleted'];
  let h=`<input type="search" id="q" placeholder="${tx('Search ID or text','搜尋 ID 或文字（中英皆可）')}" value="${esc(F.q)}"><select id="sec"><option value="">${tx('All sections','所有區塊')} (${rows.length})</option>${sections().map(s=>`<option value="${esc(s)}"${F.section===s?' selected':''}>${esc(secLabel(s))}</option>`).join('')}</select>`;
  if(changes.length){h+=`<span class="sep"></span>`+[['',tx('All changes','所有變更')],...changes.map(c=>[c,word(c)])].map(([v,l])=>`<button class="chip" data-k="change" data-v="${v}" aria-pressed="${F.change===v}">${l}${v?` <b>${cnt('change',v)}</b>`:''}</button>`).join('')}
  if(REVIEW)h+=`<span class="sep"></span>`+[['',tx('Any decision','所有決定')],...states.map(s=>[s,word(s)])].map(([v,l])=>`<button class="chip" data-k="state" data-v="${v}" aria-pressed="${F.state===v}">${l}${v?` <b>${cnt('state',v)}</b>`:''}</button>`).join('');
  $('#filters').innerHTML=h;
  $('#q').oninput=e=>{F.q=e.target.value;body()};
  $('#sec').onchange=e=>{F.section=e.target.value;body()};
  $('#filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;filters();body()});
}
function visible(r){
  const z=ZH[r.cur.ID]||{};
  const t=(r.cur.ID+' '+FIELDS.map(f=>r.cur[f]).join(' ')+' '+Object.values(z).join(' ')).toLowerCase();
  return (!F.q||t.includes(F.q.toLowerCase()))&&(!F.section||(r.cur.Section||'(no section)')===F.section)&&(!F.change||(r.cur.Change||'')===F.change)&&(!F.state||state(r)===F.state);
}
function cell(r,f){
  const prev=D.previous[r.cur.ID];
  const was=prev&&r.cur.Change==='modified'&&(prev[f]??'')!==(r.orig[f]??'')?`<div class="was">${esc(prev[f])}</div>`:'';
  return `<td><textarea data-id="${esc(r.cur.ID)}" data-f="${f}" rows="2">${esc(r.cur[f])}</textarea>${zhLine(r,f)}${was}</td>`;
}
// The Chinese reading under a field, in 中文 mode only; flagged when the English was edited after translation.
function zhLine(r,f){
  const z=LANG==='zh'&&ZH[r.cur.ID]?.[f];
  if(!z)return '';
  const stale=!r.added&&(r.cur[f]??'')!==(r.orig[f]??'');
  return `<div class="zh${stale?' stale':''}" data-stale="英文已修改，此譯文為修改前的內容">${esc(z)}</div>`;
}
// A section's Chinese name is taken from any row of that section.
function secZh(s){const r=rows.find(x=>(x.cur.Section||'(no section)')===s&&ZH[x.cur.ID]?.Section);return r?ZH[r.cur.ID].Section:''}
const secLabel=s=>LANG==='zh'&&secZh(s)?`${s} · ${secZh(s)}`:s;
function idCell(r){
  const st=state(r),ch=r.cur.Change;
  const badges=[ch&&ch!=='unchanged'?`<span class="badge b-${ch}">${word(ch)}</span>`:'',REVIEW&&st!=='kept'?`<span class="badge b-${st==='deleted'?'removed':st}">${word(st)}</span>`:''].join(' ');
  // opens the coverage page on this case: its requirements, the spec boards they come from, the controls it presses
  // and the run plan on it: the segment that runs it and its latest result
  const links=r.added?[]:[PAGES.coverage&&`<a class="spec" href="${esc(PAGES.coverage)}#case=${encodeURIComponent(r.cur.ID)}" title="Coverage: where in the spec this case comes from and the controls it presses">Coverage →</a>`,
    PAGES.plan&&`<a class="spec" href="${esc(PAGES.plan)}#case=${encodeURIComponent(r.cur.ID)}" title="Progress: the segment that runs this case and its latest result">Progress →</a>`,
    PAGES.results&&`<a class="spec" href="${esc(PAGES.results)}#case=${encodeURIComponent(r.cur.ID)}" title="Results: what each run found, with screenshots">Results →</a>`].filter(Boolean);
  const spec=links.length?`<div class="xl">${links.join('')}</div>`:'';
  const zr=LANG==='zh'&&ZH[r.cur.ID]?.['Change Reason'];
  return `${esc(r.cur.ID)}<div>${badges}</div>${spec}${r.cur['Change Reason']?`<div class="reason">${esc(r.cur['Change Reason'])}${zr?`<div class="zh">${esc(zr)}</div>`:''}</div>`:''}`;
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(s)}${LANG==='zh'&&secZh(s)?`<span class="zhs">${esc(secZh(s))}</span>`:''} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="${tx('Describe new cases in your own words; they become rows in the next draft','用自己的話描述新案例，下一版草稿會把它們變成表格列')}">${tx('+ Add case','+ 新增案例')}</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>${tx('New case notes','新案例筆記')}</b><span>${tx('Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.','用自己的話寫下要測什麼，一個或多個案例皆可。按存檔或複製決定後，agent 會把每個案例放到正確區塊、填好欄位並提出下一版草稿。')}</span><button class="add" data-del="${esc(n.id)}">${tx('Remove','移除')}</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">${tx('Keep','保留')}</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">${tx('Delete','刪除')}</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">${tx('No cases match these filters.','沒有符合篩選條件的案例。')}</td></tr>`;
  const find=id=>rows.find(r=>r.cur.ID===id);
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm('Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('textarea[data-id],select').forEach(el=>{if(!REVIEW){el.readOnly=true;return}el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function counts(){
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  $('#counts').innerHTML=REVIEW?tx(`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`,`最終測試表 <b>${fin}</b> 筆 · 保留 ${c('kept')} · 已編輯 ${c('edited')} · 已新增 ${c('added')} · 刪除 ${c('deleted')}${nn?` · 下一版草稿的新案例筆記 <b>${nn}</b> 則`:''}`):tx(`<b>${rows.length}</b> cases`,`<b>${rows.length}</b> 筆案例`);
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=tx(label+' copied.','已複製'+label+'。');try{await navigator.clipboard.writeText(text);toast(ok)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok)}catch(_){toast(tx('Copy failed; select the text manually.','複製失敗，請手動選取文字。'))}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),tx('Final CSV','最終 CSV'));if(liveNotes().length)setTimeout(()=>toast(tx('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.','已複製最終 CSV。新案例筆記還不是表格列：請用「複製決定」或存檔交給 agent。')),50)};
$('#copyDec').onclick=()=>copy(decisionText(),tx('Decisions','決定清單'));
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(tx(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`,`存檔前請填寫 ${empty.map(r=>r.ID).join(', ')} 的操作與預期結果。`));return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(tx(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''),`已存成核准版本 ${j.version}：${j.cases} 筆案例。${j.csv}`+(nn?` · ${nn} 則新案例筆記已存到 ${j.notes_file}：請 agent 把它們做成下一版草稿。`:'')));
  }catch(e){toast(tx('Save failed: ','存檔失敗：')+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
applyStatic();header();filters();body();counts();focusRow();
</script>
</body>

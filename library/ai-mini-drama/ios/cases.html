<style>
/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#1b2430; --muted:#5f6b7a; --line:#dde1e7; --head:#2f3b52;
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
  --body:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e5e9ef; --muted:#9aa5b3; --line:#2c3541; --head:#0d1117;
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
header{background:var(--head);color:#fff;padding:18px 20px;display:grid;gap:8px}
header h1{margin:0;font-size:1.35rem}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;opacity:.9}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 20px 110px;display:grid;gap:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1150px;background:var(--surface)}
th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:13px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
</style>
</head>

  <p class="note" id="foot"></p>
</main>

  <span style="display:flex;gap:8px;flex-wrap:wrap">

    <button class="btn" id="copyDec">Copy decisions</button>
    <button class="btn primary" id="save">Save as approved table</button>
  </span>
</footer>

t for the 「AI Mini Drama with Seedance 2.0 >」 banner and tap it","Expected Result":"AI Mini Drama landing page opens","Priority":"P2","Spec Ref":"R-002","Notes":"Banner rotation is CMS-driven; Blocked if it never appears"},{"ID":"TC-003","Section":"Entry and landing","Precondition":"AI Mini Drama landing open","Action":"Look at the landing page","Expected Result":"Shows 「Hi, I'm your」「AI Drama Assistant」, 「Describe your idea and watch it come to life as a short drama.」, 「Create Your Drama」, 「Start from a template」 with 「More」 and a template grid; header has back, credit pill and History; each template thumbnail is the template's poster still","Priority":"P1","Spec Ref":"R-003, R-289","Notes":"Regression DRI261893-0051 (Assigned, untagged): The \"Hi, I'm your\" text has a shadow on it — also recheck this ticket here. Q-18: are templates US and JP only on day 1?"},{"ID":"TC-004","Section":"Entry and landing","Precondition":"Landing open; 6 or more templates","Action":"Check the template row header","Expected Result":"「More」 is shown next to 「Start from a template」","Priority":"P3","Spec Ref":"R-004","Notes":"Fewer-than-6 branch needs a server config"},{"ID":"TC-005","Section":"Entry and landing","Precondition":"Landing open","Action":"Compare the credit pill with Mine → credits","Expected Result":"The pill shows the current credit balance","Priority":"P2","Spec Ref":"R-005","Notes":"Regression DRI261894-0001 (RDResolved, AIAgent): Template preview show stale credit balance after a credit deduction — also recheck this ticket here"},{"ID":"TC-006","Section":"Templates","Precondition":"Landing open","Action":"Tap 「More」","Expected Result":"All-categories page opens: categories with icon and name (Office Romance, Fantasy World, Urban Romance, Family & Life, Animated Stories), each a row of covers with names","Priority":"P2","Spec Ref":"R-006","Notes":""},{"ID":"TC-007","Section":"Templates","Precondition":"Landing open","Action":"Tap a template cover","Expected Result":"Template detail opens; the template video plays automatically with sound; 「Make my version」 is shown","Priority":"P1","Spec Ref":"R-007","Notes":""},{"ID":"TC-008","Section":"Templates","Precondition":"Template detail playing","Action":"Tap the video; tap ▶; then tap the volume icon twice","Expected Result":"The first tap pauses the video (pause & volume off state); ▶ resumes playback; each tap on the volume icon switches the sound off and back on, and the icon follows (volume off / volume on)","Priority":"P3","Spec Ref":"R-008, R-319","Notes":""},{"ID":"TC-009","Section":"Templates","Precondition":"Template detail open","Action":"Tap 「Make my version」","Expected Result":"A chat starts for the template and asks 「What format would you like for your video?」 before any outline is generated","Priority":"P1","Spec Ref":"R-009","Notes":""},{"ID":"TC-010","Section":"Templates","Precondition":"All-categories page open","Action":"Read every template name","Expected Result":"Names are spelled correctly, e.g. 「Six Things You Didn't Know」 with an apostrophe","Priority":"P3","Spec Ref":"R-010","Notes":"Q-1: design file itself omits the apostrophe; Regression DRI261893-0158 (NewCreated, AIAgent): Template title \"Six Things You Didnt Know\" is missing its apostrophe — also recheck this ticket here"},{"ID":"TC-011","Section":"Idea input","Precondition":"Landing open","Action":"Tap 「Create Your Drama」","Expected Result":"An empty chat opens with placeholder 「Enter your idea to create drama」 and a mic button","Priority":"P1","Spec Ref":"R-011","Notes":""},{"ID":"TC-399","Section":"Idea input","Precondition":"Empty chat (after TC-011)","Action":"Tap the mic button without speaking; then tap it again (or its cancel control) to stop","Expected Result":"Voice input starts: a listening state shows (on first use iOS first asks for microphone or speech-recognition access); stopping it leaves the input empty and the composer ready for typing","Priority":"P2","Spec Ref":"R-011, R-331","Notes":"Needs no speech: Appium cannot give the phone speech, so TC-191 covers the transcription. An iOS permission prompt is a system setting: record it and ask the user before answering it"},{"ID":"TC-012","Section":"Idea input","Precondition":"Empty chat, input focused","Action":"Look above the input","Expected Result":"「Surprise me」 and two inspiration chips are shown","Priority":"P2","Spec Ref":"R-012","Notes":""},{"ID":"TC-013","Section":"Idea input","Precondition":"Empty chat with inspiration chips","Action":"Tap an inspiration chip","Expected Result":"The chip text is placed in the input (not sent)","Priority":"P2","Spec Ref":"R-013","Notes":""},{"ID":"TC-014","Section":"Idea input","Precondition":"Empty chat","Action":"Tap 「Surprise me」 twice","Expected Result":"First tap fills the input with an inspiration; second tap appends another inspiration after the existing text instead of replacing it","Priority":"P2","Spec Ref":"R-014","Notes":"Regression DRI261893-0124 (NewCreated, AIAgent) — Conflicts with the append rule in TC-014 (DRI261895P0023); recheck against the current spec.: Surprise me changes its suggestion within one landing session — also recheck this ticket here; Regression DRI261895P0023 (NewCreated, AIAgent): Surprise me replaces the composer instead of appending its suggestion — also recheck this ticket here"},{"ID":"TC-380","Section":"Idea input","Precondition":"Empty chat; the two inspiration chips noted","Action":"Tap 「Surprise me」 five times, clearing the input each time","Expected Result":"No pick is one of the two chips' strings","Priority":"P3","Spec Ref":"R-287","Notes":"Pool of 10 (R-014)"},{"ID":"TC-015","Section":"Idea input","Precondition":"Empty chat","Action":"Paste a 1,050-character text into the input","Expected Result":"Input keeps the first 1,000 characters; counter shows red 「1000/1000」; 「You've reached the 1,000-character limit.」 is shown","Priority":"P2","Spec Ref":"R-015","Notes":"Q-2"},{"ID":"TC-016","Section":"Idea input","Precondition":"Input at 1,000 characters","Action":"Type one more character","Expected Result":"Nothing is added; limit message remains","Priority":"P2","Spec Ref":"R-015","Notes":""},{"ID":"TC-017","Section":"Idea input","Precondition":"Input at 1,000 characters","Action":"Delete one character","Expected Result":"Counter is no longer red and the limit message disappears","Priority":"P3","Spec Ref":"R-015","Notes":""},{"ID":"TC-018","Section":"Idea input","Precondition":"Input with ~400 characters","Action":"Dismiss the keyboard","Expected Result":"The input collapses to at most 3 lines","Priority":"P3","Spec Ref":"R-016","Notes":""},{"ID":"TC-372","Section":"Idea input","Precondition":"Empty chat, keyboard open","Action":"Type until the text passes the input box's maximum height","Expected Result":"The box grows with the text up to its maximum height; further text scrolls inside the box and covers no other control","Priority":"P3","Spec Ref":"R-273","Notes":""},{"ID":"TC-373","Section":"Idea input","Precondition":"Chat with an outline, keyboard open","Action":"Type until the text passes the input box's maximum height","Expected Result":"The box grows with the text up to its maximum height; further text scrolls inside the box and covers no other control","Priority":"P3","Spec Ref":"R-273","Notes":""},{"ID":"TC-019","Section":"Idea input","Precondition":"Chat with at least one message","Action":"Look above the input, then tap 「More ideas +」","Expected Result":"「More ideas +」 chip is shown; tapping it offers more story ideas for the input (record what appears, Q-19)","Priority":"P3","Spec Ref":"R-017, R-318","Notes":""},{"ID":"TC-020","Section":"Format card","Precondition":"Empty chat","Action":"Send an idea (e.g. 「A barista and a regular fall in love over a lost umbrella」)","Expected Result":"Assistant asks 「What format would you like for your video?」 with 1. Video language (English, Spanish, French, German, Japanese, Korean, Chinese) and 2. Captions (「Yes, include captions」/「No captions」); no aspect-ratio question","Priority":"P1","Spec Ref":"R-018","Notes":"Regression DRI261893-0118 (NewCreated, AIAgent) — Design-first: the current format card has no aspect-ratio choice (TC-020); confirm before rechecking.: Format setup has no aspect-ratio selection — also recheck this ticket here"},{"ID":"TC-021","Section":"Format card","Precondition":"Format card shown","Action":"Tap another language, then another caption option","Expected Result":"Only one option per group is selected","Priority":"P2","Spec Ref":"R-018","Notes":""},{"ID":"TC-022","Section":"Format card","Precondition":"Format card shown","Action":"Tap the card's button","Expected Result":"Card is replaced by a user bubble 「1. Video language: \u003cx> / 2. Captions: \u003cYes|No>」","Priority":"P1","Spec Ref":"R-019","Notes":"Regression DRI261893-0011 (QANeedRework, AIFound): format card button reads \"Continue\" instead of the specified \"Generate\" — also recheck this ticket here"},{"ID":"TC-381","Section":"Format card","Precondition":"Empty chat","Action":"Type an idea without sending and tap Back; open a new chat, send an idea and tap Back at the format card; open History","Expected Result":"Each Back returns to the AI Mini Drama landing page with no dialog; History has no entry for either chat","Priority":"P2","Spec Ref":"R-288","Notes":""},{"ID":"TC-023","Section":"Story outline","Precondition":"Format confirmed","Action":"Watch the chat while the outline is generated","Expected Result":"Status text such as 「I'll create a story outline - give me a moment...」 / 「Writing your story...」 is shown","Priority":"P2","Spec Ref":"R-020","Notes":""},{"ID":"TC-024","Section":"Story outline","Precondition":"Outline generated","Action":"Read the result","Expected Result":"「Story Outline & Characters Result」 card shows the Story Outline and 「Possible Characters:」 with a description per character and a character slot row","Priority":"P1","Spec Ref":"R-021","Notes":""},{"ID":"TC-025","Section":"Story outline","Precondition":"Outline generating","Action":"Tap Back","Expected Result":"「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」 with 「Leave anyway」 and 「Stay」","Priority":"P1","Spec Ref":"R-022","Notes":""},{"ID":"TC-026","Section":"Story outline","Precondition":"Outline generating","Action":"Tap History (top right)","Expected Result":"Same 「Leave this chat?」 dialog appears","Priority":"P2","Spec Ref":"R-022","Notes":"Regression DRI261894P0049 (NewCreated, AIFound): Leave guard shows only on History icon, not Back, and says the job will stop — also recheck this ticket here"},{"ID":"TC-027","Section":"Story outline","Precondition":"Leave this chat? shown","Action":"Tap 「Stay」","Expected Result":"Dialog closes; chat remains and the outline still arrives","Priority":"P2","Spec Ref":"R-023","Notes":""},{"ID":"TC-028","Section":"Story outline","Precondition":"Leave this chat? shown","Action":"Tap 「Leave anyway」, then open History","Expected Result":"Chat closes; no entry for this idea appears in History","Priority":"P1","Spec Ref":"R-024","Notes":""},{"ID":"TC-394","Section":"Story outline","Precondition":"Outline generating for a new idea","Action":"Tap Back, then 「Leave anyway」","Expected Result":"The chat closes and the AI Mini Drama home page opens (「Hi, I'm your AI Drama Assistant」, 「Create Your Drama」, 「Start from a template」)","Priority":"P2","Spec Ref":"R-309, R-261","Notes":"Landing page from Design 1016_Chat navigation ① (flow arrow 4877-33087); dialog copy from PM 10/21 (REQ-029). TC-028 checks that History keeps nothing"},{"ID":"TC-357","Section":"Story outline","Precondition":"Outline generating","Action":"Tap New chat, then 「Stay」; tap the credit pill, then 「Stay」","Expected Result":"Each tap shows 「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」 with Leave anyway / Stay; Stay closes it, the chat stays and the outline still arrives","Priority":"P2","Spec Ref":"R-261" e the story","Expected Result":"The story continues from the last saved stage; nothing already made is lost","Priority":"P3","Spec Ref":"R-180","Notes":"Colleague direction; the spec is silent. If it cannot continue, disposition spec-addition"},{"ID":"TC-323","Section":"Credits and limits","Precondition":"An account that has never used AI Mini Drama","Action":"Create a character, a storyboard and a video, then try a credit feature outside AI Mini Drama","Expected Result":"Free-use credits are granted once and pay for the three AI Mini Drama steps; they are not offered elsewhere; after they run out own credits are charged","Priority":"P2","Spec Ref":"R-181","Notes":""},{"ID":"TC-324","Section":"Credits and limits","Precondition":"An account in its first-time free use","Action":"Open the image generation step and the video settings card","Expected Result":"The model is preset and cannot be changed","Priority":"P2","Spec Ref":"R-182","Notes":""},{"ID":"TC-325","Section":"Chat behaviour","Precondition":"Chat with a reply being generated","Action":"Run each: (1) Send, then Stop while it replies; (2) Stop, edit the input, Send, Stop; (3) Stop, Back, reopen the chat from History; (4) Back while it replies, return, Stop","Expected Result":"The app never crashes or restarts; the chat is usable after each sequence","Priority":"P2","Spec Ref":"R-183","Notes":""},{"ID":"TC-326","Section":"Characters","Precondition":"Change Characters open on the built-in character templates","Action":"Tap several templates one after another","Expected Result":"The other thumbnails stay visible; none blanks or flickers while another is selected","Priority":"P3","Spec Ref":"R-184","Notes":"Record the screen (Appium) to catch a short blank"},{"ID":"TC-327","Section":"History","Precondition":"History open","Action":"Tap the ⓘ button","Expected Result":"The info bubble opens with its arrow pointing at the ⓘ button and stays fully on screen","Priority":"P3","Spec Ref":"R-185","Notes":"TC-105 covers the text and the outside tap"},{"ID":"TC-328","Section":"Templates","Precondition":"More page open","Action":"Look at each category header","Expected Result":"Each category shows its own icon as in Design, not one icon repeated","Priority":"P3","Spec Ref":"R-186","Notes":""},{"ID":"TC-329","Section":"Build checks","Precondition":"Every character in the cast has a look","Action":"Ask Iris to regenerate all the characters, answer any question, then tap Generate","Expected Result":"A priced 「Create characters」 offer appears (not an empty picker); Generate completes with new looks, charged once","Priority":"P2","Spec Ref":"R-187","Notes":"Retire after it passes on two builds"},{"ID":"TC-330","Section":"Build checks","Precondition":"Video whose captions failed","Action":"Open a scene's details and play its scene video","Expected Result":"No missing-caption marker or caption error card in scene details; the scene video plays with no error overlay","Priority":"P3","Spec Ref":"R-188","Notes":"Retire after it passes on two builds"},{"ID":"TC-331","Section":"Build checks","Precondition":"Video finished; Appium confirmed on USB","Action":"Tap download, turn Wi-Fi off before it finishes, turn it back on, then tap download again","Expected Result":"The first attempt ends its spinner with an error; the second shows the spinner, then 「Saved to your device.」","Priority":"P3","Spec Ref":"R-189","Notes":"Real network loss (REQ-020). Retire after it passes on two builds"},{"ID":"TC-332","Section":"Make your character","Precondition":"Valid Create my character form","Action":"Tap Generate, look at the generating screen and tap the dimmed 「generating...」 button","Expected Result":"「This usually takes about 1 minute.」 under the attribute chips; X stays enabled; 「Cancel」 under the Generating button; 「generating...」 is dimmed and a tap on it does nothing","Priority":"P2","Spec Ref":"R-245, R-460","Notes":"PM-only: no Design frame yet (Design 2026-10-19)"},{"ID":"TC-333","Section":"Make your nload icon are dimmed and do nothing; when done the spinner goes, the play button and the three controls return, the toast reads 「Saved to Photos.」 and the flattened video is in Photos","Priority":"P2","Spec Ref":"R-249","Notes":"PM Figma 10/22 (4418:2); PM-only: no Design frame yet"},{"ID":"TC-414","Section":"Video","Precondition":"Export Full Video running (spinner over the preview)","Action":"Tap the second scene's thumbnail, then wait for the export to end","Expected Result":"The preview switches to that scene and the export goes on; 「Saved to Photos.」 shows and the saved video in Photos is the whole drama, not the scene","Priority":"P2","Spec Ref":"R-338","Notes":"PM Figma 10/22 (4418:2); PM-only: no Design frame yet"},{"ID":"TC-415","Section":"Video","Precondition":"Export Full Video running (spinner over the preview)","Action":"Tap Back and stay on the chat page until the export ends","Expected Result":"Back works while exporting; the toast 「Saved to Photos.」 shows on the chat page when the export finishes, and the flattened video is in Photos","Priority":"P2","Spec Ref":"R-337","Notes":"PM Figma 10/22 (4418:2); PM-only: no Design frame yet. RD to confirm the export goes on after leaving; otherwise Back asks 「Stop exporting?」 (Q-21)"},{"ID":"TC-416","Section":"Video","Precondition":"Full video finished, result page open; Appium confirmed on USB","Action":"Tap 「Export Full Video」, turn Wi-Fi off before it finishes, read the result, turn Wi-Fi back on and tap 「Export Full Video」 again","Expected Result":"The first export ends with the toast 「Couldn't save your video. Try again.」; the spinner goes and Back, 「Full Edit」, 「Export Full Video」, the download icon, play and the thumbnails all work again; the second export saves (「Saved to Photos.」)","Priority":"P2","Spec Ref":"R-339","Notes":"PM Figma 10/22 (4418:2); PM-only: no Design frame yet. Real network loss (REQ-020); restore Wi-Fi right after. If the export still succeeds offline, record Blocked (needs a failu P3","Spec Ref":"R-253","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-348","Section":"Characters","Precondition":"Cast set","Action":"Ask in chat 「Can you change one of the characters to look older?」, then tap a character chip (e.g. 「The Manager」)","Expected Result":"「Sure! Which character would you like to change?」 with 2–4 option chips; tapping a chip sends it as a message and the chips disappear","Priority":"P2","Spec Ref":"R-254, R-430","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-391","Section":"Characters","Precondition":"Iris asked 「Which character would you like to change?」 with chips","Action":"Type the character's name and send it instead of tapping a chip","Expected Result":"Iris takes the typed answer as it would a chip and offers the 「Update characters」 card","Priority":"P3","Spec Ref":"R-301","Notes":""},{"ID":"TC-349","Section":"Characters","Precondition":"「Update characters • 1 character」 card shown (TC-045)","Action":"Tap Generate and wait","Expected Result":"The card disappears and Iris replies 「Working on it...」; then 「Here's your updated cast.」 with a new Story Outline & Characters card showing the new look, and 「Your characters' looks are updated! Ready to create the storyboard?」 with Create storyboard; Credit Details shows the card price charged once (the outline text is updated as well)","Priority":"P1","Spec Ref":"R-254, R-301","Notes":"PM 10/16 newer than Design (REQ-026)"},{"ID":"TC-350","Section":"Characters","Precondition":"Cast set","Action":"Ask in chat to change two characters' looks","Expected Result":"The card reads 「Update characters • 2 characters」 and its price is twice one character generation","Priority":"P2","Spec Ref":"R-254","Notes":"PM 10/16 newer than Design (REQ-026). Credit numbers are binding"},{"ID":"TC-351","Section":"Characters","Precondition":"Character update generating (「Working on it...」)","Action":"Tap Back","Expected Result":"「Stop and lose your credits?」/「This is still generating. If you TC-078"}],"previous":{},"requirements":"# AI Mini Drama — requirements (ios)\nSpec: AI Mini Drama - Design Spec.pdf, PDRM MX.pdf, AI Mini Drama - PM Spec 20261021.pdf (spec set specs/2026-10-21-2; board notes in specs/2026-10-21-2/extracted/board-notes.md, flow arrows in specs/2026-10-21-2/extracted/arrows.json)\nSource tags: [PM:\u003cboard>] / [DS:\u003cboard>] / [MX:\u003cboard>] = board id in specs/2026-10-21-2/extracted/boards/ (boards up to R-103 were read from the identical 2026-10-16 copies); [Req: REQ-…] = library/ai-mini-drama/requests.md; [Build: TR…] = RD Note on that Testing Request. Newest dated frame wins when frames disagree; Design > MX > PM.\n\n## Entry and landing\n- R-001 [PM:pm-main-flow] The Launcher shows an \"AI Mini Drama\" shortcut (small shortcuts, 4th) that opens AI Mini Drama.\n- R-002 [PM:pm-0930-updates] The Launcher hero banner \"AI Mini Drama with Seedance 2.0 >\" opens AI Mini Drama.\n- R-003 [DS:ds-home-custom-chat] The landing page shows \"Hi, I'm your AI Drama Assistant\", \"Describe your idea and watch it come to life as a short drama.\", a \"Create Your Drama\" button, \"Start from a template\" with \"More\", and a template grid; the header has back, credit pill and History.\n- R-004 [PM:pm-main-flow] \"More\" is hidden when there are fewer than 6 templates.\n- R-005 [PM:pm-top-mockups][DS:ds-mx-link] The credit pill shows the current credit balance.\n\n## Templates\n- R-006 [DS:ds-template-detail] \"More\" opens the all-categories page: categories with icon and name (Office Romance, Fantasy World, Urban Romance, Family & Life, Animated Stories), each a row of template covers with names.\n- R-007 [DS:ds-template-detail] Tapping a template opens its detail page: the template video plays automatically with sound, and a \"Make my version\" button is shown.\n- R-008 [DS:ds-template-detail] Tapping the playing template video pauses it (pause & volume off state).\n- R-009 [PM:pm-main-flow] \"Make my version\" starts a chat for that template and asks the format question before generating the outline.\n- R-010 [DS:ds-template-detail] Template names are spelled correctly (e.g. \"Six Things You Didn't Know\"). — Open question Q-1.\n\n## Idea input (composer)\n- R-011 [PM:pm-main-flow] \"Create Your Drama\" opens an empty chat with the input placeholder \"Enter your idea to create drama\" and a mic button.\n- R-012 [PM:pm-main-flow][DS:ds-home-custom-chat] Before typing, the composer shows \"Surprise me\" and two inspiration chips from CMS.\n- R-013 [PM:pm-main-flow] Tapping an inspiration chip puts its text into the input.\n- R-014 [PM:pm-main-flow] \"Surprise me\" puts a random inspiration (from a pool of 10) into the input; tapping it again appends to the existing text instead of replacing it.\n- R-015 [PM:pm-update-3] The idea input accepts at most 1,000 characters: at the limit the counter shows red \"1000/1000\", further typing is ignored, pasted text beyond the limit is cut, and \"You've reached the 1,000-character limit.\" is shown; deleting below 1,000 removes the red counter and the message. (Older DS frame: toast \"You've reached the maximum length\" — Q-2.)\n- R-016 [DS:ds-home-custom-chat] After the keyboard closes, a long input collapses to at most 3 lines.\n- R-017 [PM:pm-top-mockups] Once the chat has content, a \"More ideas +\" chip shows above the input.\n\n## Format card\n- R-018 [PM:pm-0930-updates] After the first idea is sent the assistant asks \"What format would you like for your video?\" with 1. Video language (English, Spanish, French, German, Japanese, Korean, Chinese) and 2. Captions (\"Yes, include captions\" / \"No captions\"), single choice per group, and a Continue/Generate button; no aspect-ratio question.\n- R-019 [PM:pm-1002-update] After the button the card is replaced by a user bubble \"1. Video language: \u003cx> / 2. Captions: \u003cYes|No>\".\n\n## Story outline\n- R-020 [PM:pm-0930-updates] While the outline is generated the chat shows status text (\"I'll create a story outline - give me a moment...\" / \"Writing your story...\").\n- R-021 [PM:pm-main-flow] The outline result is a \"Story Outline & Characters Result\" card: Story Outline text plus \"Possible Characters:\" with a description per character and a character slot row.\n- R-022 [PM:pm-update-4] Back / New Chat / History before the outline exists shows \"Leave this chat? / Your story outline isn't ready yet, so this chat won't be saved.\" with Leave anyway / Stay.\n- R-023 [PM:pm-update-4] Stay keeps the user in the chat and the outline keeps generating.\n- R-024 [PM:pm-update-4] Leave anyway stops generation; the chat is not saved and does not appear in History.\n- R-025 [PM:pm-update-4] Leaving after the outline exists saves the chat to History without a dialog; reopening it returns to the latest step.\n- R-026 [DS:ds-extra][PM:pm-0930-updates] Outline 5xxx failure shows the assistant message \"Something went wrong on my end. Let's try that again.\" with Try again, which resends the original idea and format.\n- R-027 [DS:ds-extra][PM:pm-0930-updates] Outline 4xxx failure shows \"I couldn't write a story from this idea. It may not meet our terms of service. Try describing it a different way.\" with no button; the next idea reuses the chosen format without showing the format card again.\n- R-028 [PM:pm-update-5][DS:ds-extra] Sending an idea or tapping an action button while offline shows \"You're offline. Check your connection and try again.\" — nothing is sent and nothing is charged; the card stays (Try again for a sent idea).\n\n## Characters (choose)\n- R-029 [PM:pm-main-flow] Tapping a character slot opens \"Change Characters\" with the cast tabs, \"Character Library\" (Create my character tile, library cards with \"My character\" tags) and a filter.\n- R-030 [PM:pm-1002-update] After a character is set, a hint \"Tap to choose a look for {name}\" points to the next unset slot (right first, then the leftmost); it disappears when any slot is tapped or after 5 s, and never shows once all are set.\n- R-031 [PM:pm-main-flow] The filter offers My characters only, Gender, Ethnicity and Age; applied filters show as removable chips.\n- R-032 [PM:pm-main-flow] Leaving the picker with unsaved picks asks \"Discard character changes? / The characters you picked here won't be saved if you leave.\" Discard / Keep Editing.\n- R-033 [PM:pm-main-flow] Confirming with unset characters shows \"{n} characters aren't set yet / They need a look before you can continue.\" (singular \"1 character isn't set yet / It needs a look…\") with \"Generate with AI ◆6×n\" and \"Choose myself\".\n- R-034 [PM:pm-main-flow] \"Generate with AI\" shows \"Generating...\" then \"Your character is all set!\" / \"{n} characters are all set!\" with Confirm.\n- R-035 [PM:pm-update-3] When some characters fail, successful ones are applied, failed slots show \"!\" and are refunded, and \"Couldn't create some images / {n} characters couldn't be created. Your credits have been refunded. Tap a character to try again.\" is shown.\n- R-036 [PM:pm-error-handling] A single character failure shows \"Couldn't create image / We couldn't create this character. Your credits have been refunded. Try again.\" with Got it, which returns to Change Characters.\n- R-037 [PM:pm-top-mockups] With every character set, the assistant says \"The characters look great! Ready to create the storyboard?\" with a Create storyboard card (price + Generate).\n- R-038 [PM:pm-update-7] When the user changes the story or a character in chat, Iris re-issues the \"Story Outline & Characters\" card; a character change adds \"Got it! I've updated the story. I can't redraw characters yet - tap the switch icon on a character to change its look.\", blue text \"Character looks aren't updated automatically. Tap the switch icon to change a character's look.\" and \"Switch any looks you'd like, then create the storyboard.\" — Changed 2026-10-22 (REQ-026): a clear request shows the priced Update characters card 0-113559] Scene detail with a long script → Drag inside the script → The script scrolls within its area.\n- R-125 [DS: flow arrow 3142-70055 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=3142-70055] Failed scene description editor open → Tap the collapse icon → Returns to the regeneration offer with the edited text.\n- R-126 [DS: flow arrow 3142-70056 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=3142-70056] Regeneration offer for a failed scene → Tap 「Regenerate Image」 → The scene shows a skeleton and regenerates; credits are charged once.\n- R-127 [DS: flow arrow 2778-129154 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2778-129154] Template drama with a finished storyboard → Generate the full video and wait → 「Here's your drama.」 shows the completed video with its Edit action.\n- R-128 [DS: flow arrow 2820-115460 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-115460] Finished video in the chat → Tap Play on the video → The scene-video player opens and plays.\n- R-129 [DS: flow arrow 4006-73627 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4006-73627] Scene video regenerating → Leave the scene editor and return to the chat → The existing video stays and the chat shows the scene-update status.\n- R-130 [DS: flow arrow 4006-73628 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4006-73628] Scene video regenerating, user in the chat → Wait for regeneration to finish → The chat replaces the old video with the refreshed one.\n- R-131 [DS: flow arrow 2820-116878 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-116878] Video with a failed scene clip → Tap Edit on the failed clip → The scene-video description editor opens.\n- R-132 [DS: flow arrow 2820-118509 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-118509] Failed scene-video editor open with edited text → Tap the collapse icon → Returns to the regeneration offer with the edited text.\n- R-133 [DS: flow arrow 2820-118510 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-118510] Failed scene-video editor open with edited text → Tap 「Done」 → Returns to the regeneration offer with the edited text.\n- R-134 [DS: flow arrow 2820-116880 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2820-116880] Regeneration offer for a failed clip → Submit the regeneration → Clip generation starts for that scene.\n- R-135 [DS:ds-video] Video result with failed scenes → Tap 「Fix scenes」 → The failed scene-video recovery view opens.\n- R-136 [DS: flow arrow 4078-177645 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4078-177645] Caption retry in progress (「Adding captions…」) → Wait for it to succeed → The captioned video replaces it and 「Captions couldn't be added」 disappears.\n- R-137 [DS: flow arrow 2831-134024 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=2831-134024] A regeneration offer with a balance below its price → Tap the credit action → The top-up panel opens.\n- R-138 [Rule 2: Stop notice] Stopping any running stage tells the user what stops and whether spent credits are lost, before or as it stops.\n- R-139 [Rule 2: leave and return] Leaving AI Mini Drama and returning at any stage shows the same task in a recognizable, usable state; nothing saved is lost without notice.\n- R-140 [Rule 2: wait thresholds (user, 2026-10-15)] A wait with no useful action other than leaving lasts at most 5 s without a waiting animation and at most 10 s with one.\n- R-141 [Rule 3: regression list (ECL query 2026-10-19)] Every open or resolved-not-closed AI Mini Drama iOS eBug is rechecked each run; its Expect Result is the expected behavior unless the Design spec differs.\n- R-142 [MX ① Free chat times, PDRM MX.pdf version A] Each tier has a remote-configured daily chat allowance (Free 10, Pro 30, Pro+ 100); opening a template, sending a typed message and tapping a task button each use one chat; the send after the allowance shows that tier's limit dialog.\n- R-143 [MX ① Free chat times, PDRM MX.pdf version A] At the limit: closing the dialog keeps the chat and the unsent text; every further send shows the dialog again; opening a template enters the chat first, then shows the dialog.\n- R-144 [MX ① Free chat times, PDRM MX.pdf version A] Subscribing from the limit dialog returns to the original chat with a Continue message; unused free chats are dropped and only the new tier's allowance applies.\n- R-145 [MX ① Free chat times, PDRM MX.pdf version A] The chat count is kept on the device; deleting and reinstalling the app restores the free chats.\n- R-146 [MX ② Charging flow, PDRM MX.pdf version A] When credits are short, a Paid user's card offers Buy Credit (Credit Panel opens on the 2000-credit pack) and a Free user's card offers Upgrade Now (subscription page); after buying, the charge is confirmed again; a card shown while short switches to the enough-credits copy when the user returns with enough credits.\n- R-147 [MX ② First-time credit discount, PDRM MX.pdf version A] Only a Free user who subscribes during an AI Mini Drama session gets the credit discount, on that session's action ids, once per lifetime; a new session, a resubscription and any regenerate after one discounted drama are charged at full price; Paid users never get it. — 2026-10-29 (REQ-059): the discount price is held until the user says the promotion applies; every row expects the original price.\n- R-148 [Rule 6: complete template catalog (user, 2026-10-15 and 2026-10-19)] Every template in the frozen roster opens, shows its preview and Make my version, and completes its own journey to a playable final video.\n- R-149 [Rule 7: text quality] Every product-authored text on every page and state is free of spelling, grammar and punctuation errors in ENU, CHT and JPN.\n- R-150 [Rule 7: generated text] Generated storyboard text uses the requested language, has no empty fields, unintended repetition or garbled characters, and English output uses English quote marks.\n- R-151 [Rule 8: colleague G01 custom media] The custom-character reference preview shows the selected photo, allowing for an explicit crop.\n- R-152 [Rule 8: colleague O01 required fields] Each required character field omitted on its own blocks Generate; the feedback shown is recorded per field.\n- R-153 [Rule 8: keyboard and layout] Entered text never overlaps adjacent controls, and editing can be finished and the task continued with the keyboard open or closed.\n- R-154 [Rule 8: data-driven facets] Filter values match the attributes present in the character collection, including Southeast Asian and Mixed, and an empty result is shown clearly.\n- R-155 [Rule 8: output reuse] A character created and saved in one drama can be found and applied in a later drama.\n\n## Added 2026-10-21 — coverage passes and standing inputs\nSkill sections \"Coverage passes\", \"Standing inputs\" and \"Value check\" (user approved 2026-10-21, REQ-018).\n\n### Job states\n- R-156 [PM:pm-update-6] When only the main scene image failed, Edit/Retry regenerates only the main image, reuses the Location image and charges one image.\n- R-157 [PM:pm-update-3 J5] A chat image update that partly fails keeps the successful images; failed ones are refunded and marked 「!」 with 「1 image couldn't be updated. Your credits have been refunded. Tap Edit to try again, or tell me what to change.」 and Edit.\n- R-158 [PM:pm-update-3 J4; PM:figma 10/22 Storyboard/Video two phases 4422:2 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4422-2; Req: REQ-052] A storyboard update asked for in chat (Generate on its 「Create storyboard」 card) follows the storyboard's two phases: leaving in phase ① asks 「Leave while we're preparing?」 with the storyboard body (「Stay」 / 「Leave anyway」); leaving in phase ② shows no dialog, only 「We'll keep making your storyboard. Find it in History.」, and the update finishes. — Changed 2026-10-29 (PM Figma 10/22, frame 4422:2): was 「Stop and lose your credits?」 (short task, no refund).\n- R-159 [DS:ds-storyboard 1012 update] When the whole storyboard fails: 「Something went wrong on my end.」 and 「ⓘ Storyboard couldn't be created. Try creating your storyboard again.」 with Try again.\n- R-160 [PM:pm-1002-update §13.8] A failed video regeneration keeps the old version and uses the chat partial-failure copy.\n- R-161 [PM:pm-1002-update §13.8] 「Your video has been updated.」 disappears after the video is played or the chat is left.\n- R-162 [PM:pm-update-5 §13.13] If the caption retry fails again, the error and Try again return; the video still has no captions.\n- R-163 [PM:pm-error-handling] A storyboard STT failure shows 「ⓘ Storyboard preview unavailable. Try again to generate the preview.」 with Retry.\n- R-164 [PM:pm-update-5 §5 (10/6)] Tapping an action card button with no network shows the toast 「You're offline. Check your connection and try again.」; nothing is sent or charged and the card stays.\n- R-165 [PM:pm-0930-updates §5] If the network drops while a generation runs, it resumes by itself after the network returns; the format card is not shown again. — Changed 2026-10-22 (REQ-032): PM 10/6 (pm-update-5) is newer than §5 of 09/30: the chat shows Try again instead of resuming by itself.\n- R-166 [PM:pm-0930-updates §3.2] Leaving while the storyboard price is calculated (「Thinking…」) shows no dialog.\n- R-167 [PM:pm-0930-updates] On the first 「Yes, create video」 the pre-prompt offers Notify me (then the iOS permission dialog) and Not now (never shown again).\n- R-168 [PM:pm-update-5 #4 (10/8)] The in-app toast and the push come once, only when the whole video is done; a partial or total failure, or a 6xxx auto-retry in progress, sends none.\n- R-169 [PM:pm-0930-updates §6.2] The task-completed toast offers Close (keeps the current page) and View (opens History).\n- R-170 [PM:pm-0930-updates §6.3] In the background a finished video sends one push 「Your drama is ready」/「\"{Drama title}\" is done. Tap to watch it.」; tapping it opens that chat at the video card.\n- R-171 [PM:pm-update-4 Bug 0016 §6.4] After a rename, the History card, the toast and the push use the new name.\n- R-172 [PM:pm-1002-update §13.1] The 「Tap to choose a look for {name}」 hint disappears when any slot is tapped and is not shown once every character is set.\n\n### Persistence\n- R-173 [PM:pm-1002-update §13.2] Returning from Full Edit keeps the chat position the user left. — Changed 2026-10-22 (REQ-032): PM 10/20 §13.2 ① — the chat opens at the bottom (newest message).\n- R-177 [PM:pm-update-4 Bug 0014] The History name is the drama title and follows title changes; a user Rename wins over later title changes.\n- R-178 [DS:ds-recent-task] The History thumbnail is the first storyboard frame once a storyboard exists; before that, the default thumbnail.\n- R-179 [DS:ds-video] After the full video, 「Ready for the next episode?」 offers 「Create Next Episode」, which starts the next episode of this drama.\n- R-180 [Req: REQ-011] After the user stops a generation, the story can be continued from the last saved stage in the same chat.\n\n### Fields\n- R-174 [PM:pm-update-3 §13.11; DS:ds-storyboard, ds-video (967/1000)] The 1,000-character limit applies to every description input, including the scene image and scene video descriptions: red 「1000/1000」, extra input ignored, pasted text cut, 「You've reached the 1,000-character limit.」; deleting below 1,000 clears both.\n- R-175 [PM:pm-error-handling; DS:ds-video] The scene-video description is plain editable text in sections 「Cinematic Style」, 「Scene」, 「Motion」, 「Camera」 (headings kept, one paragraph each) with the regenerate button priced by the model used.\n- R-176 [PM:pm-main-flow] A character takes one reference photo; choosing another replaces it.\n\n### MX\n- R-181 [MX:mx-b-m  Leave dialog opened by History, 「Leave anyway」 → Recent Task: the chat closes and Recent Task (the History list) opens.\n- R-308 [DS: flow arrow 4877-33083 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33083] Leave dialog opened by New chat, 「Leave anyway」 → new empty chat: the chat closes and a new empty chat opens (「Hi, I'm your AI Drama Assistant」, 「Surprise me」, idea suggestions, empty composer).\n- R-309 [DS: flow arrow 4877-33087 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33087] Leave dialog opened by Back, 「Leave anyway」 → AI Mini Drama home page: the chat closes and the AI Mini Drama home page opens (「Hi, I'm your AI Drama Assistant」, 「Create Your Drama」, 「Start from a template」).\n\n### Flow arrows walked by existing rows\n- R-310 [DS: flow arrow 4299-132149 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4299-132149] Failed scene detail, ⓘ on the 「Couldn't create image」 card → 4xx dialog: ⓘ opens 「Couldn't generate this image」 with the refund and terms-of-service text and 「Got it」 (5xx cards have no ⓘ, R-057). Walked by: TC-067.\n- R-311 [DS: flow arrow 4299-168955 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4299-168955] Failed scene detail, 「Edit」 on the error card → description editor: the full description becomes editable with the keyboard up, a x/1000 counter, a trash icon and 「Done」. Walked by: TC-070.\n- R-312 [DS: flow arrow 4877-33073 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33073] Chat, Back → leave dialog: while the outline generates, Back opens 「Leave this chat?」 with 「Leave anyway」 / 「Stay」 (PM 10/21 stage rules, R-261 – R-264). Walked by: TC-025.\n- R-313 [DS: flow arrow 4877-33075 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33075] Chat, credit pill → leave dialog: while the outline generates, the credit pill opens the same 「Leave this chat?」 dialog as Back. Walked by: TC-357.\n- R-314 [DS: flow arrow 4877-33077 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33077] Chat, New chat → leave dialog: while the outline generates, New chat opens the same 「Leave this chat?」 dialog as Back. Walked by: TC-357.\n- R-315 [DS: flow arrow 4877-33079 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33079] Chat, History → leave dialog: while the outline generates, History opens the same 「Leave this chat?」 dialog as Back. Walked by: TC-026.\n- R-316 [DS: flow arrow 4877-33085 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33085] Leave dialog opened by the credit pill, 「Leave anyway」 → My Credits: the chat closes and My Credits opens. Walked by: TC-358.\n- R-317 [DS: flow arrow 4877-33089 https://www.figma.com/design/dZk5HLzZTdcZwWwvN9aZfZ/AI-Mini-Drama?node-id=4877-33089] Leave dialog, 「Stay」 → chat: the dialog closes and the chat stays at the same stage; the outline still arrives. Walked by: TC-027, TC-357.\n\n### Controls (REQ-039)\nControls of the Figma inventory that no existing rule described; each is pressed by the row named in `control-trace.json`.\n- R-318 [DS: control K-20ac46 main flow · Storyboard & Preview / Chat (any stage)] 「More ideas +」: the chip above the composer offers more story ideas when tapped (the Design draws the chip on every chat stage but no result frame; Q-19).\n- R-319 [DS: control K-55f3b5 / K-940021 / K-cf0dd5 Template Detail · AI Mini Drama] Template video ▶ and volume icon: ▶ over the paused template video resumes playback (Default_playing & volume on); the volume icon at the video's bottom right switches the sound off and on and shows the current state (ic_volume / ic_volume_off).\n- R-320 [DS: control K-71866f MX · AI Mini Drama_characters] 「Continue Tomorrow」: closes the 「Today's AI Chats Are Used Up」 dialog and returns to the chat without sending the message (the dialog's only action; MX ① version A: closing the limit dialog returns to the chat).\n- R-321 [DS: control K-938d8f / K-b32fbc / K-d1e307 1016_Chat navigation · Credit page_free] My Credits (the credit-pill exit's landing page, R-316): 「Buy More」 opens the credit purchase page; 「Claim」 claims the complimentary daily credits (「Claim once every 24 hours」) and adds them to the balance; 「Subscribe Now」 on the 「Join the Pro+」 card opens the Pro+ subscription page.\n- R-322 [DS: control K-ab333a / C-8157ce Choose Character · credit; MX · storyboard / AI Mini Drama_template] 「Top up your credits」: tapping a credit pack (50 … 2000) selects it for 「Buy Credit」, one pack at a time; 「Terms of Use」 and 「Privacy Policy」 under the button open those pages.\n- R-323 [DS: control K-6b314e / K-d301d1 / K-68cdee / K-cbd30c Choose Character · Character Library (Age keypad)] The Age keypad has an input bar (placeholder 「1-100」) and a ✓ that closes the keypad and fills Age with the typed number; tapping a filled Age field (e.g. 「24」) reopens the keypad to change it.\n- R-324 [DS: control K-3276bb / C-8cec01 Choose Character · Character Library (filtered)] With filters applied the filter icon shows a check mark (ic_filter_check) and still opens the Filter panel; each applied-filter chip (「Female ×」, 「Asian ×」, 「Age: 0-28 ×」) removes that filter when its × is tapped (R-031).\n- R-325 [DS: control K-32eae1 / K-ea3e9d / K-5554e3 / K-910afd Choose Character · Character Library (enlarged preview)] The enlarged character preview has ⓧ at its top right, which closes it back to the library, and ⋯, which opens 「Download」 (saves the character image to the device), 「Report」 (opens the report flow) and, for the user's own character, 「Delete」 (R-049).\n- R-326 [DS: control K-f2a9d2 Choose Character · AI Mini Drama_template; 1005_Chat · Chat_charge failed] The ⟳ switch icon on a character in the Characters Result card opens Change Characters on that character (R-038: 「tap the switch icon on a character to change its look」).\n- R-327 [DS: control C-88ef55 / K-327b3e / K-37e272 / K-aa0c0b / C-14cbaa Choose Character · Add Media] Select Media (reference photo): 「Photo」 is the media type; 「Recents ▾」 opens the album list; the source tabs (getty images | iStock, GIPHY, …) switch to that stock source; the enlarge icon on a photo opens a full-size preview; the sliders icon beside 「Photo」 opens the picker's options; the camera icon opens the camera. The Design draws these controls with no result frame or arrow.\n- R-328 [DS: control K-1ff415 / K-af4631 Storyboard · preview] The full-screen Storyboard Preview player has X, ⏸ (pauses the slideshow; ▶ resumes it), a scrubber and the time 「00:40/01:30」; dragging the scrubber jumps to that point.\n- R-329 [DS: control K-a28dca Storyboard · AI Mini Drama_storyboard] The main scene image in the scene detail has no tap action in the Design (no arrow, no enlarged frame); like the Location thumbnail (R-055), a tap leaves the scene detail as it is.\n- R-330 [DS: control K-1ed4be Recent Task · Recent Task; 1016_Chat navigation · ④ History → Recent Task] 「New Chat」 at the bottom right of Recent Task (History) opens a new empty chat.\n- R-331 [DS: control K-30a28e main flow · composer (every chat stage)] The mic in the composer (R-011) starts voice input, a dictation into the input (DRI261895P0002); stopping it without speaking adds no text.\n\nNot in scope (control trace n/a): the Launcher's other controls on 「Launcher_2026_08」 (menu, 「Try Pro+ 7 days for free」, notifications, 「New Project」, 「Video Edit by Chat」, 「Video Enhance」, 「Image to Video」, 「Character Motion Swap」, 「Cinematic Reel Creator」, 「Text to Video」, 「Auto Edit」, 「Auto Captions」, 「Photo Enhance」 and the 「What's Trending」 covers) open other PowerDirector features; the Design draws the Launcher only as AI Mini Drama's entry, which R-001, R-002, R-190 and R-191 test.\n\n## Added 2026-10-29 — PM Figma 10/22 frames (REQ-052)\nTwo PM Figma frames dated 10/22 (PM file 44RyrcOcWi2MvhGci9bO5F, page 「🆕 Spec with function md(src){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=false,table=null;
  const flush=()=>{if(list){out.push('</ul>');list=false}if(table){out.push('<table>'+table.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');table=null}};
  for(const line of src.split(/\r?\n/)){
    const l=line.trim();
    if(/^\|/.test(l)){if(/^\|[\s:|-]+\|?$/.test(l))continue;if(list){out.push('</ul>');list=false}(table??=[]).push(l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue}
    if(table)flush();
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){flush();out.push(`<h${Math.min(4,h[1].length+1)}>${inline(h[2])}</h${Math.min(4,h[1].length+1)}>`);continue}
    if(/^[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.replace(/^[-*]\s+/,''))}</li>`);continue}
    flush();if(l)out.push(`<p>${inline(l)}</p>`);
  }
  flush();return out.join('');
}
function header(){

  else f.push(`Version ${D.version} · approved ${esc((D.approved_at||'').slice(0,10))}`);
  f.push(`Spec: ${D.spec_files.map(s=>esc(s.name)).join(', ')}`);
  $('#facts').innerHTML=f.map(x=>`<span>${x}</span>`).join('');
  if(D.update_plan){$('#planBox').hidden=false;$('#planBox').open=true;$('#plan').innerHTML=md(D.update_plan)}
  if(D.requirements){$('#reqBox').hidden=false;$('#req').innerHTML=md(D.requirements)}
  if(!REVIEW){document.body.classList.add('view');$('#decHead').hidden=true;$('#copyDec').hidden=true;$('#save').hidden=true}
  if(REVIEW&&!D.save){$('#save').disabled=true;$('#save').title='Open this page through scripts/review.ts to save.'}
  $('#foot').textContent=REVIEW?'Edits and new-case notes are kept in this browser until you save. Save writes the approved CSV, keeps the previous version in history/, regenerates the Excel and HTML views, and hands new-case notes to the agent for the next draft.':'Read-only view generated from cases.csv.';
}
function filters(){
  const cnt=(k,v)=>rows.filter(r=>k==='change'?(r.cur.Change||'')===v:state(r)===v).length;
  const changes=['new','modified','removed','unchanged'].filter(v=>cnt('change',v));
  const states=['kept','edited','added','deleted'];
  let h=`<input type="search" id="q" placeholder="Search ID or text" value="${esc(F.q)}"><select id="sec"><option value="">All sections (${rows.length})</option>${sections().map(s=>`<option${F.section===s?' selected':''}>${esc(s)}</option>`).join('')}</select>`;
  if(changes.length){h+=`<span class="sep"></span>`+[['','All changes'],...changes.map(c=>[c,c])].map(([v,l])=>`<button class="chip" data-k="change" data-v="${v}" aria-pressed="${F.change===v}">${l}${v?` <b>${cnt('change',v)}</b>`:''}</button>`).join('')}
  if(REVIEW)h+=`<span class="sep"></span>`+[['','Any decision'],...states.map(s=>[s,s])].map(([v,l])=>`<button class="chip" data-k="state" data-v="${v}" aria-pressed="${F.state===v}">${l}${v?` <b>${cnt('state',v)}</b>`:''}</button>`).join('');
  $('#filters').innerHTML=h;
  $('#q').oninput=e=>{F.q=e.target.value;body()};
  $('#sec').onchange=e=>{F.section=e.target.value;body()};
  $('#filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{F[b.dataset.k]=b.dataset.v;filters();body()});
}
function visible(r){
  const t=(r.cur.ID+' '+FIELDS.map(f=>r.cur[f]).join(' ')).toLowerCase();
  return (!F.q||t.includes(F.q.toLowerCase()))&&(!F.section||(r.cur.Section||'(no section)')===F.section)&&(!F.change||(r.cur.Change||'')===F.change)&&(!F.state||state(r)===F.state);
}
function cell(r,f){
  const prev=D.previous[r.cur.ID];
  const was=prev&&r.cur.Change==='modified'&&(prev[f]??'')!==(r.orig[f]??'')?`<div class="was">${esc(prev[f])}</div>`:'';
  return `<td><textarea data-id="${esc(r.cur.ID)}" data-f="${f}" rows="2">${esc(r.cur[f])}</textarea>${was}</td>`;
}
function idCell(r){
  const st=state(r),ch=r.cur.Change;
  const badges=[ch&&ch!=='unchanged'?`<span class="badge b-${ch}">${ch}</span>`:'',REVIEW&&st!=='kept'?`<span class="badge b-${st==='deleted'?'removed':st}">${st}</span>`:''].join(' ');
  // opens the coverage page on this case: its requirements, the spec boards they come from, the controls it presses
  // and the run plan on it: the segment that runs it and its latest result
  const links=r.added?[]:[PAGES.coverage&&`<a class="spec" href="${esc(PAGES.coverage)}#case=${encodeURIComponent(r.cur.ID)}" title="Coverage: where in the spec this case comes from and the controls it presses">Coverage →</a>`,
    PAGES.plan&&`<a class="spec" href="${esc(PAGES.plan)}#case=${encodeURIComponent(r.cur.ID)}" title="Progress: the segment that runs this case and its latest result">Progress →</a>`,
    PAGES.results&&`<a class="spec" href="${esc(PAGES.results)}#case=${encodeURIComponent(r.cur.ID)}" title="Results: what each run found, with screenshots">Results →</a>`].filter(Boolean);
  const spec=links.length?`<div class="xl">${links.join('')}</div>`:'';
  return `${esc(r.cur.ID)}<div>${badges}</div>${spec}${r.cur['Change Reason']?`<div class="reason">${esc(r.cur['Change Reason'])}</div>`:''}`;
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(s)} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="Describe new cases in your own words; they become rows in the next draft">+ Add case</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>New case notes</b><span>Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.</span><button class="add" data-del="${esc(n.id)}">Remove</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">Keep</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">Delete</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">No cases match these filters.</td></tr>`;
  const find=id=>rows.find(r=>r.cur.ID===id);
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm('Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('textarea[data-id],select').forEach(el=>{if(!REVIEW){el.readOnly=true;return}el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function counts(){
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  $('#counts').innerHTML=REVIEW?`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`:`<b>${rows.length}</b> cases`;
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast(label+' copied.')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' copied.')}catch(_){toast('Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),'Final CSV');if(liveNotes().length)setTimeout(()=>toast('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast('Save failed: '+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
header();filters();body();counts();focusRow();
</script>
</body>

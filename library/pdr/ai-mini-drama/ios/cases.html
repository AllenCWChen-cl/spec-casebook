k on 「AI Issues」 with the AI Feature Name and issue text pre-filled (as R-246, R-303). Walked by: TC-336.\n\n## Added 2026-10-29 — PM / MX controls (REQ-052)\nSection C traced every PM / MX control group of the inventory (REQ-052) to the row that presses it (`control-trace.json`). Most\ngroups are the Design's own controls drawn again (credit pill, History, New chat, composer, chips, scene cards) and are pressed by\nthe rows that press the Design group; controls of the MX mockups' older chat are n/a (Q-31). The rules below are stated by a PM or\nMX frame and had no requirement.\n\n### Controls (REQ-052)\n- R-456 [PM: main flow 「Demo page_Straight video」 2283:10856 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=2283-10856; board-notes PM main flow 「Entry」; Req: REQ-052] Feature intro: opening AI Mini Drama from the Launcher shows an intro page 「AI Mini Drama」/「Turn your idea into a video—same characters, same voices, every scene.」 with ‹, a demo video with a volume icon at its bottom right, a 「Don't show again」 checkbox and 「Try It Now」. 「Try It Now」 opens the AI Mini Drama landing page, ‹ goes back to the Launcher, the volume icon switches the demo's sound off and on, and once 「Don't show again」 is ticked the shortcut opens the landing page directly (PM-only; Q-29).\n- R-457 [MX: 「IAP_Pro+_free user」 1034:39877 https://www.figma.com/design/3urWYejMUP2uaglb4s73M5/PDRM-MX?node-id=1034-39877, 「IAP_Pro+_pro user」 1034:40235 https://www.figma.com/design/3urWYejMUP2uaglb4s73M5/PDRM-MX?node-id=1034-40235; Req: REQ-052] Subscription page (opened from the limit dialog's 「Upgrade to Premium」 or a not-enough card's 「Upgrade Now」): the 「Pro」 / 「Pro+」 tabs at the top switch the plan shown; 「Monthly」 and 「Yearly」 (「Best Value」) plan cards, one selected at a time; the footer links 「Terms of Service」, 「Privacy Policy」 and 「Restore purchase」; the main button reads 「Get 7-Day Free Trial」 for a user without a subscription and 「Continue」 for a Pro user, and opens the App Store purchase sheet.\n- R-458 [PM: main flow 「storyboard」 2186:7485 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=2186-7485; pm-top-mockups; board-notes PM chat result states; Req: REQ-052] The Storyboard Preview card has a 「Create video」 button (「See how your story flows before generating the full video」); tapping it adds the bubble 「Create video」 and the 「Choose your video settings」 card follows (PM-only; Q-30).\n- R-459 [PM: main flow 「Send Feedback」 2613:28618 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=2613-28618; update 9 「Send Feedback_AI Issues (pre-filled)」 4012:23497; Req: REQ-052] Send Feedback (from 「Report」 or the timeout dialog's 「Send Feedback」): the tabs 「General」 / 「AI Issues」 / 「Order Problems」 switch the form; the AI Issues form has Contact Information*, 1. AI Feature Name*, 2. What is the issue?*, 3. What Prompt did you use?, an add-image tile and the footer link 「Privacy Policy」; 「Submit」 is dimmed while a required (*) field is empty; ‹ closes the form.\n- R-460 [PM: update 3 「Character_generating {n}」 3153:16332 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=3153-16332; update 9 4018:26757; board-notes PM 「Generating state … disabled \"generating…\" button」; Req: REQ-052] While a character generates, the form's main button reads 「generating...」 and is dimmed; tapping it does nothing (only 「Cancel」 and X act, R-245).\n- R-461 [PM: Error Handling 「AI Mini Drama_storyboard」 2701:22121 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=2701-22121; MX 1572:23608; Req: REQ-052] The scene-video editor's description box has an expand icon at its top right that opens the full-screen description editor (collapse icon, 「Done」) with the same text, as the character description does (R-107).\n- R-462 [PM: main flow 「AI Mini Drama_storyboard」 2592:43622 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=2592-43622; update 10 4198:25565; Req: REQ-052] On the video result page a paused preview shows ▶ in its middle; tapping ▶ resumes playback (R-275).\n\n## Added 2026-10-29 — MX ③ Credit Charging Table (REQ-057)\nBoard `mx-a-right` 「③ Credit Charging Table / 1. Action ID & Charging Table Link」 links the sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (last modified 2026-10-20; read 2026-10-29, saved in specs/2026-10-21-2/extracted/mx-charging-table.md). The user decided (2026-10-29, REQ-057) to use the sheet only where no other source gives a number: the discount prices, the no-discount regenerate and the action ids. Normal prices stay PM 10/16 / Design (R-253, R-050 and the price rows); the sheet's own normal prices and its missing Seedance 2.5 row are Q-32 and Q-33.\n\n- R-463 [MX:mx-a-right ③ Credit Charging Table, linked sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20); extracted/mx-charging-table.md; Req: REQ-057] First-time credit discount prices (the R-147 discount: a Free user who subscribes during an AI Mini Drama session): that session's first generation of each action costs 2 credits per character image, 2 credits per storyboard scene, 2 credits per second of Seedance 2.0 (1080p) video and 2 credits per second of Seedance 2.0 Mini (720p) video; the action card shows that price and the same amount is charged. HELD (REQ-059, 2026-10-29): the promotion price is not in use until the user says it applies; NOT TESTABLE until then, no row expects it.\n- R-464 [MX:mx-a-right ③ Credit Charging Table, linked sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20); extracted/mx-charging-table.md; Req: REQ-057] Regenerating a character, a storyboard scene or a video is never discounted (the sheet's discount column is 「-」 for every regenerate): even inside the discounted session it is charged the normal price. HELD (REQ-059, 2026-10-29): this rule only matters inside the promotion, held with it; NOT TESTABLE until then.\n- R-465 [MX:mx-a-right ③ Credit Charging Table, linked sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20); extracted/mx-charging-table.md; Req: REQ-057] Discounted charges are booked under the `…_aiminidrama_discount` action ids and normal charges under the `…_aiminidrama_normal` action ids (`genimage_1_img_openai_gptimage2_\u003cnone|enable>_1K_aiminidrama_\u003cnormal|discount>`, `genvideo_1_sec_bytedance_seedance2.0std_enable_1080p_aiminidrama_\u003cnormal|discount>`, `genvideo_1_sec_bytedance_seedance2.0mini_enable_720p_aiminidrama_\u003cnormal|discount>`); the app log shows each charge's `action_id` and `total_credit`. — Changed 2026-10-29 (REQ-059): rows check the `…_aiminidrama_normal` ids only; the `_discount` ids are held with the promotion.\n\n## Added 2026-10-29 (2) — original prices by default (REQ-059)\nUser, 2026-10-29: \"by default the \"original\" price should be the correct option, the special price I haven't received\ninformation when it is going to be used. Unless I specified in the future that the promotion price is applied use the\noriginal price.\" This replaces the REQ-057 rule that normal prices stay PM 10/16 / Design. Normal prices now come from\nthe MX ③ charging sheet (`specs/2026-10-21-2/extracted/mx-charging-table.md`), for first generation and regenerate\nalike: character 6 per image, storyboard 6 per scene image, Seedance 2.0 (1080p) 13 per second, Seedance 2.0 Mini\n(720p) 4 per second; Seedance 2.5 keeps PM 10/16's 6 per second (no sheet row, Q-33). Changed in place, IDs\nkept: R-040, R-050, R-061, R-069, R-081, R-254, R-259, R-260, R-450, R-465. Held: R-463 (discount prices) and\nR-464 (no discount on regenerate, which only matters inside the promotion), with the R-147 discount price; TC-231\nis parked (removed) and the other REQ-057 discount rows now check the original price and the `_normal` ids.\nQ-32 is answered.\n\n## Added 2026-10-30 — Regenerate Clip one at a time (REQ-061)\n`figma-check.ts` (2026-10-30) found a PM board no group covered: 「10/29 update — Regenerate Clip 一次只能跑一個（PDR-A 16.8.0\nAI Agent bug）」 (4784:70878, Figma only, newer than PM Spec 20261021; group `u1029`, board-notes 「PM — 10/29 Regenerate\nClip one at a time」). Its ◆60 is a mock: the regenerate price stays the scene's length × the model's rate (R-081).\n\n- R-466 [PM: 10/29 update §13.25 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4784-70878; Req: REQ-061] Only one clip regenerates at a time. While a clip regenerates, every other scene's 「Regenerate Clip」 is drawn at 40% opacity but stays tappable (not disabled, so the user learns why); tapping it shows the toast 「Another clip is regenerating. Try again when it's done.」, sends nothing, charges nothing and keeps the prompt the user edited. When the regenerating clip ends (success or failure) the button is back to normal. Applies to every entry that regenerates a single clip (Fix Scene › Edit, the scene edit page). Walked by: TC-428, TC-429, TC-430.\n","update_plan":"","zh":{"TC-001":{"Section":"進入與首頁","Precondition":"App 在 Home (Launcher)","Action":"點選「AI Mini Drama」捷徑","Expected Result":"開啟 AI Mini Drama 首頁"},"TC-418":{"Section":"進入與首頁","Precondition":"App 在 Home（Launcher）；此安裝上 AI Mini Drama 的介紹尚未以 「Don't show again」 關閉","Action":"1. 點「AI Mini Drama」捷徑。2. 在介紹頁點音量圖示兩次。3. 點 ‹。4. 再點捷徑，勾選「Don't show again」並點「Try It Now」。5. 回到 Launcher 再點一次捷徑","Expected Result":"介紹頁顯示「AI Mini Drama」/「Turn your idea into a video—same characters, same voices, every scene.」，附播放中的示範影片、「Don't show again」與「Try It Now」；每點一次音量圖示就關閉聲音再開啟；‹ 回到 Launcher；「Try It Now」開啟 AI Mini Drama 首頁；勾選「Don't show again」後，捷徑直接開啟首頁而沒有介紹頁","Notes":"PM-only：尚無 Design frame（PM 主流程 2283:10856「Demo page_Straight video」）。Design 的捷徑箭頭直接到首頁（R-190）；若沒有出現介紹頁，請記錄（Q-29）"},"TC-002":{"Section":"進入與首頁","Precondition":"App 在 Home；主視覺橫幅輪播中","Action":"等待「AI Mini Drama with Seedance 2.0 >」橫幅出現並點選","Expected Result":"開啟 AI Mini Drama 首頁","Notes":"橫幅輪播由 CMS 控制；若一直沒出現則為 Blocked"},"TC-003":{"Section":"進入與首頁","Precondition":"已開啟 AI Mini Drama 首頁","Action":"查看首頁","Expected Result":"顯示「Hi, I'm your」「AI Drama Assistant」、「Describe your idea and watch it come to life as a short drama.」、「Create Your Drama」、「Start from a template」與「More」及範本格；標題列有返回、點數膠囊與 History；每個範本縮圖為該範本的海報靜態圖","Notes":"回歸 DRI261893-0051 (Assigned, untagged)：「Hi, I'm your」文字有陰影 — 此單也在此重新檢查。Q-18：首日範本是否只有 US 與 JP？"},"TC-004":{"Section":"進入與首頁","Precondition":"已開啟首頁；有 6 個以上範本","Action":"檢查範本列標題","Expected Result":"「More」顯示在「Start from a template」旁","Notes":"少於 6 個的分支需要伺服器設定"},"TC-005":{"Section":"進入與首頁","Precondition":"已開啟首頁","Action":"比對點數膠囊與 Mine → credits","Expected Result":"膠囊顯示目前的點數餘額","Notes":"回歸 DRI261894-0001 (RDResolved, AIAgent)：扣點後範本預覽顯示過期的點數餘額 — 此單也在此重新檢查"},"TC-006":{"Section":"範本","Precondition":"已開啟首頁","Action":"點選「More」","Expected Result":"開啟全部分類頁：各分類有圖示與名稱 (Office Romance, Fantasy World, Urban Romance, Family & Life, Animated Stories)，每個分類為一列附名稱的封面"},"TC-007":{"Section":"範本","Precondition":"已開啟首頁","Action":"點選一個範本封面","Expected Result":"開啟範本詳情；範本影片自動播放且有聲音；顯示「Make my version」"},"TC-008":{"Section":"範本","Precondition":"範本詳情播放中","Action":"點影片；點 ▶；然後點音量圖示兩次","Expected Result":"第一次點擊暫停影片（暫停且音量關閉狀態）；▶ 恢復播放；每點一次音量圖示會關閉再開啟聲音，圖示隨之變化（volume off / volume on）"},"TC-009":{"Section":"範本","Precondition":"已開啟範本詳情","Action":"點選「Make my version」","Expected Result":"為該範本開始聊天，並在產生任何大綱之前詢問「What format would you like for your video?」"},"TC-010":{"Section":"範本","Precondition":"已開啟全部分類頁","Action":"閱讀每個範本名稱","Expected Result":"名稱拼寫正確，例如「Six Things You Didn't Know」含撇號","Notes":"Q-1：設計檔本身漏了撇號；回歸 DRI261893-0158 (NewCreated, AIAgent)：範本標題 \"Six Things You Didnt Know\" 缺少撇號 — 此單也在此重新檢查"},"TC-011":{"Section":"點子輸入","Precondition":"已開啟首頁","Action":"點選「Create Your Drama」","Expected Result":"開啟空白聊天，輸入框提示文字為「Enter your idea to create drama」，並有麥克風按鈕"},"TC-399":{"Section":"點子輸入","Precondition":"空白聊天（TC-011 之後）","Action":"不說話點麥克風按鈕；然後再點一次（或其取消控制）停止","Expected Result":"語音輸入開始：顯示聆聽狀態（首次使用時 iOS 會先詢問麥克風或語音辨識權限）；停止後輸入框保持空白，輸入列可供打字","Notes":"不需要說話：Appium 無法讓手機收到語音，因此轉錄由 TC-191 涵蓋。iOS 權限提示屬系統設定：記錄下來並先詢問使用者再回答"},"TC-012":{"Section":"點子輸入","Precondition":"空白聊天，輸入框已取得焦點","Action":"查看輸入框上方","Expected Result":"顯示「Surprise me」與兩個靈感 chip"},"TC-013":{"Section":"點子輸入","Precondition":"空白聊天，有靈感 chip","Action":"點選一個靈感 chip","Expected Result":"chip 文字放入輸入框 (不送出)"},"TC-014":{"Section":"點子輸入","Precondition":"空白聊天","Action":"點選「Surprise me」兩次","Expected Result":"第一次點選以一則靈感填入輸入框；第二次點選將另一則靈感附加在既有文字之後，而非取代","Notes":"回歸 DRI261893-0124 (NewCreated, AIAgent) — 與 TC-014 的附加規則 (DRI261895P0023) 衝突；對照目前規格重新檢查：Surprise me 在同一次首頁停留期間會更換建議 — 此單也在此重新檢查；回歸 DRI261895P0023 (NewCreated, AIAgent)：Surprise me 取代輸入框內容而非附加建議 — 此單也在此重新檢查"},"TC-380":{"Section":"點子輸入","Precondition":"空白聊天；記下兩個靈感 chip","Action":"點選「Surprise me」五次，每次都清空輸入框","Expected Result":"沒有任何一次選出的內容與那兩個 chip 的字串相同","Notes":"10 則一組 (R-014)"},"TC-015":{"Section":"點子輸入","Precondition":"空白聊天","Action":"將 1,050 字元的文字貼到輸入框","Expected Result":"輸入框保留前 1,000 個字元；計數器顯示紅色「1000/1000」；顯示「You've reached the 1,000-character limit.」","Notes":"Q-2"},"TC-016":{"Section":"點子輸入","Precondition":"輸入框已達 1,000 字元","Action":"再輸入一個字元","Expected Result":"不會新增任何字元；上限訊息持續顯示"},"TC-017":{"Section":"點子輸入","Precondition":"輸入框已達 1,000 字元","Action":"刪除一個字元","Expected Result":"計數器不再是紅色，上限訊息消失"},"TC-018":{"Section":"點子輸入","Precondition":"輸入框約 400 字元","Action":"收起鍵盤","Expected Result":"輸入框收合為最多 3 行"},"TC-372":{"Section":"點子輸入","Precondition":"空白聊天，鍵盤已開啟","Action":"持續輸入直到文字超過輸入框的最大高度","Expected Result":"輸入框隨文字增高至最大高度；更多文字在框內捲動，且不遮住其他控制項"},"TC-373":{"Section":"點子輸入","Precondition":"聊天中已有大綱，鍵盤已開啟","Action":"持續輸入直到文字超過輸入框的最大高度","Expected Result":"輸入框隨文字增高至最大高度；更多文字在框內捲動，且不遮住其他控制項"},"TC-019":{"Section":"點子輸入","Precondition":"聊天中至少有一則訊息","Action":"查看輸入框上方，然後點 「More ideas +」","Expected Result":"顯示 「More ideas +」 chip；點擊後為輸入提供更多故事靈感（記錄出現的內容，Q-19）"},"TC-020":{"Section":"格式卡片","Precondition":"空白聊天","Action":"送出一個點子 (例如「A barista and a regular fall in love over a lost umbrella」)","Expected Result":"助理詢問「What format would you like for your video?」，包含 1. Video language (English, Spanish, French, German, Japanese, Korean, Chinese) 與 2. Captions (「Yes, include captions」/「No captions」)；沒有畫面比例的問題","Notes":"回歸 DRI261893-0118 (NewCreated, AIAgent) — 設計優先：目前的格式卡片沒有畫面比例選項 (TC-020)；重新檢查前先確認。：格式設定沒有畫面比例選擇 — 此單也在此重新檢查"},"TC-021":{"Section":"格式卡片","Precondition":"已顯示格式卡片","Action":"點選另一個語言，再點選另一個字幕選項","Expected Result":"每組只會選取一個選項"},"TC-022":{"Section":"格式卡片","Precondition":"已顯示格式卡片","Action":"點選卡片上的按鈕","Expected Result":"卡片被使用者氣泡取代「1. Video language: \u003cx> / 2. Captions: \u003cYes|No>」","Notes":"回歸 DRI261893-0011 (QANeedRework, AIFound)：格式卡片按鈕顯示 \"Continue\"，而非規格指定的 \"Generate\" — 此單也在此重新檢查"},"TC-381":{"Section":"格式卡片","Precondition":"空白聊天","Action":"輸入一個點子但不送出並點選返回；開啟新聊天，送出一個點子並在格式卡片點選返回；開啟 History","Expected Result":"每次返回都回到 AI Mini Drama 首頁且不出現對話框；History 沒有這兩個聊天的紀錄"},"TC-023":{"Section":"故事大綱","Precondition":"已確認格式","Action":"在大綱產生期間觀察聊天","Expected Result":"顯示狀態文字，例如「I'll create a story outline - give me a moment...」/「Writing your story...」"},"TC-024":{"Section":"故事大綱","Precondition":"大綱已產生","Action":"閱讀結果","Expected Result":"「Story Outline & Characters Result」卡片顯示 Story Outline 與「Possible Characters:」，每個角色有描述，並有一列角色欄位"},"TC-025":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"點 Back","Expected Result":"「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」，附「Leave anyway」與「Stay」"},"TC-026":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"點選 History (右上角)","Expected Result":"出現相同的「Leave this chat?」對話框","Notes":"回歸 DRI261894P0049 (NewCreated, AIFound)：離開保護只在 History 圖示出現、返回鍵不會，且說工作會停止 — 此單也在此重新檢查"},"TC-027":{"Section":"故事大綱","Precondition":"已顯示 Leave this chat?","Action":"點選「Stay」","Expected Result":"對話框關閉；聊天保留且大綱仍會送達"},"TC-028":{"Section":"故事大綱","Precondition":"已顯示 Leave this chat?","Action":"點選「Leave anyway」，然後開啟 History","Expected Result":"聊天關閉；History 中沒有此點子的紀錄"},"TC-394":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點 Back，然後「Leave anyway」","Expected Result":"聊天關閉並開啟 AI Mini Drama 首頁（「Hi, I'm your AI Drama Assistant」、「Create Your Drama」、「Start from a template」）","Notes":"首頁來自 Design 1016_Chat navigation ①（流程箭頭 4877-33087）；對話框文字來自 PM 10/21（REQ-029）。TC-028 檢查 History 不保留任何內容"},"TC-357":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"點選 New chat，然後點「Stay」；點選點數膠囊，然後點「Stay」","Expected Result":"每次點選都顯示「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」，附 Leave anyway / Stay；Stay 關閉對話框，聊天保留且大綱仍會送達","Notes":"離開路徑來自 Design 1016_Chat navigation；對話框文案來自 PM 10/21，較新 (REQ-029)。TC-025 – TC-028 涵蓋返回與 History"},"TC-358":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點選點數膠囊，然後點「Leave anyway」；再開啟 History","Expected Result":"開啟 My Credits；History 沒有此點子的紀錄","Notes":"首頁來自 Design 1016_Chat navigation (REQ-029)"},"TC-398":{"Section":"點數與額度","Precondition":"免費方案；從聊天的點數 pill 開啟 My Credits（TC-358 之後，或之後任一階段的 pill）","Action":"點「Buy More」，然後返回；點「Subscribe Now」，然後不訂閱直接返回；點「Claim」","Expected Result":"「Buy More」開啟點數購買頁；「Subscribe Now」開啟 Pro+ 訂閱頁；「Claim」將今日的免費點數加入餘額，且 24 小時後才能再次使用","Notes":"Design 1016_Chat navigation「Credit page_free」（Figma 4858:35398）。不要購買或訂閱。共用帳號每 24 小時只能 Claim 一次：若今天已領過，記錄停用狀態"},"TC-395":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點 History，然後點 「Leave anyway」","Expected Result":"聊天關閉並開啟 Recent Task；列表中沒有此想法的項目","Notes":"首頁來自 Design 1016_Chat navigation ④（流程箭頭 4877-33081）；對話框文字來自 PM 10/21（REQ-029）"},"TC-396":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點 New chat，然後點 「Leave anyway」","Expected Result":"聊天關閉並開啟新的空白聊天（「Hi, I'm your AI Drama Assistant」、「Surprise me」、想法建議、空的輸入區）；被放棄的想法不在 History 中","Notes":"首頁來自 Design 1016_Chat navigation ②（流程箭頭 4877-33083）；對話框文字來自 PM 10/21（REQ-029）。TC-200 重測相關的單"},"TC-386":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"將 App 滑掉，重新開啟並開啟 History","Expected Result":"History 沒有該點子的紀錄"},"TC-029":{"Section":"故事大綱","Precondition":"大綱已完成","Action":"點 Back，再從 History 重新開啟該短劇","Expected Result":"離開時不出現對話框；該 drama 在 History 中，並重新開啟於 t","Precondition":"分鏡階段 ②：卡片顯示 「Creating your storyboard...」","Expected Result":"每次皆無對話框；離開時顯示 「We'll keep making your storyboard. Find it in History.」；依序開啟 Recent Task、My Credits 與新的空白聊天；分鏡持續產生","Notes":"PM Figma 10/22 (4422:2)；僅 PM：尚無 Design 畫面。TC-401 涵蓋 Back"},"TC-063":{"Section":"分鏡","Precondition":"分鏡階段 ①：卡片顯示 「Preparing your scenes...」；已讀取 Credit Details","Action":"點 Back、「Leave anyway」，然後從 History 重新開啟該短劇並等待","Expected Result":"聊天自行重新開始準備（「Preparing your scenes...」，接著 「Creating your storyboard...」），不需再點 Generate，分鏡完成；Mine › Credits › Details 只記一次此分鏡的扣點","Notes":"PM Figma 10/22 (4422:2)；RD 待確認重新開始的行為 (Q-20)。原為：重新開啟後停在分鏡提供畫面，Generate 會再次扣點 (R-052)"},"TC-403":{"Section":"分鏡","Precondition":"分鏡階段 ①：卡片顯示 「Preparing your scenes...」；已讀取 Credit Details","Action":"將 app 滑掉，重新開啟 PowerDirector 並從 History 開啟該短劇","Expected Result":"聊天自行重新開始準備（「Preparing your scenes...」），不需再點 Generate，分鏡完成；Mine › Credits › Details 只記一次此分鏡的扣點","Notes":"PM Figma 10/22 (4422:2)；僅 PM：尚無 Design 畫面。RD 待確認重新開始的行為 (Q-20)。TC-063 涵蓋 Leave anyway"},"TC-404":{"Section":"分鏡","Precondition":"分鏡階段 ②：卡片顯示 「Creating your storyboard...」；已讀取 Credit Details","Action":"將 app 滑掉，等待 2 分鐘，重新開啟 PowerDirector 並從 History 開啟該短劇","Expected Result":"分鏡已在背景完成：聊天顯示 「Here's your storyboard」，附 Storyboard Result 與 Storyboard Preview 卡片；Credit Details 只記一次","Notes":"PM Figma 10/22 (4422:2)；僅 PM：尚無 Design 畫面。RD 待確認分鏡階段 ② 會在背景完成 (Q-20)"},"TC-064":{"Section":"分鏡","Precondition":"分鏡已完成","Action":"閱讀聊天","Expected Result":"「Here's your storyboard」、Storyboard Result 卡片 (場景卡片含 9:16 縮圖、「View more >」) 與 Storyboard Preview 卡片；Storyboard Preview 卡片隨分鏡一起出現，本身沒有產生中狀態","Notes":"回歸 DRI261893-0145 (BugNeedReview, AIAgent)：分鏡腳本在第一行與最後一行裁掉第一個字形的左緣 — 此單也在此重新檢查；回歸 DRI261895P0035 (RDResolved, AIAgent)：Scene 與 Location 圖片產生一律失敗 — 此單也在此重新檢查"},"TC-065":{"Section":"分鏡","Precondition":"Storyboard Result 已顯示","Action":"點選「View more >」，然後使用 ‹ ›","Expected Result":"開啟場景詳情，含 X、「Scene N」、主圖、Location 列、標題與完整腳本；‹ › 可在場景間切換；第一行與最後一行腳本顯示完整字元 (沒有被裁切)"},"TC-066":{"Section":"分鏡","Precondition":"已開啟場景詳情","Notes":"PM (pm-update-6) 畫出主圖下方有標示「Location」的列；以設計為準。回歸 DRI261895P0026 (NewCreated, AIAgent) — 設計優先：設計將 location 與 scene 圖片並排顯示且沒有 Location 標籤 (TC-066)；此單的 PM 版面不是預期結果。：場景詳情缺少 Location 縮圖與標籤 — 此單也在此重新檢查","Action":"點 Location 縮圖，再點場景主圖","Expected Result":"兩次點擊都沒有反應（不放大、沒有重新產生選項）；Location 圖片如 Design 畫面般位於場景主圖旁，沒有 「Location」 標籤"},"TC-389":{"Section":"分鏡","Expected Result":"Location 縮圖先顯示骨架畫面，然後在主圖完成前顯示 location 圖片；主圖保持其寬度","Precondition":"開啟場景詳情（Scene edit page），而該場景的 Location 圖片仍在產生中：場景已從 Edit 重新產生 (TC-070) 或透過 Iris 更新 (TC-073)","Action":"觀察主圖下的 Location 縮圖，直到兩張圖都完成","Notes":"PM 10/14 board 6 「10/12 update - Scene 編輯頁的「地點圖片」」：此規則只適用於 Scene edit page。聊天中的分鏡卡片顯示一個骨架載入（Design），不是這一列；若其 Location 產生期間無法開啟任何場景詳情，記為 Blocked (test-data)，不是其他畫面上的發現（Android DRA262610P0345 就是因誤讀而開的；PDRA 2026-10-29, REQ-055）。TC-066 註明 Design 沒有畫 「Location」 標籤"},"TC-390":{"Section":"分鏡","Action":"開啟該場景詳情","Expected Result":"主圖顯示其錯誤卡片；Location 縮圖顯示粉紅色失敗圖示與「Location • Failed」；Edit 提供以 2 張圖重新產生兩者 (TC-070)","Precondition":"場景的地點圖與主圖皆失敗（Pink › Trip image moderation；記錄所用開關）"},"TC-067":{"Section":"分鏡","Precondition":"場景圖片以 4xx 失敗","Notes":"需要失敗的場景 (故障注入)。設計優先於 PM (使用者規則 2026-10-19)。設計 1012 畫面使用此卡片內文；PM 10/14 的 4xx 為「Try editing the description…」文案。設計顯示兩種 ⓘ 對話框變體。；回歸 DRI261894P0031 (Assigned, AIFound)：失敗的場景圖片寫「service is busy」，但其 ⓘ 卻怪罪服務條款 — 此單也在此重新檢查","Action":"開啟該場景並點 ⓘ；在對話框中點 「terms of service」，返回後點 「Got it」","Expected Result":"卡片 「Couldn't create image ⓘ」/「Your credits have been refunded. The service is busy — try again later.」，附 Edit；ⓘ 對話框 「Couldn't generate this image」，附服務條款文字與 Got it；錯誤內容保持在 9:16 畫面內，文字依寬度換行；對話框中的 「terms of service」 開啟服務條款，「Got it」 關閉對話框"},"TC-068":{"Section":"分鏡","Precondition":"場景圖片以 5xx 失敗","Action":"開啟該場景","Expected Result":"「Couldn't create image」/「Your credits have been refunded. The service is busy - try again later.」，附「Edit」且沒有 ⓘ","Notes":"需要故障注入"},"TC-069":{"Section":"分鏡","Precondition":"分鏡中有失敗的場景","Notes":"需要失敗的場景；回歸 DRI261894P00 function md(src){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=false,table=null;
  const flush=()=>{if(list){out.push('</ul>');list=false}if(table){out.push('<table>'+table.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');table=null}};
  for(const line of src.split(/\r?\n/)){
    const l=line.trim();
    if(/^\|/.test(l)){if(/^\|[\s:|-]+\|?$/.test(l))continue;if(list){out.push('</ul>');list=false}(table??=[]).push(l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue}
    if(table)flush();
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){flush();out.push(`<h${Math.min(4,h[1].length+1)}>${inline(h[2])}</h${Math.min(4,h[1].length+1)}>`);continue}
    if(/^[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.replace(/^[-*]\s+/,''))}</li>`);continue}
    flush();if(l)out.push(`<p>${inline(l)}</p>`);
  }
  flush();return out.join('');
}

const secLabel=s=>LANG==='zh'&&secZh(s)?`${s} · ${secZh(s)}`:s;
function idCell(r){
  const st=state(r),ch=r.cur.Change;
  const badges=[ch&&ch!=='unchanged'?`<span class="badge b-${ch}">${word(ch)}</span>`:'',REVIEW&&st!=='kept'?`<span class="badge b-${st==='deleted'?'removed':st}">${word(st)}</span>`:''].join(' ');
  // opens the coverage page on this case: its requirements, the spec boards they come from, the controls it presses
  // and the run plan on it: the segment that runs it and its latest result
  const links=r.added?[]:[PAGES.coverage&&`<a class="spec" href="${esc(PAGES.coverage)}#case=${encodeURIComponent(r.cur.ID)}" title="Coverage: where in the spec this case comes from and the controls it presses">Coverage →</a>`,
    PAGES.plan&&`<a class="spec" href="${esc(PAGES.plan)}#case=${encodeURIComponent(r.cur.ID)}" title="Progress: the segment that runs this case and its latest result">Progress →</a>`,
    PAGES.results&&`<a class="spec" href="${esc(PAGES.results)}#case=${encodeURIComponent(r.cur.ID)}" title="Results: what each run found, with screenshots">Results →</a>`].filter(Boolean);
  const spec=links.length?`<div class="xl">${links.join('')}</div>`:'';
  const zr=LANG==='zh'&&ZH[r.cur.ID]?.['Change Reason'];
  return `${esc(r.cur.ID)}<div>${badges}</div>${spec}${r.cur['Change Reason']?`<div class="reason">${esc(r.cur['Change Reason'])}${zr?`<div class="zh">${esc(zr)}</div>`:''}</div>`:''}`;
}
function body(){
  const tb=$('#tbl tbody');let h='';
  for(const s of sections()){
    const rs=rows.filter(r=>(r.cur.Section||'(no section)')===s&&visible(r));
    if(!rs.length)continue;
    h+=`<tr class="section"><td colspan="8">${esc(s)}${LANG==='zh'&&secZh(s)?`<span class="zhs">${esc(secZh(s))}</span>`:''} <span class="note">(${rs.length})</span>${REVIEW?`<button class="add" data-sec="${esc(s)}" title="${tx('Describe new cases in your own words; they become rows in the next draft','用自己的話描述新案例，下一版草稿會把它們變成表格列')}">${tx('+ Add case','+ 新增案例')}</button>`:''}</td></tr>`;
    for(const n of notes.filter(n=>n.section===s))h+=`<tr class="newcase"><td colspan="8"><div class="nh"><b>${tx('New case notes','新案例筆記')}</b><span>${tx('Write what to test in your own words, one case or several. After Save or Copy decisions, the agent places each case in the right section, fills in the columns and proposes the next draft.','用自己的話寫下要測什麼，一個或多個案例皆可。按存檔或複製決定後，agent 會把每個案例放到正確區塊、填好欄位並提出下一版草稿。')}</span><button class="add" data-del="${esc(n.id)}">${tx('Remove','移除')}</button></div><textarea class="big" data-note="${esc(n.id)}" placeholder="e.g. Tap the credit pill while the outline is generating: a leave dialog should appear, and leaving keeps the chat">${esc(n.text)}</textarea></td></tr>`;
    for(const r of rs){
      const st=state(r);
      h+=`<tr data-row="${esc(r.cur.ID)}" class="${st==='deleted'?'deleted':''}${r.cur.ID===focusId?' focus':''}"><td class="id">${idCell(r)}</td>
      ${cell(r,'Precondition')}${cell(r,'Action')}${cell(r,'Expected Result')}
      <td><select data-id="${esc(r.cur.ID)}" data-f="Priority" ${REVIEW?'':'disabled'}>${['','P1','P2','P3'].map(p=>`<option${(r.cur.Priority||'')===p?' selected':''}>${p}</option>`).join('')}</select></td>
      ${cell(r,'Spec Ref')}${cell(r,'Notes')}
      ${REVIEW?`<td class="dec"><span class="seg"><button class="k" data-id="${esc(r.cur.ID)}" data-d="keep" aria-pressed="${r.dec==='keep'}">${tx('Keep','保留')}</button><button class="d" data-id="${esc(r.cur.ID)}" data-d="delete" aria-pressed="${r.dec==='delete'}">${tx('Delete','刪除')}</button></span></td>`:''}</tr>`;
    }
  }
  tb.innerHTML=h||`<tr><td colspan="8" class="note">${tx('No cases match these filters.','沒有符合篩選條件的案例。')}</td></tr>`;
  const find=id=>rows.find(r=>r.cur.ID===id);
  tb.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{notes.find(n=>n.id===el.dataset.note).text=el.value;persist();counts()});
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=notes.find(n=>n.id===b.dataset.del);if(n.text.trim()&&!confirm('Remove this note and its text?'))return;notes=notes.filter(x=>x!==n);persist();body();counts()});
  tb.querySelectorAll('textarea[data-id],select').forEach(el=>{if(!REVIEW){el.readOnly=true;return}el.onchange=el.oninput=()=>{const r=find(el.dataset.id);r.cur[el.dataset.f]=el.value;persist();counts();const tr=el.closest('tr');tr.querySelector('td.id').innerHTML=idCell(r);};el.onblur=()=>filters()});
  tb.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{find(b.dataset.id).dec=b.dataset.d;persist();filters();body();counts()});
  // + Add case: focus the section's empty note, else open a new one
  tb.querySelectorAll('.add[data-sec]').forEach(b=>b.onclick=()=>{const sec=b.dataset.sec;let n=notes.find(n=>n.section===sec&&!n.text.trim());
    if(!n){n={id:'N'+Date.now().toString(36),section:sec,text:'',at:new Date().toISOString()};notes.push(n);persist();body();}
    setTimeout(()=>tb.querySelector(`textarea[data-note="${n.id}"]`)?.focus(),0)});
}
function counts(){
  const c=s=>rows.filter(r=>state(r)===s).length;
  const fin=rows.filter(r=>r.dec!=='delete').length;
  const nn=liveNotes().length;
  $('#counts').innerHTML=REVIEW?tx(`<b>${fin}</b> cases in the final table · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}${nn?` · <b>${nn}</b> new-case note${nn>1?'s':''} for the next draft`:''}`,`最終測試表 <b>${fin}</b> 筆 · 保留 ${c('kept')} · 已編輯 ${c('edited')} · 已新增 ${c('added')} · 刪除 ${c('deleted')}${nn?` · 下一版草稿的新案例筆記 <b>${nn}</b> 則`:''}`):tx(`<b>${rows.length}</b> cases`,`<b>${rows.length}</b> 筆案例`);
}
const COLS=['ID','Section','Precondition','Action','Expected Result','Priority','Spec Ref','Notes'];
const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
const finalRows=()=>rows.filter(r=>r.dec!=='delete').map(r=>Object.fromEntries(COLS.map(c=>[c,(r.cur[c]??'').trim()])));
const csv=()=>[COLS,...finalRows().map(r=>COLS.map(c=>r[c]))].map(r=>r.map(q).join(',')).join('\n');
function decisions(){
  const out=[];
  for(const r of rows){const s=state(r);if(s==='kept')continue;
    if(s==='deleted')out.push({type:'delete',id:r.cur.ID,was_change:r.cur.Change||''});
    else if(s==='added')out.push({type:'add',id:r.cur.ID,row:Object.fromEntries(COLS.map(c=>[c,r.cur[c]??'']))});
    else out.push({type:'edit',id:r.cur.ID,fields:Object.fromEntries(FIELDS.filter(f=>(r.cur[f]??'')!==(r.orig[f]??'')).map(f=>[f,{from:r.orig[f]??'',to:r.cur[f]??''}]))});}
  return out;
}
function decisionText(){
  const d=decisions(),c=s=>rows.filter(r=>state(r)===s).length;
  const L=[`Review: ${D.feature} / ${D.platform} · draft ${D.draft}`,`Final table: ${finalRows().length} cases · kept ${c('kept')} · edited ${c('edited')} · added ${c('added')} · deleted ${c('deleted')}`,''];
  for(const x of d){
    if(x.type==='delete')L.push(`DELETE ${x.id}`);
    if(x.type==='add')L.push(`ADD ${x.id} [${x.row.Section}] Action: ${x.row.Action} | Expected: ${x.row['Expected Result']} | Spec Ref: ${x.row['Spec Ref']}`);
    if(x.type==='edit')L.push(`EDIT ${x.id} `+Object.entries(x.fields).map(([f,v])=>`${f}: "${v.to}"`).join(' | '));
  }
  const ns=liveNotes();
  if(ns.length){L.push('',`NEW CASE NOTES (${ns.length}): turn each into rows in the right section, then propose the next draft`);
    for(const n of ns)L.push(`NOTE ${n.id} [typed under: ${n.section}]`,...n.text.trim().split(/\r?\n/).map(l=>'  '+l));}
  return L.join('\n');
}
async function copy(text,label){const ok=tx(label+' copied.','已複製'+label+'。');try{await navigator.clipboard.writeText(text);toast(ok)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok)}catch(_){toast(tx('Copy failed; select the text manually.','複製失敗，請手動選取文字。'))}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),tx('Final CSV','最終 CSV'));if(liveNotes().length)setTimeout(()=>toast(tx('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.','已複製最終 CSV。新案例筆記還不是表格列：請用「複製決定」或存檔交給 agent。')),50)};
$('#copyDec').onclick=()=>copy(decisionText(),tx('Decisions','決定清單'));
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(tx(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`,`存檔前請填寫 ${empty.map(r=>r.ID).join(', ')} 的操作與預期結果。`));return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(tx(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''),`已存成核准版本 ${j.version}：${j.cases} 筆案例。${j.csv}`+(nn?` · ${nn} 則新案例筆記已存到 ${j.notes_file}：請 agent 把它們做成下一版草稿。`:'')));
  }catch(e){toast(tx('Save failed: ','存檔失敗：')+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
applyStatic();header();filters();body();counts();focusRow();
</script>
</body>
</html>

 at its top right that opens the full-screen description editor (collapse icon, 「Done」) with the same text, as the character description does (R-107). Row: TC-147 (modified; iOS R-461).\n- R-478 [PM: main flow 「AI Mini Drama_storyboard」 2592:43622 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=2592-43622; update 10 4198:25565; Req: REQ-052] On the video result page a paused preview shows ▶ in its middle; tapping ▶ resumes playback (R-275). Row: TC-375 (modified; iOS R-462).\n\nRows modified to press a control a requirement already stated (no new requirement): TC-225 (the Credit Panel's 「Buy Credit」\n→ Google Play sheet, closed; R-342), TC-069 (the failed thumbnail's ⟳, R-381), TC-348 (a character chip, R-446), TC-111\n(the delete dialog's 「Delete」 on a throwaway drama, R-096).\n\n### Open questions (2026-10-29, PM / MX controls)\n- Q-A14 (PM Error Handling 2621:30383) The regenerated scene image in the scene detail carries a ⋯ (board note 「… menu on\n  the image」), but no frame draws its menu and the Design's regenerated scene detail (R-326) has none. Is there a menu,\n  and what does it offer? Not traced to a row until then (control K-0b6874; iOS Q-28).\n- Q-A15 (PM main flow 2283:10856 「Demo page_Straight video」) The PM draws a feature intro (「Don't show again」, 「Try It\n  Now」) between the Launcher and the landing; the Design's shortcut arrow (2778-129128, R-190) goes straight to the\n  landing. Is the intro shown on Android, and only until 「Don't show again」? Rows follow the PM (TC-541, R-472; iOS Q-29).\n- Q-A16 (PM main flow 2186:7485, pm-top-mockups) The PM Storyboard Preview card has a 「Create video」 button whose tap adds\n  the bubble 「Create video」 before the video settings card; the Design card has no button and the settings card follows\n  the storyboard (R-424, R-211). Which is current? TC-079 taps it when shown (R-474; iOS Q-30).\n- Q-A17 (MX mx-a-left / mx-a-mid) The MX mockups draw an older chat around the chat-count and charging rules: a 「Consume\n  credits?」 card with 「Don't ask again」 and 「Confirm」 (see Q-3), a template chat asking 「Continue to create the script?」\n  with 「Ready to create」, an add-image button in the composer, aspect-ratio chips, a 「Create characters」 card with\n  「Customize my characters (optional)」, an edit icon on Characters Result, and a scene editor with 「Tell AI what to\n  change…」. Are these only illustrations (rows follow the Design / PM), or does any of them still ship? Their controls are\n  n/a in the control trace (iOS Q-31).\n\n## Added 2026-10-29 — MX ③ Credit Charging Table (REQ-057)\nBoard `mx-a-right` 「③ Credit Charging Table / 1. Action ID & Charging Table Link」 links the sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (last modified 2026-10-20; read 2026-10-29, saved in specs/2026-10-21-2/extracted/mx-charging-table.md). The user decided (2026-10-29, REQ-057) to use the sheet only where no other source gives a number: the discount prices, the no-discount regenerate and the action ids. Normal prices stay PM 10/16 / Design (R-253, R-050 and the price rows); the sheet's own normal prices and its missing Seedance 2.5 row are Q-A18 and Q-A19. Ported from iOS draft 20261029-143013: iOS R-463 – R-465 are Android R-479 – R-481, iOS Q-32 / Q-33 are Android Q-A18 / Q-A19. Android differences: the discount needs a Google Play sandbox subscription (license-tester account) in the session; the charge is read in logcat after `device-android.ts pull-logs` (Android 16.8 logs `action_id` and `total_credit` on its credit lines, e.g. A2 2026-10-27 `RefToVideo credit action_id=genvideo_1_sec_bytedance_seedance2.0std_none_480p_aiminidrama … total_credit=60`); the paid tier is PowerDirector Pro only (Q-A2).\n\n- R-479 [MX:mx-a-right ③ Credit Charging Table, linked sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20); extracted/mx-charging-table.md; Req: REQ-057] First-time credit discount prices (the R-147 discount: a Free user who subscribes during an AI Mini Drama session): that session's first generation of each action costs 2 credits per character image, 2 credits per storyboard scene, 2 credits per second of Seedance 2.0 (1080p) video and 2 credits per second of Seedance 2.0 Mini (720p) video; the action card shows that price and the same amount is charged. (iOS R-463) HELD (REQ-059, 2026-10-29): the promotion price is not in use until the user says it applies; NOT TESTABLE until then, no row expects it.\n- R-480 [MX:mx-a-right ③ Credit Charging Table, linked sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20); extracted/mx-charging-table.md; Req: REQ-057] Regenerating a character, a storyboard scene or a video is never discounted (the sheet's discount column is 「-」 for every regenerate): even inside the discounted session it is charged the normal price. (iOS R-464) HELD (REQ-059, 2026-10-29): this rule only matters inside the promotion, held with it; NOT TESTABLE until then.\n- R-481 [MX:mx-a-right ③ Credit Charging Table, linked sheet 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20); extracted/mx-charging-table.md; Req: REQ-057] Discounted charges are booked under the `…_aiminidrama_discount` action ids and normal charges under the `…_aiminidrama_normal` action ids (`genimage_1_img_openai_gptimage2_\u003cnone|enable>_1K_aiminidrama_\u003cnormal|discount>`, `genvideo_1_sec_bytedance_seedance2.0std_enable_1080p_aiminidrama_\u003cnormal|discount>`, `genvideo_1_sec_bytedance_seedance2.0mini_enable_720p_aiminidrama_\u003cnormal|discount>`); logcat shows each charge's `action_id` and `total_credit`. (iOS R-465) — Changed 2026-10-29 (REQ-059): rows check the `…_aiminidrama_normal` ids only; the `_discount` ids are held with the promotion.\n\n### Open questions (2026-10-29, MX ③)\n- Q-A18 (MX mx-a-right ③ Credit Charging Table, linked sheet 2026-10-20; REQ-057) The sheet's normal prices (character 6 per image, storyboard 6 per scene, Seedance 2.0 1080p 13 per second, Seedance 2.0 Mini 720p 4 per second) disagree with the PM 10/16 定案 (Seedance 2.0 4 per second, Mini 2 per second) and with the app (character ◆4 per image in every Android run to 2026-10-29). Which normal prices are current? Rows keep the PM 10/16 / Design prices until the user sends the price update (R-253, R-479, R-480; TC-229, TC-347, TC-079; iOS Q-32). **Answered 2026-10-29 (user, REQ-059):** \"by default the original price should be the correct option … Unless I specified in the future that the promotion price is applied use the original price.\" Rows use the sheet's original prices (R-040, R-050, R-061, R-069, R-081, R-254, R-259, R-260).\n- Q-A19 (MX mx-a-right ③ Credit Charging Table, linked sheet; REQ-057, reworded 2026-10-29 for REQ-059) The sheet has no Seedance 2.5 row. Does Seedance 2.5 (Best) have a price in the charging sheet? Until it does, 2.5 keeps PM 10/16's 6 credits per second (R-069).\n\n## Added 2026-10-29 (2) — original prices by default (REQ-059)\nUser, 2026-10-29: \"by default the \"original\" price should be the correct option, the special price I haven't received\ninformation when it is going to be used. Unless I specified in the future that the promotion price is applied use the\noriginal price.\" This replaces the REQ-057 rule that normal prices stay PM 10/16 / Design. Normal prices now come from\nthe MX ③ charging sheet (`specs/2026-10-21-2/extracted/mx-charging-table.md`), for first generation and regenerate\nalike: character 6 per image, storyboard 6 per scene image, Seedance 2.0 (1080p) 13 per second, Seedance 2.0 Mini\n(720p) 4 per second; Seedance 2.5 keeps PM 10/16's 6 per second (no sheet row, Q-A19). Changed in place, IDs\nkept: R-040, R-050, R-061, R-069, R-081, R-254, R-259, R-260, R-466, R-481. Held: R-479 (discount prices) and\nR-480 (no discount on regenerate, which only matters inside the promotion), with the R-147 discount price; TC-231\nis parked (removed) and the other REQ-057 discount rows now check the original price and the `_normal` ids.\nQ-A18 is answered.\n\n## Added 2026-10-30 — Regenerate Clip one at a time (REQ-061)\n`figma-check.ts` (2026-10-30) found a PM board no group covered: 「10/29 update — Regenerate Clip 一次只能跑一個（PDR-A 16.8.0\nAI Agent bug）」 (4784:70878, Figma only, newer than PM Spec 20261021; group `u1029`, board-notes 「PM — 10/29 Regenerate\nClip one at a time」). Its ◆60 is a mock: the regenerate price stays the scene's length × the model's rate (R-081).\n\n- R-482 [PM: 10/29 update §13.25 https://www.figma.com/design/44RyrcOcWi2MvhGci9bO5F/AI-Mini-Drama?node-id=4784-70878; Req: REQ-061] Only one clip regenerates at a time. While a clip regenerates, every other scene's 「Regenerate Clip」 is drawn at 40% opacity but stays tappable (not disabled, so the user learns why); tapping it shows the toast 「Another clip is regenerating. Try again when it's done.」, sends nothing, charges nothing and keeps the prompt the user edited. When the regenerating clip ends (success or failure) the button is back to normal. Applies to every entry that regenerates a single clip (Fix Scene › Edit, the scene edit page). Walked by: TC-437, TC-551, TC-552.\n","update_plan":"","zh":{"TC-001":{"Section":"進入與首頁","Precondition":"App 在 Home (Launcher)","Action":"點 「AI Mini Drama」 捷徑；然後使用系統返回（Android 返回手勢或按鈕）","Expected Result":"AI Mini Drama 登陸頁開啟；系統返回回到 Launcher（Home），與登陸頁的 ← 相同"},"TC-541":{"Section":"進入與首頁","Precondition":"App 在 Home（Launcher）；此安裝上 AI Mini Drama 的介紹尚未以 「Don't show again」 關閉","Action":"1. 點 「AI Mini Drama」 捷徑。2. 在介紹頁點音量圖示兩次。3. 點 ‹。4. 再點捷徑並使用系統返回（Android 返回手勢或按鈕）。5. 再點捷徑，勾選 「Don't show again」 並點 「Try It Now」。6. 回到 Launcher 再點一次捷徑","Expected Result":"介紹頁顯示 「AI Mini Drama」/「Turn your idea into a video—same characters, same voices, every scene.」，附播放中的示範影片、「Don't show again」 與 「Try It Now」；每點一次音量圖示會關閉再開啟聲音；‹ 與系統返回都回到 Launcher；「Try It Now」 開啟 AI Mini Drama 登陸頁；勾選 「Don't show again」 後，捷徑直接開啟登陸頁、不顯示介紹","Notes":"僅 PM：尚無 Design 畫面（PM 主流程 2283:10856 「Demo page_Straight video」）。Design 的捷徑箭頭直接到登陸頁 (R-190)；若未顯示 已開啟首頁","Action":"點 「More」；然後使用系統返回","Expected Result":"全分類頁開啟：分類附圖示與名稱（Office Romance, Fantasy World, Urban Romance, Family & Life, Animated Stories），每個分類為一列封面與名稱；系統返回回到 AI Mini Drama 登陸頁，與頁首返回相同","Notes":"Android 單 DRA262610P0138 (NeedMoreInfo, AIFound)：英文下 「Start from a template」 沒有載入任何範本（亦見 TC-003），且 More 開啟空白頁，重新啟動後仍然如此"},"TC-415":{"Section":"範本","Precondition":"More 頁面已開啟","Action":"查看範本數量多到放不下的分類列（例如 Workplace Romance），然後向左滑動","Expected Result":"有明顯的水平瀏覽提示，表示畫面外還有更多範本","Notes":"DRA262610P0065 (NewCreated, AIAgent, UX)"},"TC-007":{"Section":"範本","Precondition":"已開啟首頁","Action":"點範本封面；然後以系統返回離開詳細頁","Expected Result":"範本詳細頁開啟；範本影片自動播放並有聲音；顯示 「Make my version」；系統返回回到登陸頁，與頁首返回相同，且範本影片停止（不會繼續出聲）"},"TC-008":{"Section":"範本","Precondition":"範本詳情播放中","Action":"點影片；點 ▶；然後點音量圖示兩次","Expected Result":"第一次點擊暫停影片（暫停且音量關閉狀態）；▶ 恢復播放；每點一次音量圖示會關閉再開啟聲音，圖示隨之變化（volume off / volume on）"},"TC-009":{"Section":"範本","Precondition":"已開啟範本詳情","Action":"點選「Make my version」","Expected Result":"為該範本開始聊天，並在產生任何大綱之前詢問「What format would you like for your video?」"},"TC-503":{"Section":"範本","Precondition":"範本詳細頁已開啟（例如 「Merger Season」）","Action":"點 「Make my version」，選擇英文（再選法文）、「Yes, include captions」、Generate；在大綱與 Characters Result 出現後等待 3 分鐘","Expected Result":"範本的角色就緒後，「Create storyboard」 卡片會自行出現；聊天不會等待輸入訊息","Notes":"DRA262610P0268 (Assigned, AIFound)"},"TC-010":{"Section":"範本","Precondition":"已開啟全部分類頁","Action":"閱讀每個範本名稱","Expected Result":"名稱拼寫正確，例如「Six Things You Didn't Know」含撇號","Notes":"Q-1：設計檔本身省略了撇號；回歸 DRI261893-0158 (NewCreated, AIAgent)：範本標題 「Six Things You Didnt Know」 缺少撇號 — 此處也複查此單；Android 單 DRA262610-0051 (NewCreated, AIFound, UI)：範本標題顯示為 「Six Things You Didnt Know」，沒有撇號；REQ-022 lead #34（Android 報告 16.8.0）"},"TC-011":{"Section":"點子輸入","Precondition":"已開啟首頁","Action":"點選「Create Your Drama」","Expected Result":"開啟空白聊天，輸入框提示文字為「Enter your idea to create drama」，並有麥克風按鈕","Notes":"REQ-022 lead #14、#22、#33（Android 報告 16.8.0）；REQ-022 lead #41（Android 報告 16.8.0）"},"TC-524":{"Section":"點子輸入","Precondition":"空白聊天（TC-011 之後）","Action":"不說話點麥克風按鈕；然後再點一次（或其取消控制）停止","Expected Result":"語音輸入開始：顯示聆聽狀態（首次使用時 Android 會先要求麥克風權限；請允許）；停止後輸入框保持空白，輸入區可供打字","Notes":"不需說話即可按麥克風；聽寫本身需要口說輸入（語音）"},"TC-425":{"Section":"點子輸入","Precondition":"History 中有一部 drama","Action":"從 History 開啟一部 drama，點 ← 回到 AI Mini Drama 頁，點 「Create Your Drama」","Expected Result":"Create Your Drama 一律開啟新的空白聊天","Notes":"DRA262610P0103 (RDResolved, AIFound, UX)；所見：剛關閉的 drama 又被開啟"},"TC-012":{"Section":"點子輸入","Precondition":"空白聊天，輸入框已取得焦點","Action":"查看輸入框上方","Expected Result":"顯示「Surprise me」與兩個靈感 chip"},"TC-013":{"Section":"點子輸入","Precondition":"空白聊天，有靈感 chip","Action":"點選一個靈感 chip","Expected Result":"chip 文字放入輸入框 (不送出)"},"TC-014":{"Section":"點子輸入","Precondition":"空白聊天；記下兩個靈感 chip","Action":"不清除輸入，連點 「Surprise me」 五次","Expected Result":"每次點擊都會在現有文字之後附加一則靈感，而不是取代；選項從池中隨機挑選（不限於兩個 chip），因此五次不會全是同一字串（允許單次重複）","Notes":"回歸 DRI261893-0124 (NewCreated, AIAgent) — 與 TC-014 的附加規則 (DRI261895P0023) 衝突；請對照目前規格複查：同一登陸階段內 Surprise me 會改變其建議 — 此處也複查此單；iOS 單 DRI261895P0023 (NewCreated, AIAgent)，Android 的線索：Surprise me 取代輸入區而非附加其建議 — 此處也複查此單"},"TC-380":{"Section":"點子輸入","Precondition":"空白聊天；記下兩個靈感 chip","Action":"點選「Surprise me」五次，每次都清空輸入框","Expected Result":"沒有任何一次選出的內容與那兩個 chip 的字串相同","Notes":"10 則一組 (R-014)"},"TC-015":{"Section":"點子輸入","Precondition":"空白聊天","Action":"將 1,050 字元的文字貼到輸入框","Expected Result":"輸入框保留前 1,000 個字元；計數器顯示紅色「1000/1000」；顯示「You've reached the 1,000-character limit.」","Notes":"Q-2"},"TC-016":{"Section":"點子輸入","Precondition":"輸入框已達 1,000 字元","Action":"再輸入一個字元","Expected Result":"不會新增任何字元；上限訊息持續顯示"},"TC-017":{"Section":"點子輸入","Precondition":"輸入框已達 1,000 字元","Action":"刪除一個字元","Expected Result":"計數器不再是紅色，上限訊息消失"},"TC-018":{"Section":"點子輸入","Precondition":"輸入框約 400 字元","Action":"以系統返回（Android 返回手勢或按鈕）收起鍵盤","Expected Result":"系統返回只關閉鍵盤，聊天保持開啟；輸入框保留文字並收合為最多 3 行"},"TC-372":{"Section":"點子輸入","Precondition":"空白聊天，鍵盤已開啟","Action":"持續輸入直到文字超過輸入框的最大高度","Expected Result":"輸入框隨文字增高至最大高度；更多文字在框內捲動，且不遮住其他控制項"},"TC-373":{"Section":"點子輸入","Precondition":"聊天中已有大綱，鍵盤已開啟","Action":"持續輸入直到文字超過輸入框的最大高度","Expected Result":"輸入框隨文字增高至最大高度；更多文字在框內捲動，且不遮住其他控制項"},"TC-019":{"Section":"點子輸入","Precondition":"聊天中至少有一則訊息","Action":"查看輸入框上方，然後點 「More ideas +」","Expected Result":"顯示 「More ideas +」 chip；點擊後為輸入提供更多故事靈感（記錄出現的內容，Q-19）"},"TC-020":{"Section":"格式卡片","Precondition":"空白聊天","Action":"送出一個點子 (例如「A barista and a regular fall in love over a lost umbrella」)","Expected Result":"助理詢問「What format would you like for your video?」，包含 1. Video language (English, Spanish, French, German, Japanese, Korean, Chinese) 與 2. Captions (「Yes, include captions」/「No captions」)；沒有畫面比例的問題","Notes":"回歸 DRI261893-0118 (NewCreated, AIAgent) — Design 優先：目前的格式卡沒有長寬比選項 (TC-020)；複查前請先確認：格式設定沒有長寬比選擇 — 此處也複查此單；REQ-022 lead #6, S1（Android 報告 16.8.0）"},"TC-021":{"Section":"格式卡片","Precondition":"已顯示格式卡片","Action":"點選另一個語言，再點選另一個字幕選項","Expected Result":"每組只會選取一個選項","Notes":"REQ-022 lead #6, S1（Android 報告 16.8.0）"},"TC-022":{"Section":"格式卡片","Precondition":"已顯示格式卡片","Action":"點選卡片上的按鈕","Expected Result":"卡片被使用者氣泡取代「1. Video language: \u003cx> / 2. Captions: \u003cYes|No>」","Notes":"回歸 DRI261893-0011 (QANeedRework, AIFound)：格式卡按鈕顯示 \"Continue\" 而非規格指定的 \"Generate\" — 此處也複查此單；REQ-022 lead #6, S1（Android 報告 16.8.0）"},"TC-414":{"Section":"格式卡片","Precondition":"範本聊天；顯示格式卡 「What format would you like for your video?」","Action":"選擇語言與字幕，點 Continue，然後向上捲動","Expected Result":"按 Continue 後，助理問題 「What format would you like for your video?」 仍留在聊天記錄中","Notes":"DRA262610P0063 (TRCreated, UI)；單中引用 PM 畫面（Figma node 2182-5791）與 iOS 行為"},"TC-468":{"Section":"格式卡片","Precondition":"空白聊天；已送出想法並顯示格式卡","Action":"輸入 「Make it a comedy please」 並送出，而不點卡片按鈕","Expected Result":"格式卡會保留，直到使用者選好影片語言與字幕，或助理再次詢問；不會以預設的英文與字幕產生大綱","Notes":"DRA262610P0209 (NewCreated, AIFound, UX)；與 iOS 單 DRI261896P0038 症狀相同（原 TC-213）"},"TC-488":{"Section":"格式卡片","Precondition":"以日文與 「No captions」 建立的 drama","Action":"點 New chat，送出日文寫的想法並查看格式卡","Expected Result":"格式卡預先選取上次使用的語言與字幕設 rs?」 列為 Iris 提示 (R-090)，因此請確認仍保留一個標題"},"TC-497":{"Section":"故事大綱","Precondition":"空白聊天","Action":"送出含引號台詞、固定場景數（例如 「3 scenes」）與方言要求（例如台灣口語對白）的劇本；繼續到分鏡並開啟 「View more >」","Expected Result":"引號台詞與指定場景數被保留，或助理說明哪項要求無法達成","Notes":"DRA262610P0254 (NewCreated, AIFound, UX)；與 iOS 單 DRI261894P0048 症狀相同（原 TC-188）"},"TC-508":{"Section":"故事大綱","Precondition":"範本聊天（Make my version）已有大綱與角色","Action":"為某個角色選擇自己的圖片並閱讀角色描述","Expected Result":"每個角色描述都呈現該角色的外觀（服裝、髮型、配件），而不只是故事定位與個性","Notes":"DRA262610P0290 (NewCreated, AIFound, UX)；R-021 只要求每個角色有描述（待 PM 裁定）"},"TC-025":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"點 Back","Expected Result":"「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」，附「Leave anyway」與「Stay」","Notes":"REQ-022 lead #7（Android 報告 16.8.0）"},"TC-395":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"系統返回（Android 返回手勢或按鈕）；對話框顯示時再用一次系統返回；然後再以系統返回開啟一次並點 「Stay」","Expected Result":"「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」，附 「Leave anyway」 與 「Stay」；Stay 關閉對話框且大綱繼續產生；對話框上的系統返回如同 「Stay」 關閉它（聊天保留且大綱繼續產生），絕不等同 「Leave anyway」","Notes":"PM 0930 列出系統返回與 Back、New chat、History；REQ-022 lead（Android 報告 #14）；Android 單 DRA262610P0121 (Assigned, AIAgent)：大綱產生中按 Android Back 會直接離開，沒有中斷選項；REQ-022 lead #14、#22、#33（Android 報告 16.8.0）"},"TC-396":{"Section":"故事大綱","Precondition":"大綱產生中；以系統返回開啟 「Leave this chat?」","Action":"點 「Leave anyway」","Expected Result":"AI Mini Drama 登陸頁開啟；聊天不在 History 中"},"TC-452":{"Section":"故事大綱","Precondition":"範本聊天（例如 「Forbidden Office Romance」 › Make my version › Continue）；大綱產生中","Action":"系統返回（Android 返回手勢或按鈕）；點 「Leave anyway」；等待 1 分鐘並開啟 History","Expected Result":"「Leave this chat?」 如同自訂想法流程出現；Leave anyway 停止產生，History 中沒有儲存任何內容","Notes":"DRA262610P0184 (Assigned, AIFound)：範本聊天離開時沒有確認，且被儲存到 History"},"TC-026":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"點選 History (右上角)","Expected Result":"出現相同的「Leave this chat?」對話框","Notes":"iOS 單 DRI261894P0049 (NewCreated, AIFound)，Android 的線索：離開防護只在 History 圖示出現，Back 不會，且文字說工作會停止 — 此處也複查此單"},"TC-027":{"Section":"故事大綱","Precondition":"已顯示 Leave this chat?","Action":"點選「Stay」","Expected Result":"對話框關閉；聊天保留且大綱仍會送達"},"TC-028":{"Section":"故事大綱","Precondition":"已顯示 Leave this chat?","Action":"點選「Leave anyway」，然後開啟 History","Expected Result":"聊天關閉；History 中沒有此點子的紀錄"},"TC-519":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點 Back (←)，然後點 「Leave anyway」","Expected Result":"聊天關閉並開啟 AI Mini Drama 首頁（「Hi, I'm your AI Drama Assistant」、「Create Your Drama」、「Start from a template」）","Notes":"系統返回到同一頁：TC-396"},"TC-357":{"Section":"故事大綱","Precondition":"大綱產生中","Action":"點選 New chat，然後點「Stay」；點選點數膠囊，然後點「Stay」","Expected Result":"每次點選都顯示「Leave this chat?」/「Your story outline isn't ready yet, so this chat won't be saved.」，附 Leave anyway / Stay；Stay 關閉對話框，聊天保留且大綱仍會送達","Notes":"離開路徑來自 Design 1016_Chat navigation；對話框文案來自 PM 10/21，較新 (REQ-029)。TC-025 – TC-028 涵蓋返回與 History"},"TC-358":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點選點數膠囊，然後點「Leave anyway」；再開啟 History","Expected Result":"開啟 My Credits；History 沒有此點子的紀錄","Notes":"首頁來自 Design 1016_Chat navigation (REQ-029)"},"TC-520":{"Section":"點數與額度","Precondition":"免費方案；從聊天的點數 pill 開啟 My Credits（TC-358 之後，或之後任一階段的 pill）","Action":"點 「Buy More」，然後以系統返回（Android 返回手勢或按鈕）返回；點 「Subscribe Now」，然後不訂閱並以系統返回返回；點 「Claim」；最後以系統返回離開 My Credits","Expected Result":"「Buy More」 開啟點數購買頁；「Subscribe Now」 開啟訂閱頁；每次系統返回都回到 My Credits；「Claim」 將今日的免費點數加入餘額，且 24 小時後才能再次使用；最後一次系統返回離開 My Credits","Notes":"不進行購買或訂閱（使用者規則）。Android 以 App 顯示的名稱稱呼付費方案（MX：Pro+ / Android Premium，R-103）"},"TC-521":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點 History，然後點 「Leave anyway」","Expected Result":"聊天關閉並開啟 Recent Task；列表中沒有此想法的項目"},"TC-522":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Action":"點 New chat，然後點 「Leave anyway」","Expected Result":"聊天關閉並開啟新的空白聊天（「Hi, I'm your AI Drama Assistant」、「Surprise me」、想法建議、空的輸入區）；被放棄的想法不在 History 中"},"TC-386":{"Section":"故事大綱","Precondition":"為新點子產生大綱中","Expected Result":"History 沒有該點子的紀錄","Action":"在 Recents 滑掉 App，重新開啟並開啟 History"},"TC-029":{"Section":"故事大綱","Precondition":"大綱已完成","Action":"點 Back，再從 History 重新開啟該短劇","Expected Result":"離開時不出現對話框；該 drama 在 History 中，並重新開啟於大綱步驟"},"TC-397":{"Section":"故事大綱","Precondition":"大綱已完成，沒有任何產生中的工作","Action":"系統返回（Android 返回手勢或按鈕），然後從 History 重新開啟該 drama","Expected Result":"離開時沒有對話框；登陸頁開啟；drama 在 History 中，並在大綱步驟重新開啟"},"TC-360":{"Section":"故事大綱","Precondition":"大綱已完成，沒有任何產生中的工作","Action":"點選 History；重新開啟該 drama；點選點數膠囊；返回；點選 New chat","Expected Result":"每次都不出現對話框；History 開啟 Recent Task 並列出此 drama，點數膠囊開啟 My Credits，New chat 開啟新的空白聊天","Notes":"PM：已儲存的聊天離開時不出現對話框；Design 1016 顯示「Leave this chat?」但較舊 (REQ-029)。TC-029 涵蓋返回"},"TC-030":{"Section":"故事大綱","Precondition":"大綱請求以 5xxx 失敗：「Something went wrong on my end. Let's try that again.」 附 「Try again」（故障開關（iOS Pink；Android 16.8 無）› Fail every call，或自然發生的 5xxx，如網路/SSL 失敗；記錄是哪一種）","Action":"讀取失敗訊息，然後點 「Try again」 並等待回覆","Expected Result":"「Something went wrong on my end. Let's try that again.」 附 「Try again」；Try again 會重送同一個想法與格式，回覆為完整的 「Story Outline & Characters Result」 卡（Story Outline、「Possible Characters:」 與角色欄位 / Characters Result），沒有任何訊息更改影片設定","Notes":"需要故障注入；與 iOS 單 DRI261894P0036 症狀相同（原 TC-184）；REQ-022 lead #15、#23、#37、S7（Android 報告 16.8.0）"},"TC-031":{"Section":"故事大綱","Precondition":"大綱請求以 4xxx 失敗","Action":"送出違反政策的點子","Expected Result":"助理說「I couldn't write a story from this idea. It may not meet our terms of service. Try describing it a different way.」，沒有按鈕；會產生新點子且不再顯示格式卡片","Notes":"內容審核觸發可能無法重現；Android 單 DRA262610P0228 (NewCreated, AIFound, UX)：要求在格式卡之前做內容檢查；Design 規格不同：格式卡跟在第一個想法之後 (R-018)，拒絕來自大綱請求 (R-027)；以規格為準"},"TC-511":{"Section":"故事大綱","Precondition":"大綱在任何大綱產生前失敗：「Something went wrong on my end. Let's try that again.」 附 Try again (5xxx)，或 4xxx 拒絕（例如 TC-031 的政策想法）","Action":"點 Back (←)，然後點 「Leave anyway」；在第二個失敗的聊天以系統返回重複一次；開啟 History","Expected Result":"每次離開都顯示 「Leave this chat?」/「Your story outline isn't ready yet, s hoose Character 已開啟","Action":"開啟篩選，閱讀 Gender 與 Ethnicity 選項清單；選擇 Gender 與 Ethnicity 並套用；點 Gender chip 上的 ×；然後點篩選圖示","Expected Result":"Gender 列出 Female、Male 與 Other(s)，各一次；資料庫只顯示符合的角色；已選篩選以可移除的 chip 顯示，篩選圖示出現勾號；× 移除該篩選及其 chip，清單隨之放寬；篩選圖示重新開啟 Filter 面板，其餘選擇仍保持選取","Notes":"DRA262610-0020 (NewCreated, AIFound, UI)；Design 規格不同：PM 的 Make your character 畫面將 Gender 列為 「Female / Male / Others」 — 以規格為準，記錄每個清單使用的標籤 — 單中預期 「The filter Gender chip reads 「Other」, matching the other option lists」；本列以規格為準 (REQ-043)"},"TC-410":{"Section":"角色","Precondition":"Choose Character › Filter 已開啟；「My characters only」 未勾選","Action":"查看未勾選的 「My characters only」 核取方塊及其標籤","Expected Result":"未勾選的核取方塊使用預期的啟用控制色（如 Design），而不是灰色外框","Notes":"DRA262610-0045 (NewCreated, AIFound, UX)"},"TC-371":{"Section":"角色","Action":"拖曳 Age 滑桿把手","Expected Result":"拖曳時，把手目前的值 (例如「26」) 顯示在其上方","Precondition":"Choose Character › Filter 已開啟","Notes":"Android 單 DRA262610-0017 (Assigned, AIFound, UX)：拖曳時 Age 滑桿標籤停在 「0」/「100」；範圍只在 ✓ 之後以 chip 顯示"},"TC-037":{"Section":"角色","Action":"點選 X","Expected Result":"「Leave without finishing?」/「If you leave now, your picks won't be saved.」，附「Leave」與「Keep choosing」","Notes":"設計優先於 PM (使用者規則 2026-10-19)。PM 主流程為「Discard character changes?」 / Discard / Keep Editing。","Precondition":"Choose Character 已開啟，且有新的未儲存選擇"},"TC-038":{"Section":"角色","Precondition":"已顯示 Leave without finishing?","Action":"點選「Keep choosing」，然後再點 X 並點「Leave」","Expected Result":"Keep choosing 保留所選內容；Leave 關閉且不儲存所選內容","Notes":"設計優先於 PM (使用者規則 2026-10-19)。PM 標籤：Keep Editing / Discard。"},"TC-526":{"Section":"角色","Precondition":"Choose Character 已開啟，且有新的未儲存選擇","Action":"使用系統返回（Android 返回手勢或按鈕）；顯示 「Leave without finishing?」 時再用一次系統返回；開啟篩選，選 Female 並使用系統返回；然後再用一次系統返回並點 「Leave」；重新開啟 Choose Character，不更改任何內容並使用系統返回","Expected Result":"系統返回顯示與 X 相同的 「Leave without finishing?」 對話框；對話框上的系統返回如同 「Keep choosing」 關閉它，且選擇保留；Filter 面板上的系統返回如同其 X 關閉它，Female 不會套用；「Leave」 關閉 Choose Character 且不儲存選擇；若沒有任何更改，系統返回直接關閉 Choose Character 回到  AIFound, UX)：已輸入資料時在 Create my character 點 X 會直接關閉且不確認，表單重新開啟時為空"},"TC-402":{"Section":"建立我的角色","Precondition":"輸入描述、Gender、Ethnicity、Age 和參考照片後點 X，顯示「Discard this character?」/「What you've entered won't be saved.」","Action":"點 「Keep editing」；再點 X，點 「Keep editing」；使用系統返回，再在對話框上使用系統返回；再使用一次系統返回，然後點 「Discard」","Expected Result":"Keep editing 關閉對話框且表單保留所有輸入；系統返回顯示與 X 相同的對話框，在對話框上按系統返回則如 Keep editing 般關閉並保留所有輸入；Discard 關閉 Make your character，且沒有角色被存到 Mine 或套用到欄位","Notes":"涵蓋第 3 輪（關閉時捨棄：對話框的每個按鈕與每種關閉方式）"},"TC-056":{"Section":"建立我的角色","Precondition":"Make your character 為空","Action":"點 X；再次開啟 Make your character，保持空白並使用系統返回","Expected Result":"兩者都直接關閉，沒有對話框"},"TC-057":{"Section":"建立我的角色","Precondition":"角色已產生","Action":"在已產生的角色上點選 X","Expected Result":"「Discard this character?」/「It won't be saved, and the credits you spent won't be refunded.」，附「Keep」與「Discard」(紅色)","Notes":"原本：X 也會儲存角色（主流程備註 \"confirm or tap X 都會存\"），10/21 已取代；DRI261896P0037；Android 單 DRA262610P0262 (NeedCodeReview, AIAgent)：X 關閉已完成的角色時沒有 「Discard this character?」"},"TC-058":{"Section":"建立我的角色","Precondition":"資料庫中有使用者角色","Action":"開啟其 ⋮ 選單並點 Delete；點 「Cancel」；再開啟 ⋮ › Delete，並在對話框上使用系統返回","Expected Result":"「Delete this character?」/「This character will be permanently deleted and can't be recovered.」，附 Cancel / Delete；「Cancel」關閉對話框，角色仍在角色庫；系統返回如 Cancel 般關閉對話框，角色仍在角色庫","Notes":"DRA262610P0130 (NewCreated, AIAgent, UX)。Design 規格不同：規格的選單只提供 Delete (R-049)，沒有角色編輯器或版本；外觀透過聊天修改（「Update characters」, R-254）；以規格為準 — 該單預期「A character editor / version flow and an alternative-image generation route are offered」；本列以規格為準 (REQ-043)。「Cancel」→ Character Library 為 「PM-only: no Design frame yet」（PM 主流程 2613-28739）"},"TC-059":{"Section":"建立我的角色","Precondition":"已開啟資料庫","Action":"開啟 CyberLink 內建角色的選單；然後用系統返回關閉","Expected Result":"沒有 Delete 選項；系統返回只關閉選單，角色庫維持原狀"},"TC-060":{"Section":"分鏡","Precondition":"已顯示 Create storyboard 卡片","Action":"點 Generate","Expected Result":"定價時顯示「Thinking...」，接著產生分鏡，扣除的點數與顯示的價格相符；Mine › Credits › Details 記為 Text to Image 列（每張場景圖 6 點數）和一筆 Text to Speech 列，合計等於該價格","Notes":"原價來自 MX ③ 收費表 「AI Mini Drama CMS」 › 「Action ID (not on CMS)」 (2026-10-20)；預設為原價，促銷價在使用者表示適用前保留 (user 2026-10-29, REQ-059)。Android 單 DRA262610P0198 (Assigned, AIFound)：六個場景報價並扣了 34 點數，但文章寫每張圖 2 點數；檢查 Credit Details 的列加總等於圖片數 × 2 加 TTS"},"TC-377":{"Section":"分鏡","Precondition":"已顯示「Create storyboard」卡片；已讀取點數膠囊","Action":"點 Generate","Expected Result":"卡片消失且不新增使用者泡泡；「I'll create a storyboard - give me a moment...」，然後是 「Preparing your scenes…」 骨架卡片；點數標籤在卡片變成 「Creating your storyboard…」 之前不變，之後才扣除價格（一筆 Credit Details 扣款）","Notes":"Android 單 DRA262610P0122 (Assigned, AIAgent, UI)：在 Create storyboard 點 Generate 會新增使用者泡泡 「Create storyboard」；該單預期「Yes, create storyboard」。Design 規格不同：PM 1002 (R-279) 完全不新增使用者泡泡；以規格為準；Android 單 DRA262610P0197 (NewCreated, AIFound, UX)：Storyboard Result 出現後，「Create storyboard」泡泡仍留在聊天中；PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-512":{"Section":"分鏡","Precondition":"已點 Create storyboard；分鏡在階段 ① 或 ②","Action":"在分鏡準備與建立期間查看輸入列","Expected Result":"聊天中任何地方都沒有 ■ 停止或暫停控制；輸入列只顯示麥克風","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)；RD 版本有 ■ 停止按鈕，將移除"},"TC-061":{"Section":"分鏡","Action":"點 Back","Precondition":"分鏡階段 ①：顯示 「Preparing your scenes…」 骨架卡片（Iris 正在寫提示詞，尚未扣款）","Expected Result":"「Leave while we're preparing?」/「Your storyboard will start soon. If you leave now, we'll have to prepare it again when you come back.」，附 「Leave anyway」（紅色）和 「Stay」；沒有 「Stop and lose your credits?」","Notes":"Android 單 DRA262610P0077 (Assigned, AIFound, UX)：點 Generate storyboard 後立刻按 ←，在 「Working on it…」 顯示時離開，沒有 「Stop and lose your credits?」 警告；PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-398":{"Section":"分鏡","Precondition":"分鏡階段 ①：顯示 「Preparing your scenes…」 骨架卡片（Iris 正在寫提示詞，尚未扣款）","Action":"系統返回（Android 返回手勢或按鈕）；對話框顯示時再用一次系統返回；然後再以系統返回開啟一次並點 「Stay」","Expected Result":"「Leave while we're prepari y.」；分鏡持續產生，返回時已在，且只扣款一次","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-535":{"Section":"分鏡","Precondition":"分鏡階段 ②：顯示 「Creating your storyboard…」 卡片（已扣款）","Action":"使用系統返回（Android 返回手勢或按鈕）；從 History 重新開啟該劇；點 History；重新開啟該劇；點點數標籤；返回；點 New chat","Expected Result":"任何離開方式都沒有對話框；每次離開都顯示 「We'll keep making your storyboard. Find it in History.」；依序開啟起始頁、Recent Task、My Credits 和新的空白聊天；分鏡持續產生，返回時已在","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)。TC-513 涵蓋 Back。階段 ② 可能在每種離開方式都試完前結束：其餘在本輪的下一個分鏡上試"},"TC-514":{"Section":"分鏡","Precondition":"分鏡階段 ②：顯示 「Creating your storyboard…」 卡片","Action":"在 Recents 中將 PowerDirector 滑掉，等一分鐘，開啟 App 並從 History 開啟該劇","Expected Result":"分鏡已在背景完成：Storyboard Result 和 Storyboard Preview 都在；只扣款一次","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-063":{"Section":"分鏡","Precondition":"分鏡階段 ①：顯示 「Preparing your scenes…」 骨架卡片（Iris 正在寫提示詞，尚未扣款）；已讀取點數標籤","Action":"點 Back、「Leave anyway」，然後從 History 重新開啟該劇","Expected Result":"返回時階段 ① 自動重新開始：不需再次點 Generate，且分鏡只在到達 「Creating your storyboard…」 時扣款一次（Credit Details：一筆扣款，被中斷的 ① 不扣款）","Notes":"Build 檢查 TR261021-0082 RD Note (2610212)；PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-534":{"Section":"分鏡","Precondition":"分鏡階段 ①：顯示 「Preparing your scenes…」 骨架卡片（Iris 正在寫提示詞，尚未扣款）；已讀取 Credit Details","Action":"在 Recents 中將 PowerDirector 滑掉，重新開啟 App 並從 History 開啟該劇","Expected Result":"階段 ① 自動重新開始（「Preparing your scenes…」），不需再次點 Generate，且分鏡完成；Credit Details 只在到達 「Creating your storyboard…」 時記錄這個分鏡一次","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認重新開始 (PM Open questions #20)。TC-063 和 TC-399 涵蓋 Leave anyway"},"TC-064":{"Section":"分鏡","Precondition":"分鏡已完成","Action":"閱讀聊天","Expected Result":"「Here's your storyboard」、Storyboard Result 卡片 (場景卡片含 9:16 縮圖、「View more >」) 與 Storyboard Preview 卡片；Storyboard Preview 卡片隨分鏡一起出現，本身沒有產生中狀態","Notes":"回歸 DRI261893-0145 (BugNe eate storyboard」 卡片，附價格（每張圖 6 點數）和 Generate","Notes":"PM 10/20：腳本與圖片變更的卡片一律寫 Create storyboard；DRI261895P0025 要求舊標籤 \"Update storyboard images\"；iOS 單 DRI261895P0025 (NewCreated, AIAgent)，為 Android 的線索：分鏡修改提案被誤標為 Create storyboard — 此處也重新檢查該單"},"TC-385":{"Section":"分鏡","Precondition":"已顯示 TC-072 的「Create storyboard」卡片","Action":"點選 Generate 並觀察分鏡","Expected Result":"只有被修改的場景與 Storyboard Preview 顯示骨架畫面；其他場景維持原樣"},"TC-073":{"Section":"分鏡","Precondition":"要求 Iris 更新場景圖片後，已顯示「Create storyboard」卡片","Action":"點 Generate","Expected Result":"卡片消失；底部出現新的分鏡卡片，被修改的場景與預覽先顯示骨架畫面，然後顯示新圖片；上方先前的分鏡卡片保持原樣","Notes":"iOS 單 DRI261896P0013 (NewCreated, AIFound)，為 Android 的線索：重新產生的分鏡寫在修改請求上方，而非其後 — 此處也重新檢查該單；iOS 單 DRI261896P0014 (NewCreated, AIFound)，為 Android 的線索：分鏡重新產生期間 Preview 顯示 \"videos are being generated\" — 此處也重新檢查該單；Android 單 DRA262610P0134 (Assigned, AIAgent)：聊天中的圖片更新顯示 「Script updated」 / 「Create storyboard」、通用的 「Working on it」 列，並就地更新卡片而不是新增分鏡卡片；該單還要求 「Update storyboard images」 並同步先前的卡片。Design 規格不同：PM 10/20 將該卡片命名為 「Create storyboard」 (TC-072)，且 §13.2 ③ 讓先前的卡片保持原樣；以規格為準"},"TC-536":{"Section":"分鏡","Precondition":"剛在場景圖片更新的 「Create storyboard」 卡片上點了 Generate (TC-073)","Action":"在更新準備與建立期間查看輸入列","Expected Result":"輸入列只顯示麥克風；更新完成前，聊天中沒有出現 ■ 停止或其他暫停 / 停止控制","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 版本有 ■ 停止按鈕，將移除"},"TC-458":{"Section":"分鏡","Precondition":"分鏡已完成（Scene 3 顯示 Lauren 在她的工作站）","Action":"送出 「Please regenerate the image for Scene 3. Change it so Lauren is standing beside the window, looking out at the city.」，在 「Create storyboard」 點 Generate，然後開啟 Scene 3","Expected Result":"Scene 3 的新圖片呈現要求的變更：Lauren 站在窗邊，望向城市","Notes":"DRA262610P0199 (Assigned, AIFound)"},"TC-074":{"Section":"分鏡","Precondition":"分鏡圖片更新之後","Action":"播放 Storyboard Preview；然後取得 log","Expected Result":"預覽反映更新後的圖片 (TTS/animatic 已重新產生)；log 顯示圖片更新後有新的 TextToSpeech 呼叫"},"TC-075":{"Section":"分鏡預覽","Precondition":"分鏡已完成","Action":"查看 Storyboard Preview 卡片，然後播放；點 ⏸，再點 ▶，然後將進度條拖到大約中間；接著用系統返回離開播放器","Expected Result":"卡片顯示標題、長度和 「See your story as pictures with a voice telling it. The real video comes next.」；播放時顯示有旁白的投影片；播放器顯示 X、⏸、進度條和時間（例如 「00:40/01:30」）；⏸ 暫停，▶ 繼續投影片；拖曳進度條會跳到該處且時間隨之更新；系統返回如 X 般關閉播放器"},"TC-076":{"Section":"分鏡預覽","Precondition":"以 「No captions」 建立的 drama","Action":"播放 Storyboard Preview","Expected Result":"預覽仍有字幕","Notes":"Android 單 DRA262610P0245 (ProposeNAB, AIFound)：要求 Storyboard Preview 不要字幕並附 「No captions」；Design 規格不同：Storyboard Preview 一律有字幕 (R-065, PM 10/8)；以規格為準"},"TC-443":{"Section":"分鏡預覽","Precondition":"Video language 為 Chinese 且字幕開啟的劇（以及一部 Korean 的）；分鏡已完成","Action":"播放 Storyboard Preview 並觀察字幕在哪裡斷行","Expected Result":"字幕在詞或標點邊界斷行，絕不在詞中間斷開（例如 洗禮、影子 保持完整）；沒有字幕以逗號開頭","Notes":"DRA262610P0169 (NeedCodeReview, AIFound, UI)；規格沒有字幕斷行規則"},"TC-077":{"Section":"分鏡預覽","Precondition":"分鏡缺少場景圖片","Action":"查看 Storyboard Preview 卡片","Expected Result":"「Storyboard preview unavailable. Complete the image generation above first to view the preview.」且沒有產生按鈕","Notes":"需要失敗的場景"},"TC-413":{"Section":"分鏡預覽","Precondition":"分鏡有失敗的場景圖片；預覽卡片顯示 「Storyboard preview unavailable. Complete the image generation above first to view the preview.」","Action":"開啟失敗的場景 › Edit › Done › 「Regenerate Image」，等待圖片，返回聊天","Expected Result":"所有場景圖片完成後，Storyboard Preview 產生完成且可播放","Notes":"DRA262610P0027 (Propose Wont Fix, AIFound, UX)"},"TC-078":{"Section":"分鏡預覽","Precondition":"Storyboard 預覽產生失敗","Action":"查看卡片","Expected Result":"「Couldn't create the storyboard preview. Your credits have been refunded. Try again.」，附 Retry","Notes":"需要故障注入；REQ-022 線索 #45（Android 報告 16.8.0）"},"TC-079":{"Section":"影片","Precondition":"分鏡已完成；顯示 Storyboard Preview 卡片","Action":"點 Storyboard Preview 卡片上的 「Create video」（記錄卡片是否有它，Q-A16），然後閱讀影片設定卡片","Expected Result":"「Create video」 新增泡泡 「Create video」，接著出現影片設定卡片（若卡片沒有 「Create video」，設定卡片會自行接在分鏡後：記錄下來）；「Choose your video settings」 含 「Model • Seedance」 和 Best / Standard / Fast 控制（Best 沒有 NEW 標籤）；選 Best 時副標為 「Seedance 2.5 • Sharper motion and richer detail」；Video  video…」（點數標籤此時才扣價格），直到 「Here's your drama.」 與影片卡片取而代之","Notes":"涵蓋第 2 輪（各工作自己的開始/載入狀態）。搭配本輪本來就會產生的影片；Android 單 DRA262610P0226 (NewCreated, AIFound, UX)：處理中的影片在空白灰色卡片上方顯示 「Here's your drama.」，沒有進度或 ETA（進度/ETA 不在規格內）；PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-515":{"Section":"影片","Precondition":"影片階段 ①：顯示 「Advancing the mini drama production.」 骨架卡片（尚未扣款）","Action":"點 Back，再點 「Stay」；再點 Back，然後點 「Leave anyway」，接著從 History 重新開啟該劇","Expected Result":"每次 Back 都顯示 「Leave while we're preparing?」/「Your video will start soon. If you leave now, we'll have to prepare it again when you come back.」，附 「Leave anyway」（紅色）和 「Stay」；Stay 繼續準備；Leave anyway 後，重新開啟會自動重新開始階段 ①，不需再次點 Generate，也沒有額外扣款","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-516":{"Section":"影片","Precondition":"影片階段 ①：顯示 「Advancing the mini drama production.」 骨架卡片（尚未扣款）","Action":"使用系統返回（Android 返回手勢或按鈕），再在對話框上使用系統返回；點 History，再點 「Stay」；點 New chat，再點 「Stay」；點點數標籤，然後點 「Leave anyway」","Expected Result":"每種離開方式都顯示影片版內文的 「Leave while we're preparing?」；在對話框上按系統返回如 Stay 般關閉，Stay 繼續準備；在點數標籤上點 Leave anyway 會開啟 My Credits","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-538":{"Section":"影片","Precondition":"影片階段 ①：顯示 「Advancing the mini drama production.」 骨架卡片（尚未扣款）；已讀取 Credit Details","Action":"按 Home 將 PowerDirector 送到背景，等 30 秒，然後從 Recents 回到 App","Expected Result":"回到聊天後階段 ① 自動重新開始（或仍在執行）並到達 「Making your video…」，不需再次點 Generate Video；Credit Details 只記錄這支影片一次","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認重新開始 (PM Open questions #20)"},"TC-082":{"Section":"影片","Action":"點 Back","Expected Result":"Toast 「We'll keep making your video. Find it in History.」；沒有停止對話框；影片持續產生","Precondition":"影片階段 ②：顯示 「Making your video…」 卡片（已扣款）","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-400":{"Section":"影片","Precondition":"影片階段 ②：顯示 「Making your video…」 卡片（已扣款）","Action":"系統返回（Android 返回手勢或按鈕）","Expected Result":"Toast 「We'll keep making your video. Find it in History.」；沒有停止對話框；開啟起始頁，影片持續產生，其 History 卡片顯示 「processing..」","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-361":{"Section":"影片","Action":"點選 History；重新開啟該 drama；點選點數膠囊；返回；點選 New chat","Precondition":"影片階段 ②：顯示 「Making your video…」 卡片（已扣款）","Expected Result":"每次都沒有對話框；離開時顯示 「We'll keep making your video. Find it in History.」；依序開啟 Recent Task、My Credits 和新的空白聊天；影片持續產生","Notes":"以 PM 為準；Design 1016 顯示 「Leave this chat?」 但較舊 (REQ-029)。TC-082 涵蓋 Back；PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；RD 待確認 (PM Open questions #20)"},"TC-539":{"Section":"影片","Precondition":"影片階段 ②：顯示 「Making your video…」 卡片（已扣款）；已讀取 Credit Details","Action":"在 Recents 中將 PowerDirector 滑掉，等 5 分鐘，重新開啟 App 並從 History 開啟該劇","Expected Result":"影片持續進行：其 History 卡片顯示 「processing..」 或已完成的影片，完成後聊天顯示 「Here's your drama.」 與影片卡片；Credit Details 只記錄一次","Notes":"PM 10/22 §13.24 (Figma 4422:2)，比 PM 10/21 新；TC-514 涵蓋分鏡"},"TC-474":{"Section":"影片","Precondition":"劇 A 停在 「Choose your video settings」；History 中有一部已完成的劇 B","Action":"在 A 點 Generate Video，立刻從 History 開啟 B 並點 Create Next Episode；回到 A；然後重新啟動 App 並再次開啟 A","Expected Result":"A 的影片開始產生（顯示進度、已扣點數），或影片設定卡片仍可使用；A 絕不會只剩請求泡泡而沒有進度、扣款或設定卡片","Notes":"DRA262610P0221 (TRCreated, AIFound)"},"TC-475":{"Section":"影片","Precondition":"切換聊天後影片設定卡片消失的劇（DRA262610P0221 的步驟）","Action":"送出 「Please generate the video now.」；閱讀重新提供的卡片，點 Generate Video 並在 Credit Details 檢查扣款","Expected Result":"重新提供的卡片有模型列（Best / Standard / Fast），其價格等於實際扣除的點數","Notes":"DRA262610P0222 (Assigned, AIFound)"},"TC-482":{"Section":"影片","Precondition":"劇 A 有分鏡；History 中有一部已完成的劇 B","Action":"在 A 點 Generate Video；產生期間從 History 開啟 B › 其影片 › Full Edit，點 Home；等到 A 完成後開啟它（取得 logs）","Expected Result":"A 的影片在背景持續產生並完成；其片段不會因 host_detached 或 「the user denied permission」 而失敗","Notes":"DRA262610P0231 (Assigned, AIFound)"},"TC-083":{"Section":"影片","Action":"離開後查看 History 按鈕下方","Expected Result":"藍色氣泡 「Find your video here in History.」；點任意處即關閉","Precondition":"全新安裝（本案例的一部分）：解除安裝 PowerDirector，用 adb 從其 TR 安裝受測 build（device-android.ts build 會讀回），登入測試帳號，從 Launcher content-desc ([AID]Stage_Server) 確認伺服器並開始 logcat 擷取（logcat start）；方案為帳號本身的（Android 16.8 沒有方案切換、developer-server 開關、Write Log 或 Log stage timings）；然後：第一次在影片產生期間離開，於階段 ②（「Making your video…」）","Notes":"自行全新安裝。僅限第一次"},"TC-084":{"Section":"影片","Precondition":"影片產生中","Action":"開啟 History","Expected Result":"卡片顯示 「processing..」，沒有進度條","Notes":"DRA262610P0116 (Assigned, AIAgent)；Design 規格不同：History 只在影片產生中顯示 「processing..」 (R-073)，且在分鏡期間開啟 History 會詢問 「Stop and lose your credits?」 (R-262, TC-359) — 以規格為準 — 該單預期 「History identifies the active task as processing」；本列依規格 (REQ-043)"},"TC-486":{"Section":"影片","Precondition":"影片產生已結束（完成、失敗，或重新產生並匯出）","Action":"開啟 History 並讀取該 drama 的卡片","Expected Result":"產生結束後，卡片不再顯示 「processing..」","Notes":"DRA262610P0235 (NeedCodeReview, AIFound, UI)"},"TC-085":{"Section":"影片","Precondition":"影片產生中，使用者在 App 的其他頁面","Action":"在其他頁面等待影片完成","Expected Result":"Toast 「Good news! Your \"{Drama title}\" is ready. Tap here to view your results.」，附 Close / View","Notes":"Android 單 DRA262610P0026 (NewCreated, AIFound)：使用者在其他功能 (Text To Video) 時影片停止，返回後進度卡消失，之後所有片段都失敗；REQ-022 lead #29 (Android report 16.8.0)"},"TC-484":{"Section":"影片","Precondition":"Drama A 正在產生影片；drama B 先前已完成","Action":"從 History › 其影片 › Full Edit 開啟 B，點 Home；等到 A 完成","Expected Result":"「Good news! Your \"{Drama title}\" is ready.」 toast 只在 drama 完成時出現且指名 A；開啟 B 不會為 B 顯示","Notes":"DRA262610P0233 (NeedMoreInfo, AIFound, UI)"},"TC-086":{"Section":"影片","Precondition":"預覽影片已完成","Action":"閱讀聊天","Expected Result":"「Here's your drama.」 附影片卡，接著 「Looking good! Ready for the full video?」 附 「Create the full episode (90 sec)」 與價格","Notes":"iOS 單 DRI261894P0016 (NewCreated, AIFound)，Android 上的線索：付費預覽被顯示為完成的 drama，之後才賣完整集 — 請一併在此重測此單；iOS 單 DRI261894P0035 (RDResolved, AIFound)，Android 上的線索：Video Generate 沒有產生影片，聊天直接跳到完整集的提供 — 請一併在此重測此單；iOS 單 DRI261894P0051 (NewCreated, AIFound)，Android 上的線索：Settings 卡提供 75/90 s 完整影片，但之後的提供寫 60 sec — 請一併在此重測此單；iOS 單 DRI261896P0020 (NeedMoreInfo, AIFound)，Android 上的線索：最終 drama 影片產生一律失敗並顯示 \"1 clip couldn't be generated\" — 請一併在此重測此單；Android 單 DRA262610-0043 (NewCreated, AIFound, UX)：30 秒預覽後的 「Create the full episode (30 sec)」 產生了 60 秒影片；按鈕應標示完整集的長度；Android 單 DRA262610P0159 (Assigned, AI Agent)：30 sec 預覽後，提供寫成 「Create the full episode (60sec)」 而非 (90 sec)；長度為 15 s × 場景數 (R-251, TC-345)，因此請與場景數比對"},"TC-493":{"Section":"影片","Precondition":"有角色的大綱；每個角色都已從 Character Library 挑選造型（例如年輕男子、年長男子）","Action":"建立分鏡，再 Generate Video (Fast, Preview)；將影片中的人物與所挑選的造型及分鏡比對","Expected Result":"影片呈現的角色與使用者所挑選、分鏡所顯示的相同，而不是依大綱文字生成的人物","Notes":"DRA262610P0246 (NeedCodeReview, AIFound)；PM 入口文案 「same characters, same voices, every scene」"},"TC-087":{"Section":"影片","Precondition":"完整影片已完成","Action":"閱讀聊天","Expected Result":"「Ready for the next episode?」，附 「Create Next Episode」","Notes":"需要先產生完整影片"},"TC-479":{"Section":"影片","Precondition":"同一個 drama 已產生預覽影片與完整集","Action":"比較聊天中的兩張結果卡","Expected Result":"每張結果卡都顯示其類型與長度（例如 Preview · 0:30、Full episode · 1:30）","Notes":"DRA262610P0227 (NewCreated, AIFound, UX)；規格中沒有卡片標籤（待 PM 裁示）"},"TC-088":{"Section":"影片","Precondition":"影片已完成","Action":"開啟結果並點 Full Edit，再用系統返回退出，然後點 Export Full Video","Expected Result":"Full Edit 每個場景顯示一個片段；系統返回離開 Full Edit 的方式與其 ← 相同（記錄開啟的是結果頁還是聊天；聊天開在底部，R-173）；Export Full Video 產生一支合併後的影片","Notes":"iOS 單 DRI261896P0015 (NewCreated, AIFound)，Android 上的線索：Full Edit 擋下 Free 匯出，因為 drama 自己的字幕被算作付費功能 — 請一併在此重測此單"},"TC-417":{"Section":"影片","Precondition":"已完成的 drama 影片","Action":"點影片 › Full Edit，加入文字、貼圖與濾鏡，返回；再次點 Full Edit，然後檢查 Home › Projects","Expected Result":"Full Edit 重新開啟該 drama 既有的專案並保留先前的編輯；重新進入時不會多出專案","Notes":"DRA262610P0069 (ProposeNAB, AIFound)"},"TC-423":{"Section":"影片","Precondition":"方案 Free；完整集以 「Yes, include captions」 製作","Action":"開啟影片 › Full Edit，不做任何更動，點 Export","Expected Result":"Mini Drama 建立的字幕可從 Full Edit 匯出，無需 Pro 訂閱","Notes":"DRA262610P0084 (NewCreated, AIFound, UX)；所見：進入時顯示 「Pro Only」，且 Export 將 「Auto Captions」 列為 Pro 功能"},"TC-426":{"Section":"影片","Precondition":"Drama 影片在 Full Edit 中開啟","Action":"選取字幕，點 Aspect Ratio › 1:1，然後 Undo","Expected Result":"Undo 將字幕還原為更改長寬比之前的大小","Notes":"DRA262610P0105 (NeedMoreInfo, AIFound, UI)"},"TC-382":{"Section":"影片","Precondition":"影片已完成，結果頁已開啟","Action":"點第三個場景的縮圖","Expected Result":"播放器跳到該場景"},"TC-457":{"Section":"影片","Precondition":"已完成影片的 drama 從 History 開啟；場景影片播放器已開啟","Action":"點片段列的第 4 個片段；按 Home 並重新開啟 app（也試鎖定再解鎖）","Expected Result":"醒目標示停留在第 4 個片段，即使用者所選、預覽所顯示的片段","Notes":"DRA262610P0194 (Assigned, AIFound, UI)：醒目標示退回一個片段"},"TC-506":{"Section":"影片","Precondition":"已完成的 90 秒 drama","Action":"開啟結果頁，比較播放器與片段列；用系統返回退出後再開啟一次","Expected Result":"系統返回將結果頁關閉並回到聊天，與其 ‹ 相同；每次播放器與片段列中所選的片段都是同一個片段","Notes":"DRA262610P0286 (NewCreated, AIFound, UI)"},"TC-510":{"Section":"影片","Precondition":"已完成且有 6 個片段的 drama，停在 「Here's your drama.」","Action":"點播放並讓 drama 播到結尾，在第 5、6 個片段時觀察片段列","Expected Result":"片段列隨播放捲動，正在播放的片段始終可見並醒目標示","Notes":"Android 單 DRA262610P0297 (NewCreated, UI)"},"TC-089":{"Section":"影片","Precondition":"影片已完成","Action":"點影片上的下載按鈕","Expected Result":"沒有對話框；按鈕顯示轉圈，然後 toast 「Saved to your device.」","Notes":"iOS 單 DRI261895P0027 (NewCreated, AIAgent)，Android 上的線索：影片儲存成功時顯示過時的 Saved to Photos 文案 — 請一併在此重測此單；REQ-022 lead #16, #18, #32 (Android report 16.8.0)"},"TC-422":{"Section":"影片","Precondition":"影片已產生；尚未點下載","Action":"開啟手機的 Files › Recents（或 PowerDirector › New Project › Add Media）尋找該 drama 的片段；然後點下載再找一次","Expected Result":"影片只有在使用者點下載時才會進入相簿，並以 drama 名稱命名","Notes":"DRA262610P0083 (NewCreated, AIFound, UX)；所見：每個 15 s 片段都存到 Movies/…/Mini Drama，名為 「reftovideo_…_vid_1_15s - \u003cid>.mp4」"},"TC-090":{"Section":"影片","Precondition":"影片以開啟字幕製作並已下載","Expected Result":"可看到字幕","Action":"在 Gallery 播放下載的影片","Notes":"Android 單 DRA262610P0276 (NewCreated, AIFound, UX)：結果卡下載會存下兩個原始 15 秒片段，名稱為內部名稱且沒有字幕（已向 PM 詢問單一含字幕的 drama 檔）；REQ-022 lead #16, #18, #32 (Android report 16.8.0)"},"TC-091":{"Section":"影片錯誤","Precondition":"影片有失敗的場景","Action":"閱讀聊天與影片卡片","Expected Result":"「{n} scenes couldn't be generated. Your credits have been refunded. Tap Edit to regenerate, or tell me what to change.」 與 「Fix these issues to export your drama.」，附 「Fix scenes」；「Here's your drama.」 影片卡片沒有下載圖示","Notes":"需要場景影片失敗；回歸 DRI261893-0064 (Assigned, 未標記)：部分片段產生失敗時，成功的片段也不會顯示在結果頁 — 請一併在此重測此單；DRA262610P0031 (ProposeNAB, AIFound, UX)；所見：卡片是空的；Design 規格不同：Design 橫幅為 「ⓘ {n} scenes couldn't be generated.」/「Fix these issues to export your drama.」 附 「Fix scenes」（只有數量，沒有每個片段的原因）— 以規格為準 — 該單預期 「The card lists each failed clip with its reason, so the user knows what Fix Clips will fix」；本列依規格 (REQ-043)；REQ-022 lead #3, S2 (Android report 16.8.0)；REQ-022 lead #36, #44, S5 (Android report 16.8.0)"},"TC-483":{"Section":"影片錯誤","Precondition":"有失敗片段且聊天顯示 「Your credits have been refunded.」 的影片（例如 DRA262610P0231 步驟後的 host_detached）；Generate 前先記下餘額","Action":"開啟 Mine › Credits 與 Details","Expected Result":"失敗片段的點數已退還：餘額恢復，且 Details 顯示對應的退款列","Notes":"DRA262610P0232 (Assigned, AIFound)"},"TC-499":{"Section":"影片錯誤","Precondition":"影片恰有一個失敗片段（fault switch (iOS Pink；Android 16.8 沒有) › Inject failure status 設在一個場景）","Action":"閱讀聊天訊息與影片卡","Expected Result":"使用單數：「1 scene couldn't be generated. Your credits have been refunded. Tap Edit to regenerate, or tell me what to change.」，而不是 「1 scenes」","Notes":"DRA262610P0256 (NeedCodeReview, AIFound)；「1 characters aren't set yet」 那一半是 TC-040"},"TC-376":{"Section":"影片錯誤","Precondition":"影片有失敗的場景","Action":"點聊天失敗訊息中的 「Edit」","Expected Result":"失敗訊息為紅字並附 「Edit」；Edit 會在第一個失敗的場景開啟 Full Edit","Notes":"需要場景影片失敗（fault switch (iOS Pink；Android 16.8 沒有) › Inject failure status；記錄該開關）；Android 單 DRA262610P0150 (NewCreated, AIFound, UI)：失敗場景訊息寫 「Tap Edit to regenerate」，但只顯示 「Fix scenes」；該單要求讓名稱一致。Design 規格不同：規格保留 「Tap Edit to regenerate」，並在紅色訊息中除 「Fix scenes」 外加上 「Edit」 按鈕 (R-278)；以規格為準"},"TC-092":{"Section":"影片錯誤","Precondition":"場景影片失敗","Action":"點 Retry；若再次失敗則點 Edit","Expected Result":"「Couldn't create scene」/「Something went wrong. Give it another try.」 附 Retry；之後 「Retrying didn't work. Try a different description.」 附 Edit → 編輯器 → Regenerate scene，價格為場景長度 × drama 模型費率（每秒 13 Seedance 2.0、4 Seedance 2.0 Mini、6 Seedance 2.5；15 s 場景 → ◆195 / ◆60 / ◆90）","Notes":"需要場景影片失敗；Android 單 DRA262610P0030 (TRCreated, AIFound, UX)：失敗片段寫 「Try editing the description for a different result」，但原因其實是圖片錯誤，且沒有 Retry；REQ-022 lead #36, #44, S5 (Android report 16.8.0)"},"TC-362":{"Section":"影片錯誤","Precondition":"一個場景影片以 4xxx 失敗（fault switch (iOS Pink；Android 16.8 沒有) › Inject failure status = moderation_blocked，該 beat；記錄該開關）","Action":"查看失敗的片段，然後點 ⓘ；用系統返回關閉對話框","Expected Result":"片段卡顯示 「Couldn't create video ⓘ」 與退款文字；ⓘ 開啟 「Couldn't generate this video」/「Your credits have been refunded. The description may not meet our terms of service, such as violence, NSFW content, or content involving minors. Edit the description to try again.」 附 Got it；在 Full Edit 中，錯誤文字保持在預覽畫面內並依其寬度換行；系統返回關閉對話框，與 「Got it」 相同","Notes":"PM 錯誤看板，10/13 更新。卡片文字：§13.7 文案表為 「Couldn't create video. The description may not meet our terms of service. Your credits have been refunded. Edit the description and try again.」；記錄實際顯示哪一個"},"TC-363":{"Section":"影片錯誤","Action":"查看失敗的片段並點 ⓘ 應在的位置","Expected Result":"片段卡片顯示 「Couldn't create video」 與退款文字及 「Edit」，沒有 ⓘ；不會開啟對話框","Precondition":"一個場景影片以 5xxx 失敗（fault switch (iOS Pink；Android 16.8 沒有) › Inject failure status = tool_error，該 beat；記錄該開關）","Notes":"PM 錯誤看板，10/13 更新（5xxx 卡片不顯示 ⓘ）。§13.7 卡片文字：「Couldn't create video. Our service is busy right now. Your credits have been refunded. Try again later.」"},"TC-093":{"Section":"影片錯誤","Precondition":"影片有失敗的場景片段；聊天在影片卡下方顯示場景失敗訊息","Action":"點聊天中的影片卡，然後在結果頁查看失敗的片段","Expected Result":"結果頁開啟（Full Edit、Export Full Video、每個場景一張縮圖）並停在失敗的場景，顯示其錯誤卡（第一次失敗為 「Retry」，審核失敗或重試失敗後為 「Edit」）；失敗片段預設 15 s 且沒有下載圖示","Notes":"需要場景影片失敗；REQ-022 lead #36, #44, S5 (Android report 16.8.0)"},"TC-094":{"Section":"影片錯誤","Precondition":"整支影片失敗","Action":"閱讀聊天","Expected Result":"「Something went wrong on my end.」 與 「Video couldn't be created. Try creating your video again.」，附 Try again","Notes":"需要注入故障；Android 單 DRA262610P0082 (Assigned, AIFound)：Generate video 失敗時顯示原始紅色泡泡 「Error: HTTP request to cc team gateway failed: Could not establish connection」，而非規格的錯誤文案；與 iOS 單 DRI261894P0025 症狀相同（原 TC-182）"},"TC-485":{"Section":"影片錯誤","Precondition":"顯示影片設定卡；送出請求時無法連上伺服器（log：「HTTP POST Add Media failed: Could not establish connection」）","Action":"點 Generate Video 並在聊天停留 9 分鐘","Expected Result":"聊天顯示附 Try again 的錯誤；絕不會停在沒有進度卡、影片或錯誤的狀態","Notes":"DRA262610P0234 (Assigned, AIFound)；觸發條件無法控制（log 顯示連線失敗）"},"TC-095":{"Section":"影片錯誤","Precondition":"影片上傳失敗 (6xxx)","Action":"閱讀影片卡片","Expected Result":"「Your video didn't finish saving. Tap Retry - you won't be charged again.」，附 Retry","Notes":"需要故障注入"},"TC-379":{"Section":"影片錯誤","Precondition":"影片上傳以 6xxx 失敗超過 3 小時（TC-095 之後離開該 drama，於本次執行稍後再回來）","Action":"重新開啟該 drama，閱讀影片卡片，再開啟 Mine › Credits › Details","Expected Result":"「We couldn't finish this video. Your credits have been refunded. Edit the description and try again.」，附 「Edit」；Credit Details 顯示退款列","Notes":"需要故障注入 (6xxx)；3 小時的等待與本次其餘執行並行"},"TC-096":{"Section":"影片錯誤","Precondition":"影片重新產生中","Action":"播放舊版本，點其下載圖示；然後開啟結果頁，在場景仍顯示 「generating...」 時點 「Export Full Video」","Expected Result":"舊版本可播放；點下載顯示 toast 「Your video is still updating. Try again when it's done.」；「Export Full Video」 不會開始匯出（不開匯出面板，也不會存到 Gallery），並以附圖示的 toast 說明原因（記錄其文案，Q-A10）；完成時顯示 「Your video has been updated.」","Notes":"iOS 單 DRI261895P0028 (Assigned, AIAgent)，Android 上的線索：替換產生期間 Play 與 Download 仍可使用 — 請一併在此重測此單；Android 單 DRA262610P0192 (Assigned, AIFound)：Fix scenes 的片段重新產生中（「Updating 1 scene...」）時，Export Full Video › Produce 會存出少了該場景的 1:15 影片，且沒有警告。PM 畫面未給 toast 文案 (Q-A10)"},"TC-097":{"Section":"字幕","Precondition":"以 「No captions」 建立的 drama","Action":"播放完成的影片","Expected Result":"不顯示字幕","Notes":"REQ-022 lead #17, #19, #21, #48 (Android report 16.8.0)"},"TC-364":{"Section":"字幕","Action":"產生完整影片；完成後取出 log 並閱讀此影片的 tool call","Expected Result":"影片沒有字幕，且 log 顯示此影片沒有 speech-to-text (STT) 呼叫","Notes":"PM §13.13 (10/6)：「user 選 No captions 時不跑STT」。TC-097 檢查影片；本列檢查 STT 沒有執行。若有字幕的影片也沒有任何 log 行標示 STT，記錄 Blocked (observability) 並詢問 RD 哪一行可用。Spec agent 1012-PM-CAPTIONS-NO-STT (REQ-031)","Precondition":"Drama 以 「No captions」 建立；logcat 擷取執行中 (device-android.ts logcat start)"},"TC-098":{"Section":"字幕","Precondition":"字幕產生失敗","Action":"閱讀影片卡片並點 Try again","Expected Result":"整支影片沒有字幕；「Captions couldn't be added. Try again」；Try again 顯示 「Adding captions…」","Notes":"需要故障注入"},"TC-365":{"Section":"字幕","Action":"點 Try again；字幕出現後，取出 log 並比較重試前後的 STT 呼叫","Expected Result":"重試只會重新送出失敗的段落做 STT；所有段落都成功後字幕才一次全部出現","Notes":"PM §13.13 (10/6)：「只重跑失敗的段落，全部成功才把字幕一次放上去」。沒有任何故障開關能讓 STT 失敗 (TC-298) → 在 RD 提供測試條件之前標為 Blocked (observability)。Spec agent 1012-PM-CAPTION-RETRY-SEGMENTS (REQ-031)","Precondition":"字幕只在部分段落失敗（「Captions couldn't be added. Try again」）；logcat 擷取執行中 (device-android.ts logcat start)"},"TC-099":{"Section":"字幕","Precondition":"以字幕建立的 drama","Action":"播放完成的影片","Expected Result":"對白顯示字幕"},"TC-433":{"Section":"字幕","Precondition":"任一範本產生的完成影片（Seedance 2.0 Mini，字幕開啟），從 History（Recent task）開啟","Action":"跨場景轉換播放影片（例如回報的 drama 中 00:31–00:37）","Expected Result":"每句字幕只在該句被念出時顯示，音訊或場景往下走時就消失","Notes":"DRA262610P0153 (Assigned, UI)"},"TC-467":{"Section":"字幕","Precondition":"來自 「The New Guy's Secret」（Make my version）的 drama，選 「Yes, include captions」，英文；完整影片已產生","Action":"Export Full Video 並播放匯出的影片；查看旁白字幕（例如 00:22 與 01:22）","Expected Result":"旁白字幕使用較小的預設字體，與影片畫面比例均衡","Notes":"DRA262610P0208 (NewCreated, AIFound, UX)；規格中沒有字幕字體大小（待 PM 裁示）"},"TC-492":{"Section":"字幕","Precondition":"7 種影片語言各有一個選 「Yes, include captions」 的 drama","Action":"播放 Storyboard Preview 與完成的影片；閱讀每一行與每一頁字幕","Expected Result":"字幕只在字詞之間或詞組邊界斷行（不拆音節、字詞或名稱），沒有任何行或頁以標點（。，）開頭，也沒有單一字詞獨佔一行","Notes":"DRA262610P0244 (NeedCodeReview, AIFound, UI)；DRA262610P0261 (NeedCodeReview, AIFound, UI：對照 AI Storytelling，其依詞組斷行) 與 DRA262610P0275 (Assigned, AIFound, UI：中文分頁拆開 實習/生 並以 「，」 開頭) 併入此列；Android 單 DRA262610P0261 (NeedCodeReview, AIFound, UI)：英文與日文字幕把字詞與名稱拆到不同行（日文第 2 行以 。 開頭），與 AI Storytelling 不同；Android 單 DRA262610P0275 (Assigned, AIFound, UI)：中文字幕分頁拆開字詞（實習/生、誤/會了），且有一頁以 「，」 開頭"},"TC-507":{"Section":"字幕","Precondition":"選 「Yes, include captions」 的中文 drama，且有超過 16 個字的字幕（Full Edit › Captions List）；一個有長字幕的西班牙文 drama","Action":"Export Full Video、Produce，並在該字幕處播放匯出的影片","Expected Result":"每句字幕的完整文字都顯示（例如 「…未免太見外了。」 的結尾），且每頁停留時間足以閱讀（不是約 0.6 s）","Notes":"DRA262610P0288 (Assigned, AIFound)"},"TC-100":{"Section":"聊天行為","Precondition":"長聊天，已往上捲動","Action":"等待新的助理訊息，再等待螢幕上方的卡片被重建（例如分鏡圖片更新）","Expected Result":"聊天不會跳動；出現 ↓ 按鈕（無未讀數）；點它會捲到底部並隱藏按鈕"},"TC-374":{"Section":"聊天行為","Precondition":"聊天長達數個畫面，位於底部","Action":"往上捲到較早的訊息，再點 ↓","Expected Result":"往上捲動時 ↓ 顯示於右下角；點它會捲到最新訊息並隱藏按鈕"},"TC-419":{"Section":"聊天行為","Precondition":"有大綱的聊天，長度達數個畫面","Action":"在標題列下方向上捲動聊天","Expected Result":"聊天內容在標題列下方捲動，絕不與 Back、點數、New Chat 及 History 按鈕重疊","Notes":"DRA262610P0072 (NewCreated, AIFound, UX)；指引 Figma node 2778-128606"},"TC-101":{"Section":"聊天行為","Precondition":"聊天捲動到較早的訊息","Action":"開啟 History，再回來","Expected Result":"聊天開在底部（最新訊息）","Notes":"PM 10/20 §13.2 取代了 \"keeps the position the user left\""},"TC-102":{"Section":"聊天行為","Precondition":"聊天捲動到較早的訊息","Expected Result":"聊天開在底部（最新訊息）","Action":"開啟 Choose Character，然後關閉","Notes":"PM 10/20 §13.2 取代了 \"keeps the position the user left\"；iOS 單 DRI261896P0029 (Assigned, AIAgent)，Android 上的線索：Full Edit 返回後遺失先前的聊天位置 — 請一併在此重測此單"},"TC-103":{"Section":"聊天行為","Precondition":"分鏡提供之後更換了角色","Action":"閱讀助理提示","Expected Result":"文案符合規格文案清單，例如 「Characters updated! Regenerate the storyboard to match?」","Notes":"Android 單 DRA262610P0299 (NewCreated, UX) 預期更換演員後保留 Create storyboard 卡且不出現新的助理回合；規格在角色變更後畫的是 「Characters updated! Regenerate the storyboard to match?」，因此本列依規格 (REQ-043)"},"TC-104":{"Section":"歷史記錄","Action":"開啟 History","Expected Result":"「No dramas yet」/「Start a story with AI. Every drama you create will be saved here.」","Precondition":"全新安裝（本案例的一部分）：解除安裝 PowerDirector，用 adb 從其 TR 安裝受測 build（device-android.ts build 會讀回），登入測試帳號，從 Launcher content-desc ([AID]Stage_Server) 確認伺服器並開始 logcat 擷取 (logcat start)；方案為該帳號本身的方案（Android 16.8 沒有方案切換、開發伺服器切換、Write Log 或 Log stage timings）；然後：沒有儲存任何 drama（或已全部刪除）","Notes":"自行全新安裝。重新安裝會清空 History（本機資料）；Build 檢查 TR261021-0082 RD Note (2610212)"},"TC-105":{"Section":"歷史記錄","Action":"開啟 History，點提示外面","Expected Result":"出現提示 「To keep the file lightweight, we kept only the generated story outline, images and videos.」，點外面即關閉","Precondition":"全新安裝（本案例的一部分）：解除安裝 PowerDirector，用 adb 從其 TR 安裝受測 build（device-android.ts build 會讀回），登入測試帳號，從 Launcher content-desc ([AID]Stage_Server) 確認伺服器並開始 logcat 擷取 (logcat start)；方案為該帳號本身的方案（Android 16.8 沒有方案切換、開發伺服器切換、Write Log 或 Log stage timings）；然後：此安裝第一次進入 History","Notes":"自行全新安裝。回歸 DRI261893-0013 (Assigned, AIFound)：點外部無法關閉 History 提示，且蓋住第一張卡的日期 — 請一併在此重測此單；iOS 單 DRI261896P0026 (RDResolved, AIAgent)，Android 上的線索：點外部無法關閉 History 提示 — 請一併在此重測此單"},"TC-106":{"Section":"歷史記錄","Precondition":"History 有 drama","Action":"閱讀一張卡片，然後點 「New Chat」","Expected Result":"縮圖（有分鏡時為第一格分鏡畫面）、日期與時間、Iris 產生的 drama 標題、大小、附 Rename 與 Delete 的 ⋮ 選單；右下角的 「New Chat」 開啟新的空白聊天","Notes":"DRA262610-0063 (ProposeNAB, AIFound, UX)；所見：標題為 「Workplace Romance」（其類別）；Design 規格不同：R-093 以 Iris 產生的標題作為卡片標題，而非範本名稱 — 以規格為準 — 該單預期 「A drama made from a template is titled with the template name, consistently」；本列依規格 (REQ-043)；REQ-022 lead #46, #47 (Android report 16.8.0)"},"TC-107":{"Section":"歷史記錄","Precondition":"History 有 2 個以上 drama","Action":"開啟較舊的 drama，捲動、播放與下載但不編輯，然後返回","Expected Result":"順序、時間與大小都沒有改變","Notes":"Regression DRI261893-0015 (Assigned, AIFound)：只是開啟任務就會移到 History 最上方並改變其大小 — 此處也一併複測此單"},"TC-108":{"Section":"歷史記錄","Precondition":"History 有 2 個以上 drama","Action":"重新命名較舊的 drama","Expected Result":"它移到最上方且時間 113":{"Section":"歷史記錄","Precondition":"History 有處於不同階段的 drama","Action":"逐一重新開啟","Expected Result":"每一個都在其最新階段重新開啟（大綱 / 角色 / 分鏡 / 影片）","Notes":"iOS 單 DRI261896P0032 (NeedCodeReview, AIAgent)，Android 上的線索：儲存的分鏡聊天重新開啟時不在底部 — 請一併在此重測此單"},"TC-114":{"Section":"點數與額度","Precondition":"帳號仍有免費分鏡次數","Action":"查看 「Create storyboard」 卡片；建立一次分鏡，再看下一張卡片","Expected Result":"分鏡價格（每張場景圖 ◆6 加上 Text to Speech 部分，同 TC-060；Design 畫的是 ◆15）以刪除線顯示並附 「Free • {n} left」，{n} = 剩餘次數；下一張卡少一次","Notes":"Design 1016_support free trial (Figma 4847:34277)，比 MX 看板的畫面 「Free for your first 3 creations - {n} left.」 更新；PM 沒有不同說法 (REQ-029)。需要有免費次數的帳號 → Blocked；REQ-022 lead #50 (Android report 16.8.0)"},"TC-356":{"Section":"點數與額度","Precondition":"免費分鏡次數已用完（共用測試帳號）","Action":"查看 「Create storyboard」 卡片","Notes":"Design 1016_support free trial (Figma 4847:34277)","Expected Result":"只顯示價格（每張場景圖 ◆6 加上 Text to Speech，同 TC-060）：沒有刪除線，也沒有 「Free」"},"TC-115":{"Section":"點數與額度","Precondition":"點數足夠","Action":"查看影片設定卡上 Generate 的下方","Expected Result":"顯示 「You'll have {n} left」 一行，為此動作後的餘額；點 Generate 直接扣款，沒有另外的確認","Notes":"Design 優先於 PM（使用者規則 2026-10-19）。Design MX 畫面在 Generate 下方顯示 「You'll have 160 left」；PM Q-3 曾要求加 Confirm 步驟。；Regression DRI261893-0130 (NewCreated, AIAgent) — Design 優先：Design 沒有 Consume credits? 卡片；MX 在 Generate 下方顯示 「You'll have N left」 (TC-115)。：角色與分鏡產生略過點數確認卡 — 此處也一併複測此單"},"TC-116":{"Section":"點數與額度","Precondition":"點數不足","Action":"點 Generate","Expected Result":"「Not enough credits」/「{X} credits needed. You have {Y} credits left.」，附 Buy Credits → 「Top up your credits」","Notes":"需要低餘額帳號；不要購買；iOS 單 DRI261896P0011 (RDResolved, AIFound)，Android 上的線索 — Design 優先：對照 Design MX 影片設定畫面：影片設定的 Buy Credits 按鈕樣式與餘額行與規格不同 — 請一併在此重測此單"},"TC-117":{"Section":"點數與額度","Precondition":"Free 帳號已達每日聊天上限（fault switch (iOS Pink；Android 16.8 沒有) › Show Free quota dialog）","Action":"送出訊息；點 「Upgrade to Premium」；在訂閱頁點 ‹，不訂閱","Expected Result":"「Daily Free Chat Limit Reached」/「You have used up your AI Mini Drama free chats. To keep chatting, please upgrade to Premium.」 附 Upgrade to Premium；「Upgrade to Premium」 開啟訂閱頁（記錄其方案與主按鈕：MX 畫面畫的是 iOS 頁面，有 Pro / Pro+ 分頁與 「Get 7-Day Free Trial」，而 Android 的付費方案是 PowerDirector Pro，Q-A2）；‹ 返回聊天，對話框已關閉且訊息未送出","Notes":"REQ-022 lead #8, #20, #28, #31, #40, #43, #49, #51, S6 (Android report 16.8.0)"},"TC-542":{"Section":"點數與額度","Precondition":"Free 帳號；訂閱頁從上限對話框的 「Upgrade to Premium」 開啟（如 TC-117），或在無法達到每日上限時，從 My Credits › 「Subscribe Now」 開啟 (TC-520)","Action":"1. 點頁面顯示的每個方案分頁（MX 畫面畫的是 「Pro」 與 「Pro+」）。2. 點 「Monthly」，再點 「Yearly」。3. 點 「Terms of Service」，用系統返回回來。4. 點主按鈕（MX：「Get 7-Day Free Trial」），並用系統返回關閉 Google Play 付款面板。5. 點 ‹","Expected Result":"每個方案分頁切換所顯示的方案且分頁隨之更動（記錄 Android 顯示的分頁與方案名稱，Q-A2）；被點的方案卡被選取，一次只選一個；「Terms of Service」 開啟條款頁，系統返回回到訂閱頁；主按鈕為所選方案開啟 Google Play 付款面板，系統返回將其關閉並回到訂閱頁，沒有購買任何東西；‹ 返回開啟它的頁面（未送出訊息的聊天，或 My Credits）","Notes":"絕不訂閱：一律不購買，直接關閉 Google Play 面板。「Privacy Policy」 與 「Restore purchase」 是頁尾的其他連結 (MX mx-a-left 1034:39877)。MX 畫面畫的是 iOS 頁面；Android 的付費方案是 PowerDirector Pro，沒有 30 次聊天的中階方案 (Q-A2)，因此 Pro 使用者的 「Continue」 頁 (iOS TC-216) 沒有 Android 列"},"TC-118":{"Section":"點數與額度","Precondition":"Pro 帳號已達每日聊天上限（fault switch (iOS Pink；Android 16.8 沒有) › Show Paid quota dialog）","Action":"送出訊息，然後點 「Continue Tomorrow」；再送一次並用系統返回關閉對話框","Expected Result":"「Today's AI Chats Are Used Up」/「They'll refresh tomorrow, and we'll be ready to chat again.」 附 Continue Tomorrow；「Continue Tomorrow」 關閉對話框並返回聊天，訊息未送出；系統返回關閉的方式與 「Continue Tomorrow」 相同","Notes":"MX 版本 A：Pro 改看到 Free 對話框 (TC-216, R-277)"},"TC-119":{"Section":"角色","Precondition":"篩選面板已開啟，且已更改 Gender、Ethnicity 與 Age","Notes":"Figma 流程箭頭 2811-105834","Action":"勾選 「My characters only」，然後點 「Clear」","Expected Result":"「My characters only」 顯示勾選；Clear 將所有篩選還原為預設：未選 Gender 或 Ethnicity，Age 1–100，My characters only 關閉"},"TC-120":{"Section":"角色","Precondition":"Choose Character 已為某個角色欄位開啟並套用篩選","Action":"點另一個角色欄位","Expected Result":"標題變成該欄位的 「Choose for {name}」，且篩選重設為預設","Notes":"Figma 流程箭頭 2811-105838；Android 單 DRA262610-0018 (NewCreated, AIFound, UX)：為某個角色設定的 Gender/Age 篩選在切換到另一個角色後仍然套用；該單要求每個欄位各自篩選，Design 則重設為預設（以 Design 為準）"},"TC-121":{"Section":"角色","Precondition":"Finish your characters 顯示新產生的造型","Action":"點面板上的 X","Expected Result":"面板關閉並回到 Choose Character，且產生的造型不會套用到欄位","Notes":"Figma 流程箭頭 2811-90144"},"TC-527":{"Section":"角色","Precondition":"完成角色並顯示新產生的造型（「Your characters are ready」），在 TC-121 之後的第二次 Generate all 上","Action":"使用系統返回（Android 返回手勢或按鈕）","Expected Result":"同 X (TC-121)：面板關閉並回到 Choose Character，產生的造型不會套用到欄位","Notes":"需要第二次 Generate all（每個造型 ◆6）"},"TC-122":{"Section":"建立我的角色","Precondition":"Create my character 已有一些描述文字","Action":"點描述上的展開圖示","Expected Result":"全螢幕描述編輯器開啟，文字相同","Notes":"Figma 流程箭頭 2811-90585"},"TC-370":{"Section":"建立我的角色","Precondition":"Create my character 已有一些描述文字","Action":"點描述文字（不是展開圖示）","Expected Result":"全螢幕描述編輯器開啟，文字相同"},"TC-123":{"Section":"建立我的角色","Precondition":"展開的描述編輯器已開啟且文字已編輯","Action":"點收合圖示","Expected Result":"編輯器關閉並回到 Create my character，且保留編輯後的文字","Notes":"Figma 流程箭頭 2811-90145"},"TC-124":{"Section":"建立我的角色","Precondition":"展開的描述編輯器已開啟且文字已編輯","Action":"點 「Done」","Expected Result":"編輯器關閉並回到 Create my character，且保留編輯後的文字","Notes":"Figma 流程箭頭 2811-90588"},"TC-528":{"Section":"建立我的角色","Precondition":"展開的描述編輯器已開啟且有編輯過的文字，鍵盤已彈出","Action":"使用系統返回（Android 返回手勢或按鈕）；然後再次使用系統返回","Expected Result":"第一次系統返回只關閉鍵盤，編輯器保持開啟；第二次將編輯器關閉並回到 Create my character，如同收合圖示 (TC-123)，且保留編輯過的文字"},"TC-125":{"Section":"建立我的角色","Precondition":"描述長度超過可見區域","Action":"在描述框內拖曳","Expected Result":"文字在自己的區域內捲動；頁面不會跟著移動","Notes":"Figma 流程箭頭 2811-90468"},"TC-126":{"Section":"建立我的角色","Precondition":"Create my character 已開啟，為空","Action":"點 「AI Suggestion」","Expected Result":"描述與 Gender、Ethnicity、Age 會依 「Tell us what {name} looks like」 中的角色填入，因此 Generate 變為可用","Notes":"Figma 流程箭頭 2811-90584；iOS 單 DRI261896P0031 (Assigned, AIAgent)，Android 上的線索：AI Suggestion 讓必要的角色屬性保持空白 — 併自 TC-211；Android 單 DRA262610P0135 (RDResolved, AIAgent)：AI Suggestion 只填入描述；Gender、Ethnicity 與 Age 仍未設定，Generate 維持停用；REQ-022 lead #5, #24, #25, #26, #42 (Android report 16.8.0)"},"TC-407":{"Section":"建立我的角色","Precondition":"顯示大綱；為一個卡司角色開啟 Create my character，描述為空","Action":"點 「AI Suggestion」，然後再點一次","Expected Result":"AI Suggestion 產生該角色的外觀描述，而不是大綱中該角色的角色定位句","Notes":"DRA262610-0015 (NewCreated, AIFound)；英文與日文大綱皆可見；第二次點擊回傳相同文字且沒有載入回饋"},"TC-127":{"Section":"建立我的角色","Precondition":"Create my character 已開啟","Action":"點 Age 欄位，輸入 24 並點 ✓；然後點已填入的 Age 欄位，改為 30 並點 ✓；再次點 Age 欄位，輸入 31 並用系統返回","Expected Result":"Age 開啟數字鍵盤 (1–100)，有輸入列（預設文字 「1-100」）與 ✓；✓ 關閉鍵盤且 Age 顯示 24；已填欄位重新開啟鍵盤並顯示 24，✓ 儲存 30；系統返回只關閉鍵盤，表單保持開啟；記錄 Age 顯示 30 還是 31 (Q-A6)","Notes":"Figma 流程箭頭 2811-90586；Android：若 app 顯示系統數字鍵盤而非 Design 的鍵盤列，以其 Done 鍵確認並記錄所顯示的內容"},"TC-128":{"Section":"建立我的角色","Precondition":"Create my character 已開啟","Notes":"Figma 流程箭頭 2811-90587","Action":"點 「Reference (optional)」；使用系統返回；再次點 「Reference (optional)」","Expected Result":"Select Media 開啟以挑選參考照片；系統返回將其關閉並回到 Create my character，沒有加入參考，如同 Select Media 的 ‹；第二次點擊會再次開啟"},"TC-525":{"Section":"建立我的角色","Precondition":"Select Media 從 Reference 開啟（TC-128 之後）","Action":"點 「Photo」；點 「Recents ▾」 並用系統返回（Android 返回手勢或按鈕）關閉相簿清單；點一個圖庫來源分頁（例如 getty images | iStock）並回到 「Recents」；點照片上的放大圖示並用系統返回關閉預覽；點 「Photo」 旁的滑桿圖示並用系統返回關閉；點相機圖示並用系統返回離開相機","Expected Result":"「Photo」 維持為選取的媒體類型；「Recents ▾」 開啟相簿清單；圖庫分頁顯示該來源的照片；放大圖示開啟該照片的完整大小預覽；滑桿圖示開啟挑選器的選項（記錄其內容）；相機圖示開啟相機；每次系統返回只關閉最上層（相簿清單、預覽、選項、相機）並回到 Select Media","Notes":"Design 畫的是 iOS 挑選器；在 Android 上按 PowerDirector 媒體挑選器的相同控制項，並記錄缺少的項目。TC-129 接著從同一畫面挑選該照片"},"TC-412":{"Section":"建立我的角色","Precondition":"PowerDirector 未授予媒體權限（先在 Android Settings › Apps 重設）","Action":"點 「Reference (optional)」 › Next › Don't allow › OK，然後系統返回（Android 返回手勢或按鈕）及左上角箭頭","Expected Result":"返回或關閉按鈕會關閉權限通知並回到 Create my character","Notes":"DRA262610-0059 (ProposeNAB, AIFound)；所見：按 OK 後通知又回來，唯一的出口是授予權限或強制停止"},"TC-129":{"Section":"建立我的角色","Precondition":"從 Reference 開啟了 Select Media","Action":"選一張照片","Expected Result":"Crop 開啟並顯示該照片與 「Drag and pinch to adjust how the clip fits within the frame」","Notes":"Figma 流程箭頭 2811-90589；Android 單 DRA262610P0218 (NewCreated, AIFound, UX)：要求寫 「…how the photo fits within the frame」 而非 「clip」；Design 規格不同：流程箭頭 2811-90589 與 ds-characters 畫的是 「Drag and pinch to adjust how the clip fits within the frame」 (R-114)；以規格為準"},"TC-130":{"Section":"建立我的角色","Precondition":"Crop 已開啟並有參考照片","Action":"拖曳照片，再捏合縮放","Expected Result":"兩種手勢下，照片可見的部分都在框內移動與縮放","Notes":"Figma 流程箭頭 2837-147745"},"TC-131":{"Section":"建立我的角色","Precondition":"調整照片後 Crop 仍開啟","Action":"點 ✓","Expected Result":"Create my character 顯示依調整後裁切的參考圖","Notes":"Figma 流程箭頭 2837-147912"},"TC-529":{"Section":"建立我的角色","Precondition":"Create my character 帶有 TC-131 的參考；再次點 Reference 並挑了另一張照片，因此 Crop 已開啟","Action":"使用系統返回（Android 返回手勢或按鈕）","Expected Result":"Crop 關閉的方式如同其 X：新照片不套用，Create my character 保留先前的參考（記錄顯示的是 Select Media 還是 Create my character）"},"TC-366":{"Section":"建立我的角色","Precondition":"Make your character 已開啟；一張邊緣附近有容易辨認物件的參考照片","Action":"加入照片，在 Crop 中把邊緣的物件裁掉並點 ✓，然後 Generate；之後取出 log 並開啟儲存的參考圖片 (ai-mini-drama-reference-photos)","Expected Result":"用於角色的參考圖片只顯示裁切後的區域：被裁掉的物件不在其中","Notes":"PM 主流程備註 「只送 crop 後的圖」（第一次閱讀時遺漏；2026-10-22 經 render 確認）。若取出的 log 沒有參考圖片，記錄 Blocked (observability) 並向 RD 索取上傳的圖片。Spec agent 1012-PM-CROP-UPLOAD (REQ-031)"},"TC-132":{"Section":"建立我的角色","Precondition":"有效的 Create my character 表單","Action":"點 Generate 並等待","Expected Result":"載入狀態被正面/側面/背面三視圖取代，並附 「Save to library」","Notes":"Figma 流程箭頭 2811-90147；iOS 單 DRI261895P0036 (RDResolved, AIFound)，Android 上的線索：Create my character 一律失敗並顯示 \"Couldn't create image\" — 請一併在此重測此單；DRA262610-0036 (NewCreated, AIFound, UX)；◆4 的費用顯示為 「Text to Image −3」 與 「Text to Speech −1」；Design 規格不同：TC-060 的規格說明 (R-050) 將 AI Mini Drama 的費用記為 Text to Image / Text to Speech 列 — 以規格為準；記錄標籤 — 該單預期 「Credit Details name AI Mini Drama (ideally the step) for each charge」；本列依規格 (REQ-043)"},"TC-408":{"Section":"建立我的角色","Precondition":"Create my character 已開啟","Action":"輸入描述 「male lead, a quick-witted debtor on the run mistaken for a groom」，設定 Gender Female、Ethnicity White、Age 20，點 Generate","Expected Result":"產生的角色符合所選角色設定（女性、White、約 20 歲）","Notes":"DRA262610-0024（NewCreated，無標籤）"},"TC-133":{"Section":"建立我的角色","Precondition":"顯示已產生的角色","Action":"點 「Save to library」","Expected Result":"角色立即套用到角色欄位並儲存到資料庫，其縮圖左下角顯示 「Mine」 標籤","Notes":"Figma 流程箭頭 2811-90591。PM 樣稿顯示 「My character」；以 Design 為準；Android 單 DRA262610P0177（NewCreated、AIFound、UX）：以 ✕ 關閉產生的角色後，它在資料庫中但未套用到欄位。Design 規格不同：X 會問 「Discard this character?」（R-248、TC-057），且 「Save to library」 才是套用動作；以規格為準"},"TC-472":{"Section":"建立我的角色","Precondition":"Create my character 結果已顯示（正面/側面/背面視圖）","Action":"點 Download 按鈕，然後檢查 Pictures/cyberlink/PowerDirector/Mini Drama 中儲存的檔案","Expected Result":"檔案只有一個與格式相符的副檔名（例如 「character - \u003ctimestamp>.png」 登錄為 image/png），而不是 「.png.jpg」 搭配 MIME image/jpeg","Notes":"DRA262610P0217（TRCreated，AIFound）"},"TC-134":{"Section":"建立我的角色","Precondition":"顯示已產生的角色","Action":"點 X，再點對話框中的 「Discard」","Expected Result":"結果關閉；角色不會套用到角色欄位，也不會儲存到 Mine","Notes":"PM 10/21 新增 Discard 對話框（§13.23）；Figma 流程箭頭 2811-90593；iOS 單 DRI261896P0037（NewCreated，AIFound），Android 上的線索：以 X 關閉而非儲存的角色仍被加入 Mine — 此處也要重新檢查該單"},"TC-135":{"Section":"建立我的角色","Precondition":"角色資料庫已顯示","Notes":"Figma 流程箭頭 2811-90592","Action":"點角色上的放大圖示；開啟 ⋯ 並以系統返回關閉選單；開啟 ⋯ 並點 「Download」；再開啟 ⋯，點 「Report」 並以系統返回離開檢舉流程而不送出；然後點 ⓧ；再次開啟預覽並以系統返回關閉","Expected Result":"開啟該角色的放大預覽；⋯ 列出 「Download」 與 「Report」（自己的角色另有 「Delete」）；Download 將角色圖片存到手機相簿（記錄任何 toast）；Report 開啟檢舉流程，系統返回回到預覽；ⓧ 關閉預覽回到資料庫；⋯ 選單上的系統返回只關閉選單，預覽上的系統返回則與 ⓧ 一樣關閉預覽回到資料庫"},"TC-136":{"Section":"角色","Precondition":"Finish your characters，餘額低於 Generate 價格","Action":"點 Generate / Generate all","Expected Result":"開啟點數面板而不是產生","Notes":"Figma 流程箭頭 2811-90216"},"TC-137":{"Section":"建立我的角色","Precondition":"Create my character 因伺服器錯誤而失敗","Action":"點 「Got it」","Expected Result":"回到 Create my character，參考照片與描述仍保持填入","Notes":"Figma 流程箭頭 3172-66578；DRA262610P0131（Assigned，AIAgent）。Design 規格不同：角色失敗只提供 「Got it」（R-036，流程箭頭 3172-66578）；Retry 再 Edit 是場景影片規則（R-081）；以規格為準。真實斷網（REQ-020）— 該單預期 「The failure offers Retry, and after the repeated failure the action changes to Edit」；本列以規格為準（REQ-043）"},"TC-138":{"Section":"分鏡","Precondition":"Storyboard Result 已顯示","Action":"點場景卡片的縮圖；關閉場景；然後點卡片的文字（不是 View more）","Expected Result":"每次點擊都開啟該場景的場景詳情","Notes":"Figma 流程箭頭 2820-113560；REQ-022 線索 #1、#4、#27、#38、#39、S3（Android 報告 16.8.0）"},"TC-139":{"Section":"分鏡","Precondition":"Scene detail 有很長的腳本","Action":"在腳本內拖曳","Expected Result":"腳本在自己的區域內捲動","Notes":"Figma 流程箭頭 2820-113559"},"TC-140":{"Section":"分鏡","Precondition":"失敗場景的描述編輯器已開啟","Action":"點收合圖示","Expected Result":"回到重新產生的提供畫面，並保留編輯後的文字","Notes":"Figma 流程箭頭 3142-70055"},"TC-530":{"Section":"分鏡","Precondition":"失敗場景的描述編輯器已開啟且文字已編輯、鍵盤已升起（失敗場景上的 Edit）","Action":"使用系統返回（Android 返回手勢或按鈕）；然後再次使用系統返回","Expected Result":"第一次系統返回只關閉鍵盤，編輯器仍開著；第二次像收合圖示一樣關閉編輯器（TC-140）：回到帶有已編輯文字的重新產生提供畫面","Notes":"需要失敗的場景圖片，同 TC-140"},"TC-141":{"Section":"分鏡","Precondition":"失敗場景的重新產生提供畫面","Action":"點 「Regenerate Image」","Expected Result":"場景顯示骨架並重新產生；點數只扣一次","Notes":"Figma 流程箭頭 3142-70056"},"TC-427":{"Section":"分鏡","Precondition":"失敗的場景圖片（例如未改動的 「Merger Season」 影集的 Scene 5，或使用故障注入）；已擷取 log","Action":"開啟場景 › Edit，以新文字取代描述，Done，「Regenerate Image」；拉取 log","Expected Result":"替換的場景圖片使用已儲存的描述：TextToImage 請求帶有新文字","Notes":"DRA262610P0112（TRCreated，AIAgent）；實際看到：請求仍送出舊（接吻）提示詞"},"TC-428":{"Section":"分鏡","Precondition":"場景詳情顯示 「Regenerate Image」（場景上 Edit › Done；若無其他提供則使用失敗場景）；Wi-Fi 關閉且無行動網路（先在 USB 上以 Appium 確認）","Action":"點 「Regenerate Image」 並等待結果；之後立即重新開啟 Wi-Fi","Expected Result":"App 告知使用者檢查網路連線（例如 「You're offline. Check your connection and try again.」），而不是服務忙碌錯誤；不要求行內訊息；不扣款","Notes":"DRA262610P0123（NewCreated，AIAgent，UX）；真實斷網（REQ-020）"},"TC-491":{"Section":"分鏡","Precondition":"分鏡中至少有兩個失敗場景","Action":"編輯其中一個失敗場景並重新產生；產生期間開啟另一個失敗場景並重新產生","Expected Result":"兩個失敗場景可同時重新產生","Notes":"DRA262610P0241（NewCreated，UX）；同時重新產生沒有規格規則（PM 裁示待定）"},"TC-142":{"Section":"影片","Precondition":"範本 drama，分鏡已完成","Action":"產生完整影片並等待","Expected Result":"「Here's your drama.」 顯示已完成的影片及其 Edit 動作","Notes":"Figma 流程箭頭 2778-129154"},"TC-143":{"Section":"影片","Precondition":"聊天中有已完成的影片","Action":"點影片上的 Play","Expected Result":"開啟場景影片播放器並開始播放","Notes":"Figma 流程箭頭 2820-115460；Build 檢查 TR261021-0082 RD Note（2610212）；REQ-022 線索 #17、#19、#21、#48（Android 報告 16.8.0）"},"TC-434":{"Section":"影片","Precondition":"任一範本產生的完成影片（Seedance 2.0 Mini，字幕開啟），從 History（Recent task）開啟","Action":"播放整支影片並觀察男主角的服裝","Expected Result":"整支影片中男角色的服裝保持一致","Notes":"DRA262610P0154（TRCreated，Quality）；RD：服裝描述在分鏡前已與所選肖像同步（2610212 已修正）"},"TC-435":{"Section":"影片","Precondition":"任一範本產生的完成影片（Seedance 2.0 Mini，字幕開啟），從 History（Recent task）開啟","Action":"播放整支影片，比對每句台詞與嘴型及字幕","Expected Result":"音訊與影像同步：台詞與說話者的嘴型相符，字幕與台詞同時出現","Notes":"DRA262610P0155（Assigned，Quality）"},"TC-436":{"Section":"影片","Precondition":"任一範本產生的完成影片（Seedance 2.0 Mini，字幕開啟），從 History（Recent task）開啟","Action":"播放整支影片並觀察鏡頭之間的動作與連貫性（位置、門、座位）","Expected Result":"劇情合乎邏輯且一致：位置沒有突然跳躍，從前門進入的角色坐在前面","Notes":"DRA262610P0156（NewCreated，Quality）"},"TC-438":{"Section":"影片","Precondition":"以 Generate all 製作角色的範本影集（例如 A 呂布、B 關羽、C 張飛、D 劉備）；Seedance 2.0 › Preview - 30 sec 已完成","Action":"播放 Scene 3 並將每個角色與其肖像比對","Expected Result":"每個角色使用自己的圖像；角色 B（關羽）從不出現角色 C（張飛）的樣貌","Notes":"DRA262610P0161（ProposeNAB，Quality）"},"TC-439":{"Section":"影片","Precondition":"以 Generate all 製作角色的範本影集（例如 A 呂布、B 關羽、C 張飛、D 劉備）；Seedance 2.0 › Preview - 30 sec 已完成","Action":"播放 Scene 4 並將畫面與其字幕（「三英齊上, 也不過爾爾!」）比對","Expected Result":"場景符合字幕與劇情（三人一起進攻，而不是並排站著）","Notes":"DRA262610P0162（Propose Wont Fix，Quality）"},"TC-442":{"Section":"影片","Precondition":"以 Generate all 製作角色的範本影集（例如 A 呂布、B 關羽、C 張飛、D 劉備）；Seedance 2.0 › Preview - 30 sec 已完成","Action":"播放 Scene 4 並觀察角色的身體","Expected Result":"角色身體比例自然（上半身與下半身長度不會幾乎相等）","Notes":"DRA262610P0168（Propose Wont Fix，Quality）"},"TC-444":{"Section":"影片","Precondition":"以 Generate all 製作角色的範本影集（例如 A 呂布、B 關羽、C 張飛、D 劉備）；Seedance 2.0 › n":"角色","Precondition":"Choose Character 開啟在內建角色範本上","Action":"套用一個現成角色，然後點一個 App 拒絕的現成角色（例如穿奶油色連身衣的嬰兒），讀取錯誤 toast","Expected Result":"錯誤回饋在角色庫背景上仍清楚可讀","Notes":"DRA262610-0058（Assigned、AIFound、UI）；所見 toast 為原始文字「Character asset requires id, age 1..100, and gender」，以灰藍色顯示在縮圖上"},"TC-327":{"Section":"歷史記錄","Precondition":"History 已開啟","Notes":"文字與點擊外部由 TC-105 涵蓋","Action":"點 ⓘ 按鈕；使用系統返回；再使用一次系統返回","Expected Result":"資訊氣泡開啟，箭頭指向 ⓘ 按鈕且完整留在畫面內；第一次系統返回只關閉氣泡（記錄其行為，Q-A6），第二次如同其 ‹ 一樣離開 History，回到開啟 History 前的頁面"},"TC-328":{"Section":"範本","Precondition":"More 頁面已開啟","Action":"查看每個分類標題","Expected Result":"每個分類依 Design 顯示各自的圖示，而非重複同一個圖示"},"TC-332":{"Section":"建立我的角色","Precondition":"有效的 Create my character 表單","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）","Action":"點 Generate，觀察產生中的畫面並點變暗的「generating...」按鈕","Expected Result":"屬性標籤下方有「This usually takes about 1 minute.」；X 保持可用；Generating 按鈕下方有「Cancel」；「generating...」呈暗色，點它沒有反應"},"TC-333":{"Section":"建立我的角色","Precondition":"角色產生中","Action":"點「Cancel」，再點「Leave anyway」","Expected Result":"顯示「Stop and lose your credits?」/「This is still generating. If you leave now, it'll stop and the credits you've spent won't be refunded.」；Leave anyway 會停止產生；Credit Details 保留扣款且沒有退款列","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）"},"TC-334":{"Section":"建立我的角色","Precondition":"角色產生中","Action":"點 X，再點「Keep Generating」","Expected Result":"出現相同的對話框；Keep Generating 會關閉它且角色完成產生","Notes":"PM-only：尚無 Design frame（Design 2026-10-19）；建置檢查 TR261021-0082 RD 備註（2610212）"},"TC-431":{"Section":"建立我的角色","Precondition":"Create my character 中角色產生中","Action":"點 X，然後「Keep Generating」；使用系統返回（Android 返回手勢或按鈕），然後「Keep Generating」；再使用系統返回，然後在對話框上使用系統返回","Expected Result":"X 保持可用，X 與系統返回都詢問「Stop and lose your credits?」並讓使用者停止；Keep Generating 關閉對話框且角色完成；對話框上的系統返回如同「Keep Generating」關閉它，角色持續產生","Notes":"DRA262610P0147（NewCreated、AIFound、UX）：Generating 時 X 變灰且 Back 被忽略"},"TC-383":{"Section":"建立我的角色","Precondition":"角色產生中","Action":"點選面板外的深色區域，再點「Keep Generating」","Expected Result":"與點 X 時相同，出現「Stop and lose your credits?」；Keep Generating 會關閉它且角色完成產生"},"TC-335":{"Section":"建立我的角色","Precondition":"角色產生超過 5 分鐘仍未完成","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）","Action":"等待對話框出現，使用系統返回並記錄其行為；若對話框仍顯示，點「Close」","Expected Result":"「We couldn't create your character」/「This is taking longer than expected. Send us feedback and our support team will check your credits.」，附 Close / Send Feedback；系統返回如同 Close 關閉它（Q-A5）；Close 回到 Make your character，且描述與設定保留；Send Feedback 為藍色主按鈕"},"TC-336":{"Section":"建立我的角色","Precondition":"顯示逾時對話框","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）。未登入的分支（沒有 e-mail）不執行：測試帳號已登入","Action":"點「Send Feedback」並讀取表單（不要送出）；然後用系統返回離開表單而不送出","Expected Result":"Feedback 開在「AI Issues」，AI Feature Name 為「AI Mini Drama • Character generation」，問題為「My character took too long to generate and didn't finish, but my credits were used. Please help me check. Time: {date & time}」，描述為提示詞，且電子郵件已填入；不顯示 task ID 欄位；系統返回不送出即離開表單（記錄回到哪一頁）"},"TC-543":{"Section":"建立我的角色","Precondition":"Send Feedback 開在「AI Issues」，由逾時對話框的「Send Feedback」預先填入（TC-336）；在無法到達該對話框時（Android 沒有緩慢產生的測試條件），從角色的 ⋯ ›「Report」（TC-135）開啟並記錄開啟的是哪個表單","Action":"1. 點「General」，然後「AI Issues」。2. 點「What Prompt did you use?」，加入一個字，然後點欄位外。3. 清空電子郵件欄位並點「Submit」；然後把電子郵件輸回並點欄位外。4. 點新增圖片的方塊，用系統返回關閉選擇器。5. 點「Privacy Policy」，用系統返回回來。6. 點 ‹","Expected Result":"「General」顯示一般表單，「AI Issues」再次顯示 AI 表單（記錄預先填入的文字是否保留）；新增的字出現在欄位中，點欄位外會關閉鍵盤；電子郵件為空時「Submit」為暗色且不會送出；新增圖片的方塊開啟相片選擇器，系統返回關閉它並回到表單；「Privacy Policy」開啟隱私頁，系統返回回到表單；‹ 關閉 Send Feedback 且不送出","Notes":"PM-only：尚無 Design frame（PM 主流程 2613:28618，更新 9 4012:23497）。絕不點可用的「Submit」：它會向 CyberLink 支援送出真實回報。表單本身的系統返回：TC-336"},"TC-337":{"Section":"角色","Precondition":"Finish your characters 中有兩個角色產生中，一個已完成","Action":"點「Cancel」，再點「Leave anyway」","Expected Result":"出現「Stop and lose your credits?」；已完成的角色保留，未完成的停止；Credit Details 中沒有它的退款","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）。TC-041 涵蓋產生中的標題與完成文案"},"TC-403":{"Section":"角色","Precondition":"Finish your characters 產生兩個角色（「Creating 2 characters...」）","Action":"點「Cancel」，然後「Keep Generating」；使用系統返回（Android 返回手勢或按鈕），然後在對話框上再用系統返回；點 X，然後「Keep Generating」；再點 X，然後「Leave anyway」","Expected Result":"Cancel、X 與系統返回保持可用，且各自詢問「Stop and lose your credits?」/「This is still generating. If you leave now, it'll stop and the credits you've spent won't be refunded.」，附 Leave anyway / Keep Generating；對話框上的系統返回如同 Keep Generating 關閉它；Keep Generating 讓兩個角色繼續產生；Leave anyway 停止未完成的角色、保留已完成的，且 Credit Details 顯示沒有退款","Notes":"涵蓋範圍第 8 輪（面板出口 × 狀態）"},"TC-338":{"Section":"角色","Precondition":"Finish your characters 產生超過 5 分鐘仍未完成","Action":"等待對話框出現，再點「Send Feedback」（不要送出）","Expected Result":"顯示「We couldn't create your characters」及 Close / Send Feedback；feedback 的問題中註明角色數量","Notes":"PM-only：尚無 Design frame（Design 2026-10-19）；Android 單 DRA262610-0032（Assigned、AIFound）：Generate all 使面板被卡住 12–14 分鐘，沒有進度也無法取消（產生中的 Cancel/X：TC-403）"},"TC-339":{"Section":"建立我的角色","Precondition":"角色位原本已有造型；已為其產生新角色","Action":"點 X，再點「Discard」","Expected Result":"結果關閉；角色位保留先前的造型；新角色不在 Mine 中","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）。空的角色位由 TC-134 涵蓋"},"TC-340":{"Section":"建立我的角色","Precondition":"顯示「Discard this character?」","Action":"點「Keep」","Expected Result":"對話框關閉，已產生的角色留在畫面上","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）"},"TC-341":{"Section":"建立我的角色","Precondition":"顯示已產生的角色","Action":"點頁面上的「Discard」按鈕","Expected Result":"結果立即關閉且沒有對話框；角色未儲存到 Mine，也未套用","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）"},"TC-342":{"Section":"建立我的角色","Precondition":"顯示已產生的角色","Action":"將結果向下滑動","Expected Result":"與 X 相同：出現「Discard this character?」","Notes":"僅 PM：尚無 Design 畫面（Design 2026-10-19）"},"TC-401":{"Section":"建立我的角色","Precondition":"顯示已產生的角色","Action":"系統返回（Android 返回手勢或按鈕）；顯示對話框時再用一次系統返回","Expected Result":"與 X 相同：「Discard this character?」/「It won't be saved, and the credits you spent won't be refunded.」，附「Keep」與紅色「Discard」；對話框上的系統返回如同「Keep」關閉它，結果保留","Notes":"PM 10/21 §13.23 指明 Android 返回。PM-only：尚無 Design frame（Design 2026-10-19）"},"TC-343":{"Section":"影片","Precondition":"完整影片已完成","Action":"點「Export Full Video」；匯出時點另一個場景的縮圖；等待匯出結束","Expected Result":"匯出中：預覽中央有旋轉圖示，播放鈕隱藏，影片暫停；Full Edit、Export Full Video 與下載圖示停用（40%）；點縮圖會將預覽切到該場景且匯出繼續。完成後：一切恢復，toast「Saved to Gallery.」，且圖庫中合併後的影片是整部短劇，而非被點選的場景","Notes":"PM-only：尚無 Design frame（Design 2026-10-19）；Android 單 DRA262610P0219（Assigned、AIFound）：Export Full Video 開啟匯出面板，其 Estimated size 對 90 秒的一集顯示預覽的 51.6 MB（檔案 146–149 MB）；Design 規格不同：PM 10/20（R-249）匯出不經面板；以規格為準；Android 單 DRA262610P0239（NewCreated、AIFound、UX）：每次匯出後匯出面板都重設為 1080p / Standard / 30 fps；Design 規格不同：PM 10/20（R-249）匯出不經面板；以規格為準；Android 單 DRA262610P0243（Assigned、AIAgent）：「Export Full Video」開啟匯出面板而非直接匯出；REQ-022 線索 #16、#18、#32（Android 報告 16.8.0）；PM 10/22 匯出狀態（Figma 4418:2），比 PM 10/20 新；待 RD 確認背景匯出"},"TC-533":{"Section":"影片","Precondition":"完整影片已完成","Action":"點「Export Full Video」；若開啟匯出面板或設定頁，用系統返回（Android 返回手勢或按鈕）離開；再點「Export Full Video」並讓匯出完成；若開啟完成頁，用系統返回離開","Expected Result":"系統返回關閉匯出面板且不匯出，結果頁不變；完成頁關閉後回到結果頁，且影片在圖庫中只有一份。規格兩種頁面都沒畫（PM 10/22：匯出在結果頁以旋轉圖示執行，R-324）：記錄 build 顯示什麼（Q-A6）","Notes":"Android 單 DRA262610P0219（TC-343）：build 開啟匯出面板"},"TC-517":{"Section":"影片","Precondition":"完整影片已完成，結果頁開啟","Action":"點「Export Full Video」，立刻點 ←，並在聊天停留直到匯出結束；然後再點「Export Full Video」，用系統返回（Android 返回手勢或按鈕）回到聊天，再回到 AI Mini Drama 首頁，並在那裡等待","Expected Result":"匯出期間 ← 與系統返回都有效；每次匯出都在背景繼續，且「Saved to Gallery.」顯示在使用者所在的頁面（先是聊天，再是首頁）；圖庫中有兩部影片","Notes":"PM 10/22 匯出狀態（Figma 4418:2），比 PM 10/20 新；待 RD 確認背景匯出（Q-A9）。若 RD 讓匯出留在前景，則 Back 顯示「Stop exporting?」/「Your video won't be saved.」（Keep exporting / Stop）"},"TC-518":{"Section":"影片","Precondition":"完整影片已完成，結果頁開啟；已先確認 Appium 透過 USB 連線","Action":"點「Export Full Video」，在完成前關閉 Wi-Fi 並讀取結果；重新開啟 Wi-Fi 並再點「Export Full Video」","Expected Result":"第一次匯出以 toast「Couldn't save your video. Try again.」結束；旋轉圖示消失，←、「Full Edit」、「Export Full Video」、下載圖示、播放與縮圖都恢復可用；第二次匯出成功（「Saved to Gallery.」）","Notes":"PM 10/22 匯出狀態（Figma 4418:2），比 PM 10/20 新。真實斷網（REQ-020）；之後立刻恢復 Wi-Fi。若離線時匯出仍成功（本機合併），此列維持擱置（fault-injection：A

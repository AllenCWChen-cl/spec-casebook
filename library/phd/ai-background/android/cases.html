<style>
/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#1b2430; --muted:#5f6b7a; --line:#dde1e7; --head:#2f3b52;
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
  --body:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e5e9ef; --muted:#9aa5b3; --line:#2c3541; --head:#0d1117;
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
header{background:var(--head);color:#fff;padding:18px 20px;display:grid;gap:8px}
header h1{margin:0;font-size:1.35rem}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;opacity:.9}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 20px 110px;display:grid;gap:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1150px;background:var(--surface)}
th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:13px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
</style>
</head>

  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec">Copy decisions</button>
    <button class="btn primary" id="save">Save as approved table</button>
  </span>
</footer>

he prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓","Action":"Tap Generate and watch the room for the first 10 s","Expected Result":"The room stays open and shows 「Analyzing your image...」 from 0 to 10 s","Priority":"P1","Spec Ref":"R-030, R-032","Notes":"PM-only. Time with a stopwatch or a screen recording"},{"ID":"TC-027","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped (same run as TC-026)","Action":"Keep watching from 10 to 20 s","Expected Result":"The room shows 「Understanding the scene...」","Priority":"P2","Spec Ref":"R-033","Notes":"PM-only. Blocked if the result arrives first"},{"ID":"TC-028","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped (same run as TC-026)","Action":"Keep watching from 20 to 30 s","Expected Result":"The room shows 「Creating the new background...」","Priority":"P2","Spec Ref":"R-034","Notes":"PM-only. Blocked if the result arrives first"},{"ID":"TC-029","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped (same run as TC-026)","Action":"Keep watching from 30 to 40 s","Expected Result":"The room shows 「Refining the details...」","Priority":"P2","Spec Ref":"R-035","Notes":"PM-only. Blocked if the result arrives first"},{"ID":"TC-030","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped (same run as TC-026)","Action":"Keep watching from 40 to 45 s","Expected Result":"The room shows 「Making the final adjustments...」","Priority":"P2","Spec Ref":"R-036","Notes":"PM-only. Blocked if the result arrives first"},{"ID":"TC-031","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped (same run as TC-026)","Action":"Keep watching after 45 s until the result arrives","Expected Result":"The room shows 「Almost done!」 from 45 s until the result shows","Priority":"P2","Spec Ref":"R-037","Notes":"PM-only. Blocked if the result arrives first. KP-060: judge the waiting UI, not the duration"},{"ID":"TC-032","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped","Action":"Look at the room during the wait","Expected Result":"The user waits in the room: no My Artwork button, link or toast and no 「continue in the background」 notice appears","Priority":"P2","Spec Ref":"R-030","Notes":"PM-only"},{"ID":"TC-033","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; note the credit balance","Action":"Tap Generate and wait for the result","Expected Result":"The canvas shows the subject on a new background matching the prompt; the credit pill shows the balance minus 5","Priority":"P1","Spec Ref":"R-039, R-041, R-042","Notes":"PM-only price 5 (Q-1); credit numbers are binding"},{"ID":"TC-034","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); a template selected; note the credit balance","Action":"Tap Generate and wait for the result","Expected Result":"A wait indicator shows while generating; the canvas then shows the subject on the template's background; the credit pill shows the balance minus 2","Priority":"P1","Spec Ref":"R-038, R-040, R-042","Notes":"Design price 2 (Q-1); template wait copy: Q-14"},{"ID":"TC-035","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); a background generated (template or Custom) and shown on the canvas","Action":"Tap undo, then redo","Expected Result":"Undo brings back the canvas before the generation and enables redo; redo shows the generated result again","Priority":"P2","Spec Ref":"R-009","Notes":""},{"ID":"TC-036","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); a background generated (template or Custom) and shown on the canvas","Action":"Tap ✓ in the bottom bar","Expected Result":"The room closes and the editor shows the photo with the generated background","Priority":"P1","Spec Ref":"R-010","Notes":"Current-app behaviour"},{"ID":"TC-037","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); a background generated (template or Custom) and shown on the canvas","Action":"Tap X in the bottom bar (answer any discard prompt with discard)","Expected Result":"The room closes and the editor shows the photo without the generated background","Priority":"P2","Spec Ref":"R-010","Notes":"Current-app behaviour; a discard prompt, if any, is not specified"},{"ID":"TC-038","Section":"Generation and waiting","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; note the credit balance; Generate tapped","Action":"During the wait, press Home, wait 20 s and open PhotoDirector again","Expected Result":"The room shows the generation still going or its result; it is not silently lost, and credits are only charged if the result is delivered","Priority":"P2","Spec Ref":"R-031","Notes":"Spec: handled as in AI Enhance (Q-7). User QA rule: leave and return keeps the task"},{"ID":"TC-039","Section":"Free trial","Precondition":"Android phone, an account that has never used the AI Background free trial (fresh account or reset by RD); a portrait photo in the gallery","Action":"Open a photo, open 「Background」 and select a template","Expected Result":"The CTA reads 「1 Free Trial」 with the price shown as 「2 → 0」 (2 struck through); the paid price does not flash first","Priority":"P1","Spec Ref":"R-045, R-046","Notes":"needs a fresh trial (park until an account is available). KB KP-016"},{"ID":"TC-040","Section":"Free trial","Precondition":"Android phone, an account that has never used the AI Background free trial (fresh account or reset by RD); a portrait photo in the gallery; 「1 Free Trial」 showing; note the credit balance","Action":"Tap 「1 Free Trial」 and wait for the result","Expected Result":"The new background is generated; the balance does not change (0 credits charged); the CTA then shows the paid 「Generate」 with its price","Priority":"P1","Spec Ref":"R-045, R-046","Notes":"needs a fresh trial"},{"ID":"TC-041","Section":"Free trial","Precondition":"Android phone, an account that has never used the AI Background free trial (fresh account or reset by RD); a portrait photo in the gallery; the free trial used (TC-040)","Action":"Leave AI Background, open it again with another photo and select a template","Expected Result":"The CTA shows the paid 「Generate」 with 「2」, never 「1 Free Trial」","Priority":"P2","Spec Ref":"R-046","Notes":"needs a fresh trial. KB KP-016"},{"ID":"TC-042","Section":"Feature and Action IDs","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); app log collection on (PhotoDirector log pull not set up yet); a prompt confirmed after erasing part of the subject","Action":"Tap Generate, wait for the result, pull the app log and find the generation request","Expected Result":"The request carries Feature ID 「PeopleBackgroundV3」 and Action ID 「genimage_1_img_bytedance_seedream5.0pro_none_custom」, and the uploaded image is the app's cut-out with the erased part missing","Priority":"P2","Spec Ref":"R-004, R-050, R-051","Notes":"needs app-log (parked: no PhotoDirector log pull yet)"},{"ID":"TC-043","Section":"Feature and Action IDs","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); app log collection on (PhotoDirector log pull not set up yet); a template selected","Action":"Tap Generate, wait for the result, pull the app log and find the generation request","Expected Result":"The request carries Feature ID 「PeopleBackgroundV3」 and Action ID 「genimage_1_img_bytedance_seedream5.0pro_none_tmpl」","Priority":"P2","Spec Ref":"R-050, R-052","Notes":"needs app-log"},{"ID":"TC-044","Section":"Feature and Action IDs","Precondition":"Android phone, an account that has never used the AI Background free trial (fresh account or reset by RD); a portrait photo in the gallery; app log collection on","Action":"Generate with 「1 Free Trial」, pull the app log and find the generation request","Expected Result":"The request carries the task ID 「temp_one_time_free」","Priority":"P2","Spec Ref":"R-047","Notes":"needs app-log and a fresh trial"},{"ID":"TC-045","Section":"Themes","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); the app in the appearance that shows the light Design (Q-9)","Action":"Look at the room","Expected Result":"The room matches Design frame 「6」: light bars and thumbnail strips, orange-tinted credit pill, the same controls in the same places as the dark room","Priority":"P3","Spec Ref":"R-055","Notes":"Q-9: which setting shows it; Blocked if the app has no light appearance"},{"ID":"TC-046","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open","Action":"Press system Back once, then once more","Expected Result":"The first Back closes the keyboard; the second closes the panel and the room stays open (Custom not selected unless a prompt was confirmed)","Priority":"P2","Spec Ref":"R-060","Notes":"Rule: Back closes the keyboard first; the panel's own exits are tap outside and ✓"},{"ID":"TC-047","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); 「Custom」 tapped and the prompt panel open; a prompt typed (e.g. 「a sunny beach at sunset」) and the panel closed with ✓; Generate tapped","Action":"Press system Back during the wait","Expected Result":"Back does what AI Enhance does during its wait (Q-7): it never leaves silently with the generation lost; any dialog it shows names what happens to the credits","Priority":"P2","Spec Ref":"R-061","Notes":"Q-7"},{"ID":"TC-048","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); a background generated (template or Custom) and shown on the canvas","Action":"Press system Back","Expected Result":"Same as the bottom bar X: the room closes without applying the result (or asks first, as X does)","Priority":"P2","Spec Ref":"R-062","Notes":""},{"ID":"TC-049","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); ⓘ information open","Action":"Press system Back","Expected Result":"The information closes and the room shows again, unchanged","Priority":"P3","Spec Ref":"R-063","Notes":""},{"ID":"TC-050","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); the credit purchase page open from the credit pill","Action":"Press system Back","Expected Result":"The purchase page closes and the room shows again, unchanged","Priority":"P3","Spec Ref":"R-063","Notes":"Never buy credits"},{"ID":"TC-051","Section":"Android system Back","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); the eraser (or crop) tool open","Action":"Press system Back","Expected Result":"The tool closes the same way as its own cancel and the room shows again","Priority":"P3","Spec Ref":"R-063","Notes":""},{"ID":"TC-052","Section":"Android credits and artwork","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); one template generation finished (TC-034)","Action":"Tap the credit pill, then 「Detail」 at the top right of Buy Credit","Expected Result":"The newest entry is the AI Background use, under the feature's name, with 2 credits deducted","Priority":"P2","Spec Ref":"R-064","Notes":"KB KP-017"},{"ID":"TC-053","Section":"Android credits and artwork","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); a template selected; note the credit balance","Action":"Tap Generate three times quickly","Expected Result":"One generation starts and one result arrives; the balance goes down by 2 only once","Priority":"P1","Spec Ref":"R-065","Notes":"KB KP-019 (seen on AI Expand)"},{"ID":"TC-054","Section":"Android credits and artwork","Precondition":"Android phone, PhotoDirector signed in with at least 20 credits; a portrait photo in the gallery. Open the photo in the editor and open 「Background」 (AI Background); one generation finished (TC-033 or TC-034)","Action":"Open My AI Artwork (AI Photos › My Artwork) and look for the result","Expected Result":"The generated image is saved there under the feature's own tab","Priority":"P2","Spec Ref":"R-066","Notes":"KB KP-024; Q-15 (PM removes only the entry during the wait)"},{"ID":"TC-055","Section":"Android credits and artwork","Precondition":"Android phone, PhotoDirector signed in; a portrait photo open in the editor with another edit applied (e.g. Adjustments › Brightness +50)","Action":"Open 「Background」 (AI Background)","Expected Result":"The canvas shows the cut-out of the edited (brighter) photo, not the original file","Priority":"P2","Spec Ref":"R-067","Notes":"KB KP-032"}],"previous":{},"requirements":"# AI Background — requirements (android)\nSpec: Background - PM Spec.pdf (PM, received 2026-11-03; boards pm-custom, pm-room, pm-cms) · AI-Background Design Figma\n(page 1:77: frames 「5」 dark, 「6」 light, thumbnail states 「Frame 4922」 / 「Frame 4923」; read 2026-11-03 through figma-design)\n\nSource order: Design, then PM. The Design file draws only the room (no prompt panel, no waiting state), so everything\nabout the Custom prompt panel and the wait is PM-only (pass 7). The PM Figma file could not be opened (no access for\nqa1 or qa-dm), so the PM is read from its PDF (`figma-pending.json`, Q-13).\n\n## Entry and room\n- R-001 [PM:pm-custom; DS:figma 5 1:451] Opening AI Background keeps the current flow: the app removes the photo's background itself and the canvas shows the subject on a checkerboard (transparent) background.\n- R-002 [PM:pm-custom; DS:figma 5 editing_area/ic_eraser_n] The eraser button at the canvas's lower left lets the user erase (smear out) parts of the cut-out subject, and the canvas shows the change.\n- R-003 [PM:pm-custom; DS:figma 5 ic_crop_n 5:482] The crop button next to the eraser lets the user crop the cut-out subject, and the canvas shows the cropped subject.\n- R-004 [PM:pm-custom] The image the app sends to the server for a generation is its own cut-out of the subject, after the user's crop and erase (the server does not remove the background again).\n- R-005 [DS:figma 5 1:451] Room layout, top to bottom: top bar with ⓘ at the left and the credit pill (balance and ⊕) at the right; the canvas with eraser and crop at its lower left and compare at its lower right; the category tabs; the thumbnail row; the Generate button with its credit price; the bottom bar with X, undo, redo and ✓.\n- R-006 [DS:figma 5 top/ic_info] The ⓘ button in the top bar opens the feature's information; closing it returns to the room unchanged.\n- R-007 [DS:figma 5 btn_add_credit; KB:KP-020] The credit pill shows the current credit balance with ⊕; tapping it opens the credit purchase page, and coming back returns to the room unchanged.\n- R-008 [DS:figma 5 On-screen/btn_BA_n 5:420] Pressing and holding the compare button at the canvas's lower right shows the photo before the change; releasing it shows the current result again.\n- R-009 [DS:figma 5 bottom_action/4icons 4:158; PM:pm-room screenshot; KB:KP-041] The bottom bar shows X, undo, redo and ✓; undo and redo are dimmed until there is something to undo or redo.\n- R-010 [DS:figma 5 bottom_action/4icons; PM:pm-room screenshot; KB:KP-030] ✓ applies the room's result (exactly as last previewed) to the photo and returns to the editor; X leaves the room without applying it. (Current-app behaviour of the bottom bar both specs draw; the spec states no change to it.)\n\n## Category tabs and thumbnails\n- R-011 [DS:figma 5 capsuleTab_box 1:541; PM:pm-room 「category 選取狀態」] Categories are capsule tabs in one row; the selected tab has an orange fill. The Design draws 「Custom」, 「Neutrals」, 「Ballon」, 「Wood」, 「Vintage」, 「Life」 (the actual-app screenshot spells 「Balloon」, Q-2; the category list comes from CMS, Q-8).\n- R-012 [PM:pm-room 「Custom 的橘色泡泡太貼近螢幕邊緣」; DS:figma 5 tab-03 1:546] The selected 「Custom」 capsule no longer touches the screen's left edge: the Design places it 12 pt from the edge, the same inset as the thumbnails.\n- R-013 [PM:pm-room 「thumbnail 大小」; DS:figma 5 thumb/80x80/withname/regular 24:723] Each thumbnail is an 80 × 80 pt image with its name in a strip below it (80 × 98 pt in all), 4 pt apart (smaller than the current app's thumbnails).\n- R-014 [DS:figma 5 24:723, sep 1:888] The 「Custom」 thumbnail (orange gradient with a magic-wand icon) comes first, then a vertical separator, then the templates.\n- R-015 [DS:figma Frame 4922 / 4923] A premium template shows a crown badge at its top right.\n- R-016 [DS:figma Frame 4922 / 4923; DS:figma 5 Lomo 26:968] The selected thumbnail has an orange stroke; the others have none.\n- R-017 [DS:figma 5 capsuleTab_box] Tapping a category tab selects it (orange fill) and shows that category's templates in the thumbnail row.\n\n## Custom prompt panel (PM-only: no Design frame yet)\n- R-020 [PM:pm-custom 「Click Custom → 喚起打字 panel (current: click Custom → 開啟新的房間)」] Tapping the 「Custom」 thumbnail opens the typing panel with the keyboard in the same room; it no longer opens a new room.\n- R-021 [PM:pm-custom mockup 2] The panel shows the title 「Prompts」, a 「My Prompts」 button, a ✓ button, the text box with the placeholder 「Please describe the content to replace (guitar, flower, chair)」, an expand button at the text box's top right, a delete (trash) button at its lower left and the counter 「0/2,500」.\n- R-022 [PM:pm-custom mockups 2–3] While the text box is empty, ✓ and the trash button are dimmed; once there is text, ✓ turns orange and the trash button is active.\n- R-023 [PM:pm-custom mockup 3] The counter shows the number of characters typed out of 2,500 (e.g. 「120/2,500」).\n- R-024 [PM:pm-custom 「0/2,500」] The prompt holds at most 2,500 characters: typing or pasting more stops at 2,500 and the counter shows 「2,500/2,500」.\n- R-025 [PM:pm-custom 「設有 expand/ delete btn」, mockup row 2] The expand button opens the text box at full height, showing the whole prompt, with the trash button still at its lower left.\n- R-026 [PM:pm-custom 「設有 expand/ delete btn」] The trash button clears the prompt; the counter returns to 「0/2,500」.\n- R-027 [PM:pm-custom 「& My Prompt」] The panel has a 「My Prompts」 button (title: 「add My Prompt」); what it opens is not described (Q-4).\n- R-028 [PM:pm-custom 「click 空白處 or 勾勾→ panel 不見, Custom 為 selected 狀態 (橘色 stroke), ready for generation」] Tapping a blank area outside the panel, or ✓, closes the panel; the 「Custom」 thumbnail is then selected (orange stroke) and Generate is ready (enabled, orange, with its price).\n- R-029 [PM:pm-custom mockup 1] Before a Custom prompt is confirmed (the Custom tab open, no thumbnail selected), Generate is dimmed.\n\n## Generation and waiting\n- R-030 [PM:pm-custom 「不走 long task, 讓用戶在房間等, 不設有 my artwork 入口」] A Custom generation is not a long task: the user waits in the room, and no My Artwork entry (button, toast or link) is offered during the wait.\n- R-031 [PM:pm-custom 「等待途中的 handle 方式同 GAI Enhance」] What happens when the user leaves or interrupts during the wait is the same as in AI Enhance (Q-7: the spec does not restate it); leaving and coming back never silently loses the generation or its credits.\n- R-032 [PM:pm-custom] From 0 to 10 s of the wait the room shows 「Analyzing your image...」.\n- R-033 [PM:pm-custom] From 10 to 20 s it shows 「Understanding the scene...」.\n- R-034 [PM:pm-custom] From 20 to 30 s it shows 「Creating the new background...」.\n- R-035 [PM:pm-custom] From 30 to 40 s it shows 「Refining the details...」.\n- R-036 [PM:pm-custom] From 40 to 45 s it shows 「Making the final adjustments...」.\n- R-037 [PM:pm-custom] After 45 s it shows 「Almost done!」 until the result arrives.\n- R-038 [DS:figma 5; PM:pm-room screenshot] Selecting a template and tapping Generate generates a new background from that template in the room, and the canvas shows the subject on it.\n- R-039 [PM:pm-custom 「ready for generation」] Tapping Generate with a confirmed Custom prompt generates a new background from the prompt, and the canvas shows the subject on it.\n- R-040 [DS:figma 5 btn_credit_primary_1row 5:461] With a template selected, the Generate button reads 「Generate」 with the credit icon and 「2」, and a template generation charges 2 credits (Q-1).\n- R-041 [PM:pm-custom mockup 4 「Generate 5」] With a confirmed Custom prompt, the Generate button shows 「5」 credits, and a Custom generation charges 5 credits (PM-only; differs from the Design's 「2」, Q-1).\n- R-042 [Rule: credit numbers binding] After a charged generation the credit pill's balance goes down by exactly the price shown on Generate.\n\n## Free trial\n- R-045 [PM:pm-room screenshot 「1 Free Trial」; PM:pm-cms 「First time free trial task ID」] On a user's first use, the CTA reads 「1 Free Trial」 with the price shown as 「2 → 0」 (the 2 struck through).\n- R-046 [PM:pm-cms; KB:KP-016] The free trial is a one-time use: generating with it charges 0 credits; afterwards the CTA shows the paid Generate with its price and never 「1 Free Trial」 again, and on entry the CTA never flashes the paid price before showing 「1 Free Trial」.\n- R-047 [PM:pm-cms] A free-trial generation is sent with the task ID 「temp_one_time_free」.\n\n## Feature and Action IDs\n- R-050 [PM:pm-cms] AI Background generations are sent under the Feature ID 「PeopleBackgroundV3」.\n- R-051 [PM:pm-cms; KB:KP-036] A Custom generation is sent with the prompt exactly as typed and with the Action ID 「genimage_1_img_bytedance_seedream5.0pro_none_custom」 (model Seedream 5.0 Pro).\n- R-052 [PM:pm-cms] A template generation is sent with the Action ID 「genimage_1_img_bytedance_seedream5.0pro_none_tmpl」.\n- R-053 [PM:pm-cms 「CMS type TBD」] The CMS type for the categories and templates is not decided — NOT TESTABLE: TBD in the spec (Q-8).\n\n## Themes\n- R-055 [DS:figma 5 1:451, 6 11:248] The Design draws the room in a dark version (「5」: black bars, dark thumbnail strips) and a light version (「6」: light bars, orange-tinted credit pill, light thumbnail strips); each shows the same controls in the same places (Q-9: which app setting shows the light version).\n\n## Android: credits, artwork and entry (domain rules)\n- R-064 [KB:KP-017] After a charged AI Background generation, Buy Credit › Detail lists the use under the AI Background feature name with the credits deducted.\n- R-065 [KB:KP-019] Tapping Generate several times quickly starts one generation and charges once.\n- R-066 [KB:KP-024] A finished, charged AI Background image is saved to My AI Artwork under the feature's own tab (the PM removes only the My Artwork entry during the wait, Q-15).\n- R-067 [KB:KP-032] Opened from the editor after another edit, AI Background starts from the edited image, not the original file.\n\n## Android system Back (pass 8, REQ-051 rule)\n- R-060 [Rule: Android system Back] System Back with the prompt panel open closes the keyboard first, then the panel; it does not leave the room.\n- R-061 [Rule: Android system Back; PM:pm-custom] System Back during the wait behaves as AI Enhance does during its wait (Q-7): it never leaves with the generation silently lost.\n- R-062 [Rule: Android system Back] System Back on the room with a result does what the bottom bar X does.\n- R-063 [Rule: Android system Back] System Back on the ⓘ information, the credit purchase page and the eraser / crop tools closes them like their own close or cancel and returns to the room.\n\n## Open questions\n- Q-1 Credits: the Design's Generate shows 「2」 (template selected), the PM Custom mockup shows 「5」, and the actual-app screenshot shows the free trial as 「2 → 0」. Is a Custom generation 5 credits and a template 2? R-040, R-041, R-045. Credit numbers are binding: the rows follow the Design for templates and the PM for Custom until PM answers.\n- Q-2 The Design spells the third category 「Ballon」; the actual-app screenshot shows 「Balloon」. The row expects 「Balloon」. R-011.\n- Q-3 In the Design's frame 「5」 the template 「Lomo」 is selected but Generate looks dimmed; the PM mockup with Custom confirmed shows Generate orange. Is Generate enabled whenever a thumbnail is selected? R-028, R-029, R-040.\n- Q-4 What does 「My Prompts」 open (saved prompts, saving the current prompt)? Is the typed prompt kept on return? R-027.\n- Q-5 Tapping a blank area (or ✓, if it is not disabled) with an empty text box: is 「Custom」 selected with no prompt, or does the panel just close? R-022, R-028.\n- Q-6 Tapping 「Custom」 again after a prompt was confirmed or generated: does the panel open with the previous prompt? R-020.\n- Q-7 「Handled the same as GAI Enhance」 during the wait: is there a cancel / Stop, a leave dialog, what happens on Home or app switch, and what happens to the credits? R-031.\n- Q-8 CMS type TBD: which categories and templates ship, in which order, and which are premium? R-011, R-053.\n- Q-9 Which app or system setting shows the light Design (frame 「6」)? R-055.\n- Q-10 What does a Free user get when tapping a premium (crown) template: Generate with credits, or a subscription page? R-015 (no tier rule stated, KB KP-013).\n- Q-11 Failures are not specified: error copy, refund, retry for a failed Custom or template generation and a failed background removal. Job states grid.\n- Q-12 The PM prompt-panel mockups 2–3 show a top bar with back, home, credits and a history icon; the Design and the actual-app screenshot show ⓘ and credits. The rows follow the Design. R-005.\n- Q-13 The PM Figma file (rCJRmOYzvMhbhTIA7bJjid) is not shared with qa1@cyberlink.com or qa-dm@cyberlink.com, so the PM was read from its PDF only: PM frames newer than the PDF export may be missing (step 8 owed for the PM file).\n- Q-15 The PM says no My Artwork entry during the wait; does the result still save to My AI Artwork (KB KP-024) and appear in Recent (KB KP-027)? R-066.\n- Q-14 Do the progress messages (R-032 – R-037) also show for a template generation, and what does a template wait look like? R-038.\n\n## Added 2026-11-03 — coverage passes and standing inputs\n\n### Flow arrows walked by existing rows\nNeither the Design file nor the PM PDF draws flow arrow function md(src){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const out=[];let list=false,table=null;
  const flush=()=>{if(list){out.push('</ul>');list=false}if(table){out.push('<table>'+table.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');table=null}};
  for(const line of src.split(/\r?\n/)){
    const l=line.trim();
    if(/^\|/.test(l)){if(/^\|[\s:|-]+\|?$/.test(l))continue;if(list){out.push('</ul>');list=false}(table??=[]).push(l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue}
    if(table)flush();
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){flush();out.push(`<h${Math.min(4,h[1].length+1)}>${inline(h[2])}</h${Math.min(4,h[1].length+1)}>`);continue}
    if(/^[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.replace(/^[-*]\s+/,''))}</li>`);continue}
    flush();if(l)out.push(`<p>${inline(l)}</p>`);
  }
  flush();return out.join('');
}

  return L.join('\n');
}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast(label+' copied.')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' copied.')}catch(_){toast('Copy failed; select the text manually.')}ta.remove()}}
$('#copyCsv').onclick=()=>{copy(csv(),'Final CSV');if(liveNotes().length)setTimeout(()=>toast('Final CSV copied. New-case notes are not rows yet: use Copy decisions or Save to hand them over.'),50)};
$('#copyDec').onclick=()=>copy(decisionText(),'Decisions');
$('#save').onclick=async()=>{
  const empty=finalRows().filter(r=>!r.Action||!r['Expected Result']);
  if(empty.length){toast(`Fill in Action and Expected Result for ${empty.map(r=>r.ID).join(', ')} before saving.`);return}
  $('#save').disabled=true;
  try{const res=await fetch('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows:finalRows(),decisions:decisions(),summary:decisionText(),notes:liveNotes()})});
    const j=await res.json();if(!res.ok)throw new Error(j.error||res.statusText);
    try{localStorage.removeItem(KEY)}catch(e){}
    const nn=liveNotes().length;notes=[];body();counts();
    toast(`Saved as approved version ${j.version}: ${j.cases} cases. ${j.csv}`+(nn?` · ${nn} new-case note${nn>1?'s':''} saved to ${j.notes_file}: ask the agent to turn them into the next draft.`:''));
  }catch(e){toast('Save failed: '+e.message)}finally{$('#save').disabled=false}
};
// #TC-012 (a link from the coverage page): show that row, clearing filters that hide it
let focusId='';
function focusRow(){
  const id=decodeURIComponent(location.hash.slice(1));const r=rows.find(x=>x.cur.ID===id);if(!r)return;
  focusId=id;if(!visible(r)){F.q='';F.section='';F.change='';F.state='';filters()}body();
  document.querySelector(`tr[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'});
}
addEventListener('hashchange',focusRow);
header();filters();body();counts();focusRow();
</script>
